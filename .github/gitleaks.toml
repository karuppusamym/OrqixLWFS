# gitleaks configuration for CI (stage 4 secret scan): the default rules plus a narrow allowlist.
title = "Orqix gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Documented dev-only test values for the local Compose stack (realm users, client secrets). Never reused."
paths = [
  '''deploy/compose/keycloak/orqix-dev-realm\.json''',
  '''deploy/compose/docker-compose\.yml''',
  '''deploy/compose/\.env\.example''',
]

[[allowlists]]
description = "Synthetic values that tests use on purpose: a placeholder Slack URL that the redaction test must hide, and the local e2e harness's default inbound secret. Neither is a real credential."
regexes = [
  '''https://hooks\.slack\.com/services/T00000000/B00000000/X{24}1a''',
  '''e2e-inbound-secret-0123456789abcdef''',
]

[[allowlists]]
description = "Fixed field-protection keys for the dev and test profiles only (S151). Values only in application-dev.yaml and application-test.yaml; production keys come from mounted secrets."
regexes = [
  '''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=''',
  '''ZGV2LW9ubHktZmllbGQta2V5LWRvLW5vdC11c2UtISE=''',
  '''0123456789abcdef0123456789abcdef''',
]
