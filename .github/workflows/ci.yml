# Orqix CI - reference implementation of docs/build/S1-engineering-baseline.md section 7, stages 1-5.
# The stages and gates are tool-neutral; decision D15 may move them to Jenkins or OpenShift Pipelines.
#
#   stage 1 contracts            -> job `contracts` (+ `deploy-manifests`, `procurement-stub`: owned tooling)
#   stage 2 backend              -> job `backend`
#   stage 3 frontend             -> job `frontend`
#   stage 4 image + SBOM + scans -> jobs `image` (build, SBOM, vulnerability scan) and `secret-scan`
#   stage 5 e2e                  -> job `e2e` (Compose stack with the built image, then Playwright from tests/e2e)
# Stages 6 (resilience, nightly) and 7 (deploy to int) are separate pipelines.
#
# Action references are pinned to full release tags (verified 2026-10-08). Tool versions are pinned where they are
# fetched by npx.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  REDOCLY_CLI_VERSION: "2.60.0"
  CYCLONEDX_NPM_VERSION: "6.0.1"
  CYCLONEDX_MAVEN_PLUGIN_VERSION: "2.9.3"
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.7.0
  IMAGE: orqix/orqix:ci

jobs:
  # --------------------------------------------------------------------------------------------------------------------
  # Stage 1 - contracts. Schema/fixture/OpenAPI consistency, then Redocly lint. The backend test ContractFixturesTest
  # runs in stage 2.
  # --------------------------------------------------------------------------------------------------------------------
  contracts:
    name: "1 Contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/contract-check/requirements.txt

      - name: Install contract-check dependencies
        run: pip install -r tools/contract-check/requirements.txt

      - name: Schemas, examples, compiler fixtures and OpenAPI structure
        run: python tools/contract-check/contract_check.py

      - name: Migration equivalence comparator and evidence pack (offline, standard library only)
        run: python -m unittest discover -s tools/migration-equivalence -p "test_*.py"

      - name: External worker and native async agent protocols (local fixtures, standard library only)
        run: python -m unittest discover -s tools/worker-sdk -p "test_*.py"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Redocly lint
        run: npx --yes @redocly/cli@${{ env.REDOCLY_CLI_VERSION }} lint --config .github/redocly.yaml contracts/openapi.yaml

  # --------------------------------------------------------------------------------------------------------------------
  # Owned tooling and deployment artifacts: the stub's own tests and the OpenShift manifests.
  # --------------------------------------------------------------------------------------------------------------------
  procurement-stub:
    name: "1 Procurement stub tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: tools/procurement-stub/pom.xml
      - name: Verify (unit + real-HTTP tests of every endpoint and fault mode)
        working-directory: tools/procurement-stub
        run: sh ./mvnw -B -ntp verify

  deploy-manifests:
    name: "1 OpenShift manifests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tools/validate-manifests/requirements.txt
      - name: Structural checks over the dev, int and prod overlays
        run: python tools/validate-manifests/validate_manifests.py
      - name: Schema validation (Kubernetes 1.31; Route has no published schema and is checked structurally above)
        run: |
          for overlay in dev int prod; do
            echo "== $overlay"
            kubectl kustomize "deploy/openshift/overlays/$overlay" \
              | docker run --rm -i "$KUBECONFORM_IMAGE" -strict -ignore-missing-schemas -kubernetes-version 1.31.0 -summary -
          done
      - name: Compose file parses
        working-directory: deploy/compose
        run: docker compose --profile app config --quiet

  # --------------------------------------------------------------------------------------------------------------------
  # Stage 2 - backend. Unit, Spring Modulith/ArchUnit, golden files and Testcontainers integration tests
  # (Docker is available on ubuntu runners). The compiler module carries the 90 % line-coverage gate.
  # --------------------------------------------------------------------------------------------------------------------
  backend:
    name: "2 Backend"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Verify
        working-directory: backend
        run: sh ./mvnw -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            backend/**/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # --------------------------------------------------------------------------------------------------------------------
  # Stage 3 - frontend.
  # --------------------------------------------------------------------------------------------------------------------
  frontend:
    name: "3 Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match contracts/openapi.yaml
        run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --------------------------------------------------------------------------------------------------------------------
  # Stage 4 - image, SBOMs and vulnerability scan. Gate: no CRITICAL/HIGH finding with an available fix (replace with
  # the enterprise scanner and its policy when D15/D06 settle).
  # --------------------------------------------------------------------------------------------------------------------
  image:
    name: "4 Image, SBOM, vulnerability scan"
    needs: [contracts, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=0.0.0-ci.${{ github.run_number }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          docker image inspect "$IMAGE" --format 'image id {{.Id}}'
          # The SBOM steps below write into sbom/; the image SBOM action does not create the folder itself.
          mkdir -p sbom

      - name: SBOM - container image (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom/orqix-image.cdx.json
          upload-artifact: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: SBOM - Maven dependencies (CycloneDX)
        working-directory: backend
        run: |
          sh ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:"${CYCLONEDX_MAVEN_PLUGIN_VERSION}":makeAggregateBom \
            -DoutputFormat=json -DoutputName=orqix-backend.cdx
          mkdir -p ../sbom && cp target/orqix-backend.cdx.json ../sbom/

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: SBOM - npm production dependencies (CycloneDX)
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@"${CYCLONEDX_NPM_VERSION}" --omit dev --output-format JSON --output-file ../sbom/orqix-frontend.cdx.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Save image for the E2E stage
        run: docker save "$IMAGE" | gzip > orqix-image.tar.gz

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: orqix-image
          path: orqix-image.tar.gz
          retention-days: 1
          compression-level: 0

  secret-scan:
    name: "4 Secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # CLI in a container: no organisation licence needed (the gitleaks GitHub Action requires one for organisations).
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.github/gitleaks.toml --redact --no-banner --verbose

  # --------------------------------------------------------------------------------------------------------------------
  # Stage 5 - end-to-end. Compose stack (PostgreSQL, Keycloak with the dev realm, procurement stub, migration job and the
  # image built above) and Playwright from tests/e2e (axe checks included). The suite is skipped until tests/e2e exists.
  # Environment passed to the suite: E2E_BASE_URL, E2E_KEYCLOAK_URL, E2E_STUB_URL. Dev users: deploy/compose/keycloak.
  # --------------------------------------------------------------------------------------------------------------------
  e2e:
    name: "5 E2E"
    needs: [image, procurement-stub]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORQIX_IMAGE: orqix/orqix:ci
      E2E_BASE_URL: http://localhost:8080
      E2E_KEYCLOAK_URL: http://localhost:8180
      E2E_STUB_URL: http://localhost:8095
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Detect Playwright suite
        id: suite
        run: |
          if [ -f tests/e2e/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::tests/e2e does not exist yet; E2E stage skipped"; fi

      - uses: actions/download-artifact@v8.0.2
        if: steps.suite.outputs.present == 'true'
        with:
          name: orqix-image

      - name: Load image and start the stack
        if: steps.suite.outputs.present == 'true'
        working-directory: deploy/compose
        run: |
          gunzip -c ../../orqix-image.tar.gz | docker load
          docker compose --profile app up -d --no-build
          for _ in $(seq 1 60); do
            status=$(docker compose ps orqix --format '{{.Health}}')
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "::error::orqix did not become healthy"; docker compose ps -a; docker compose logs --tail=200; exit 1

      - uses: actions/setup-node@v7.1.0
        if: steps.suite.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Playwright
        if: steps.suite.outputs.present == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Reports
        if: always() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stack logs on failure
        if: failure() && steps.suite.outputs.present == 'true'
        working-directory: deploy/compose
        run: docker compose --profile app logs --no-color --tail=300

      - name: Tear down
        if: always() && steps.suite.outputs.present == 'true'
        working-directory: deploy/compose
        run: docker compose --profile app down -v
