      x-orqix-permission: workflow.edit
      responses:
        '200':
          description: Archived workflows; `truncated` is true when more than 200 exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivedWorkflows' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflow-owner-candidates:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listWorkflowOwnerCandidates
      summary: People who may be chosen as a workflow owner (they can edit workflows in this workspace today)
      x-orqix-permission: workflow.edit
      responses:
