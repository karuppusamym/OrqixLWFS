              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Template' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: Workflows visible to the caller
      description: Callers with only workflow.start see workflows with an active release they may start.
      x-orqix-permission: workflow.read | workflow.start
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: startable
          in: query
          description: Only workflows the caller may start now.
          schema: { type: boolean, default: false }
        - name: folder
          in: query
          description: A folder ID, or none for unfiled workflows. Requires workflow.read; it only narrows the list.
          schema: { type: string, maxLength: 36 }
        - name: owner
          in: query
          description: A subject ID. Requires workflow.read; it only narrows the list.
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of workflow summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkflowSummary' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Create a workflow with draft revision 1, optionally from a template
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkflowRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getWorkflow
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/draft:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getDraft
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Latest draft revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Workflows]
      operationId: saveDraft
      summary: Save a new draft revision
      description: |
        Accepts structurally incomplete drafts (work in progress) within size/depth limits; full validation is
        POST /validate. Rejects unknown schemaVersion and documents over 256 KiB or deeper than 32 levels.
        Saving never changes a published release.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.draft.saved
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDraftRequest' }
      responses:
        '200':
          description: Saved; body is the new revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /workspaces/{workspaceId}/workflows/{workflowId}/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: validateDraft
      summary: Run every compiler check against a draft revision without deploying
      x-orqix-permission: workflow.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Validation report (issues are data, not an error status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/draft/bpmn:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getDraftBpmn
      summary: Compiled BPMN of a draft revision with its round-trip check (UI03, docs/build/S60)
      description: |
        The BPMN is exactly what publishing would deploy. It carries the workflow name, the steps, the connections,
        the sections and handlers (subprocesses, docs/build/S77) and (when every step has a canvas position) the
        diagram; keptFromDraft lists the sections BPMN does not carry.
        roundTrip says whether the draft converts to BPMN and back without any difference; only then can edited BPMN
        be applied. A draft with blockers has no BPMN (available false, blockers listed). Read-only for anyone who
        can read the draft, like the YAML source view.
      x-orqix-permission: workflow.read
      parameters:
        - name: revision
          in: query
          required: false
          description: Draft revision; the latest when omitted.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: BPMN source of the draft revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftBpmn' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Workflows]
      operationId: applyDraftBpmn
      summary: Save edited BPMN as the next draft revision, only when the document can represent it exactly
      description: |
        Runs the same check as checkDraftBpmn against the latest draft revision named by If-Match and refuses with
        422 VALIDATION_FAILED (one fieldError per problem; code is the problem kind) unless it passes. On success the
        draft name, steps, connections and (with a diagram) canvas positions are replaced and every other section is
        kept; the result is saved like saveDraft (same limits, 412 on a stale revision, audit workflow.draft.saved with
        source bpmn). Nothing is validated away: Check workflow and the publish gates still apply.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.draft.saved
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BpmnApplyRequest' }
      responses:
        '200':
          description: Saved; body is the new revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /workspaces/{workspaceId}/workflows/{workflowId}/draft/bpmn/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: exportDraftBpmn
      summary: Download the draft as a standard .bpmn file with a complete diagram (STU04, docs/build/S97)
      description: |
        The BPMN 2.0 publishing would deploy for the draft revision (the latest when `revision` is omitted), as
        `application/xml` with a safe file name in Content-Disposition. It has a header comment (Orqix version, draft id,
        hash, what is carried as Orqix extensions) and a complete diagram interchange section (a shape with bounds for
        every element, an edge with waypoints for every flow): the saved canvas positions when every step has one, else a
        deterministic left-to-right layout. Orqix settings BPMN cannot express are carried only as the documented
        `orqix:` extensions and `flowable:` attributes. A draft with blocking issues has no BPMN (422 WORKFLOW_INVALID).
        Recorded as an export (audit workflow.exported with ids and the revision only). Anyone who can read the draft
        may download it; outsiders get 404.
      x-orqix-permission: workflow.read
      x-orqix-audit: workflow.exported
      parameters:
        - name: revision
          in: query
          required: false
          description: Draft revision; the latest when omitted.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The BPMN file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/draft/bpmn/check:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: checkDraftBpmn
      summary: Check edited BPMN against a draft revision without saving (UI03, docs/build/S60)
      description: |
        Applicable only when the draft itself round-trips exactly, the text is safe XML in the compiled dialect with
        nothing unsupported (comments, lanes, pools, sub-processes, foreign extensions and free expressions are listed
        as problems, never dropped), the process id equals the workflow key, the resulting draft compiles without
        blockers, regenerating BPMN reproduces every element, attribute and text of the submitted BPMN, and the result
        reads back to the same document. Values computed from the document or the workspace (hashes, child release
        pins, diagram lines) are recomputed and listed as notes. changes lists what applying would add, remove or change.
      x-orqix-permission: workflow.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BpmnCheckRequest' }
      responses:
        '200':
          description: Check result (problems are data, not an error status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BpmnCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/decisions/{decisionKey}/evaluate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/DecisionKey'
    post:
      tags: [Workflows]
      operationId: evaluateDecision
      summary: Test a decision table in a draft with sample values (no side effects)
      x-orqix-permission: workflow.read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionEvaluateRequest' }
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionEvaluateResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/decisions/{decisionKey}/csv:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/DecisionKey'
    get:
      tags: [Workflows]
      operationId: exportDecisionCsv
      summary: Download a decision table of a draft as CSV (spreadsheet-safe, imports back to the identical table)
      description: |
        Strict, documented column format (docs/build/S89-decision-csv-io.md). Any cell a spreadsheet could read as a
        formula (first character = + - @ tab, carriage return or an apostrophe) is prefixed with an apostrophe, which
        import removes again. A table that CSV cannot carry exactly (an OR row, mixed value kinds in one field, an empty
        text result) is refused with 422 and the reasons; nothing is written approximately. Latest revision unless
        `revision` is given.
      x-orqix-permission: workflow.read
      parameters:
        - in: query
          name: revision
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The table as UTF-8 CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    put:
      tags: [Workflows]
      operationId: importDecisionCsv
      summary: Replace a decision table of the latest draft with the content of a CSV file (a draft change only)
      description: |
        The body is the CSV file, `Content-Type: text/csv` (UTF-8, with or without a byte order mark), at most 128 KiB.
        The table key and version are kept; the hit policy, rows (in file order) and default are replaced. The file is
        read strictly (no coercion): every problem is returned as a fieldError whose pointer is
        `/csv/lines/<line>/columns/<column>` (1-based) with a code naming the kind, at most 100 of them. After parsing,
        the compiler validates the draft with the new table (hit-policy overlap, field types, result shape, literal
        safety, dates), and a blocker inside the table refuses the import with its line and column. On success a normal
        draft revision is saved like saveDraft (If-Match, 412 on a stale revision, audit workflow.draft.saved with source
        decisionCsv). Nothing is published; Check workflow and the publish gates still apply. Shared decisions are not
        written by this operation.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.draft.saved
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200':
          description: Saved; body is the new revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /workspaces/{workspaceId}/workflows/{workflowId}/decisions/{decisionKey}/dmn:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/DecisionKey'
    get:
      tags: [Workflows]
      operationId: exportDecisionDmn
      summary: Download a decision table of a draft as a standard DMN 1.3 file (docs/build/S121)
      description: |
        The portable form of the table: the authored hit policy (with aggregation for COLLECT and outputValues for
        PRIORITY), FEEL unary tests (>= 5000, "EU","UK", [1000..5000), not("x")), each output's defaultOutputEntry and
        effective dates as a submissionDate column. The engine DMN that publishing deploys is a separate artifact. A
        malformed table is refused with 422. Latest revision unless `revision` is given. Audited as workflow.exported
        with format dmn and the revision.
      x-orqix-permission: workflow.read
      x-orqix-audit: workflow.exported
      parameters:
        - in: query
          name: revision
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The DMN file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    put:
      tags: [Workflows]
      operationId: importDecisionDmn
      summary: Replace a decision table of the latest draft with a decision table of a DMN file (a draft change only)
      description: |
        The body is the DMN 1.1 to 1.5 file, `Content-Type: application/xml`, at most 512 KiB, read safely (no DTDs or
        entities). `decisionId` chooses the decision when the file has several; without it such a file is refused with
        422 and the problem lists `decisions`. The reader is strict: hit policies UNIQUE, FIRST, ANY, PRIORITY (one
        output's outputValues) and COLLECT with SUM, MIN, MAX or COUNT; literal, comparison, range, list and not(...)
        unary tests; literal outputs; input expressions that name a field. Anything else is a fieldError with its place
        in the file, never approximated. The table key and version stay. The compiler then validates the draft with the
        new table and a blocker inside it refuses the import (fieldError pointer /dmn/rows/...). On success a normal draft
        revision is saved like saveDraft (If-Match, 412 on a stale revision, audit workflow.draft.saved with source
        decisionDmn). Nothing is published.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.draft.saved
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - in: query
          name: decisionId
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: Saved; body is the new revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /workspaces/{workspaceId}/workflows/{workflowId}/decisions/{decisionKey}/csv-template:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/DecisionKey'
    get:
      tags: [Workflows]
      operationId: getDecisionCsvTemplate
      summary: Download a CSV template with the columns of a decision table, one example rule and the default line
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: The template as UTF-8 CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflow-organization:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: getWorkflowOrganization
      summary: Folders (with workflow counts), the unfiled count and workflow owners
      description: >
        Folders are labels only. They grant and restrict nothing; the counts describe workflows every caller with
        workflow.read can already list.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Workflow organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/archived-workflows:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
