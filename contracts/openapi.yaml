    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: extensionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9]{1,12}\.[0-9a-f]{64}$' } }
      - { name: path, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,60}\.(js|mjs|css|woff2|woff|png|jpg|jpeg|webp|gif)$' } }
    get:
      tags: [Views]
      operationId: getUiExtensionFile
      summary: One file of a multi-file extension bundle, loaded by its sandboxed frame (S116; no session, the signed path is the credential)
      description: >-
        The frame document's policy names this version's signed file prefix, minted for a caller allowed to load the
        version and valid for twelve hours. Only approved or pending versions are served; revoked or rejected versions,
        expired or forged paths and unknown files are 404. Readable cross-origin because the frame has an opaque origin.
      security: []
      x-orqix-permission: extensionFileToken
      responses:
        '200':
          description: File bytes with their type
          content:
            text/javascript: { schema: { type: string } }
            text/css: { schema: { type: string } }
            font/woff2: { schema: { type: string, format: binary } }
            font/woff: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/ui-extensions/{extensionId}/versions/{version}/frame:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: extensionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Views]
      operationId: getUiExtensionFrame
      summary: The sandboxed frame document for an extension version
      description: >-
