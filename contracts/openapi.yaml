openapi: 3.1.1
info:
  title: Orqix API
  version: 0.1.0-r0
  summary: R0 contract for the purchase-approval vertical slice.
  description: |
    Contract-first API for Orqix R0. This file is authoritative: the frontend generates its types from it and
    backend integration tests validate every response against it. Rules that apply to every operation are in
    docs/build/S3-api.md; this summary is normative:

    * Authentication: browser clients use the session cookie set after OIDC login. Machine clients (start/read
      runs only in R0) use a bearer access token validated as an OAuth2 resource server.
    * CSRF: every POST/PUT/DELETE from a browser session must send `X-XSRF-TOKEN` matching the `XSRF-TOKEN` cookie.
    * Authorization: `x-orqix-permission` names the permission checked against the stored resource's workspace.
      A caller who cannot read the resource receives 404, never 403 (no cross-workspace existence disclosure).
    * Idempotency: operations declaring the `Idempotency-Key` parameter require it. Same principal + key + payload
      replays the original result (200 + `Idempotent-Replayed: true`); a different payload returns 409
      IDEMPOTENCY_KEY_REUSED. Keys are retained 30 days. Authorization is rechecked on replay.
    * Concurrency: drafts use `ETag`/`If-Match`; tasks, workflows and runs use `expectedVersion` in the body.
    * Errors: RFC 9457 `application/problem+json` with the extension members `code` and `correlationId`.
    * Lists: cursor pagination, `limit` 1–100 (default 25). Cursors are opaque and expire with their data.
    * `x-orqix-audit` names the audit action written for the operation (success, denial and failure).
    * Feature switches (docs/build/S127): `x-orqix-feature` names the workspace module(s) an operation belongs to.
      While a workspace administrator has switched that module off, the operation returns 409 FEATURE_DISABLED
      (with `feature`) after the 404 visibility check; `x-orqix-feature-when`
      limits this to one kind of resource. Reads stay available and work already running continues.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Identity
  - name: Administration
  - name: Workflows
  - name: Releases
  - name: Runs
  - name: Tasks
  - name: Notifications
  - name: Connections
  - name: Adapters
  - name: Agent write tools
  - name: Access
  - name: AI
  - name: Migration
  - name: Conversation
  - name: Insights
  - name: Attachments
  - name: Cases
  - name: Views

paths:
  /workspaces/{workspaceId}/worklist-view:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Views]
      operationId: getWorklistView
      summary: Read the pinned presentation for this workspace's authorized task list
      x-orqix-permission: task.act
      responses:
        '200': { description: Worklist presentation, content: { application/json: { schema: { $ref: '#/components/schemas/WorklistViewState' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Views]
      operationId: assignWorklistView
      summary: Pin a published worklist view or restore the standard layout
      x-orqix-permission: workflow.publish
      x-orqix-audit: view.worklist-assigned
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [expectedRevision], properties: { expectedRevision: { type: integer, minimum: 0 }, viewRef: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] } } } } } }
      responses:
        '200': { description: Updated worklist presentation, content: { application/json: { schema: { $ref: '#/components/schemas/WorklistViewState' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/definitions:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Cases]
      operationId: listCaseDefinitions
      summary: List executable case definitions in this workspace
      x-orqix-permission: workflow.read
      responses:
        '200': { description: Case definitions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseDefinition' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cases]
      operationId: createCaseDefinition
      x-orqix-feature: cases
      summary: Deploy a reviewed bounded CMMN case model
      description: Initial delivery accepts only the validated human-task, sentry and milestone subset. It does not imply full CMMN conformance.
      x-orqix-permission: workflow.edit
      x-orqix-audit: case.definition.created
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCaseDefinition' } } } }
      responses:
        '201': { description: Immutable deployed version, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinition' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/definitions/{definitionId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: definitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Cases]
      operationId: getCaseDefinition
      summary: Get a case definition and its source for an authorized designer
      x-orqix-permission: workflow.edit
      responses:
        '200': { description: Definition with source, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinitionDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/cases/definitions/{definitionId}/instances:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: definitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Cases]
      operationId: startCaseInstance
      x-orqix-feature: cases
      summary: Start a case pinned to this definition version
      x-orqix-permission: workflow.start
      x-orqix-audit: case.instance.started
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/StartCase' } } } }
      responses:
        '201': { description: Started case, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '200': { description: Identical idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/drafts:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Cases]
      operationId: listCaseDefinitionDrafts
      summary: List the case type drafts of this workspace (S126)
      x-orqix-permission: workflow.edit
      responses:
        '200': { description: 'Drafts, most recently saved first', content: { application/json: { schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CaseDefinitionDraftSummary' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cases]
      operationId: createCaseDefinitionDraft
      summary: Start the draft of a case type
      description: 'One draft per case key. The draft may be incomplete; checkCaseDefinitionDraft reports what still blocks publishing. A key that already has published versions starts the draft of its next version.'
      x-orqix-permission: workflow.edit
      x-orqix-audit: case.draft.saved
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCaseDefinitionDraft' } } } }
      responses:
        '201': { description: Created draft, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinitionDraft' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/drafts/{draftId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: draftId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Cases]
      operationId: getCaseDefinitionDraft
      summary: Get a case type draft
      x-orqix-permission: workflow.edit
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinitionDraft' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Cases]
      operationId: saveCaseDefinitionDraft
      summary: Save the whole content of a case type draft
      description: 'Replaces the draft content; omitted parts are cleared. The key never changes.'
      x-orqix-permission: workflow.edit
      x-orqix-audit: case.draft.saved
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveCaseDefinitionDraft' } } } }
      responses:
        '200': { description: Saved draft, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinitionDraft' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Cases]
      operationId: deleteCaseDefinitionDraft
      summary: Discard a case type draft
      description: Published versions of the case type are not affected.
      x-orqix-permission: workflow.edit
      x-orqix-audit: case.draft.deleted
      responses:
        '204': { description: Discarded }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/cases/drafts/{draftId}/check:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: draftId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Cases]
      operationId: checkCaseDefinitionDraft
      summary: 'Run every admission rule of createCaseDefinition against the saved draft, without deploying'
      description: 'Nothing is written. Independent rules all run, so every problem is reported at once. Engine deployment is not tried; a model the engine still rejects is reported when publishing.'
      x-orqix-permission: workflow.edit
      responses:
        '200': { description: Check result for the saved draft version, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinitionCheck' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/cases/drafts/{draftId}/publish:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: draftId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Cases]
      operationId: publishCaseDefinitionDraft
      summary: Check the draft again and deploy it as the next immutable version of the case type
      description: 'Refused with 422 while the check reports problems and with 409 when the draft changed since expectedVersion. The draft stays as the working copy of the following version.'
      x-orqix-permission: workflow.edit
      x-orqix-audit: case.definition.created
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishCaseDefinitionDraft' } } } }
      responses:
        '201': { description: Deployed version, content: { application/json: { schema: { $ref: '#/components/schemas/CaseDefinition' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/instances:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Cases]
      operationId: listCaseInstances
      summary: List the latest workspace cases visible to the caller
      x-orqix-permission: run.read
      responses:
        '200': { description: Up to 50 cases, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseInstance' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Cases]
      operationId: getCaseInstance
      summary: Get current case state and eligible tasks
      x-orqix-permission: run.read
      responses:
        '200': { description: Case state, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/data:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Cases]
      operationId: getCaseData
      summary: Read pinned typed case data
      description: Requires run.read-data, the case starter, or current case-worker eligibility. Historical before/after values require run.read-data.
      x-orqix-permission: run.read-data
      responses:
        '200': { description: Authorized data, content: { application/json: { schema: { $ref: '#/components/schemas/CaseData' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cases]
      operationId: updateCaseData
      summary: Replace validated case data with current eligibility and version
      description: Requires a currently eligible case worker with task.act, or both run.operate and run.read-data. Held or ended cases reject new edits. Data is separate from engine variables and cannot alter admitted task predicates.
      x-orqix-permission: task.act
      x-orqix-audit: case.data.updated
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCaseData' } } } }
      responses:
        '200': { description: Updated metadata or original replay, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/plan:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Cases]
      operationId: getCasePlan
      summary: Read case plan-item history, nested stage states and achieved milestones
      description: >-
        Uses the same visibility rules as case detail. Returns engine history for the exact pinned case,
        including ended stages and achieved milestones. No variables, task payloads or termination reasons are included.
      x-orqix-permission: run.read
      responses:
        '200': { description: Case plan, content: { application/json: { schema: { $ref: '#/components/schemas/CasePlanOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/suspend:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Cases]
      operationId: suspendCaseInstance
      summary: Apply the suspend case lifecycle command
      description: >-
        Requires current permission, current case version, a reason and an idempotency key. Human task controls also
        require current candidate-group eligibility. A held case refuses work changes; close/stage completion never
        bypass required or active work. Hold/resume freeze the admitted synchronous subset through the Orqix command
        boundary; they do not claim a native Flowable CMMN suspended plan-item state. Audit metadata excludes reasons.
      x-orqix-permission: run.operate
      x-orqix-audit: case.lifecycle.changed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseCommand' } } } }
      responses:
        '200': { description: Updated case or replay, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/resume:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Cases]
      operationId: resumeCaseInstance
      summary: Apply the resume case lifecycle command
      description: >-
        Requires current permission, current case version, a reason and an idempotency key. Human task controls also
        require current candidate-group eligibility. A held case refuses work changes; close/stage completion never
        bypass required or active work. Hold/resume freeze the admitted synchronous subset through the Orqix command
        boundary; they do not claim a native Flowable CMMN suspended plan-item state. Audit metadata excludes reasons.
      x-orqix-permission: run.operate
      x-orqix-audit: case.lifecycle.changed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseCommand' } } } }
      responses:
        '200': { description: Updated case or replay, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/close:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Cases]
      operationId: closeCaseInstance
      summary: Apply the close case lifecycle command
      description: >-
        Requires current permission, current case version, a reason and an idempotency key. Human task controls also
        require current candidate-group eligibility. A held case refuses work changes; close/stage completion never
        bypass required or active work. Hold/resume freeze the admitted synchronous subset through the Orqix command
        boundary; they do not claim a native Flowable CMMN suspended plan-item state. Audit metadata excludes reasons.
      x-orqix-permission: run.operate
      x-orqix-audit: case.lifecycle.changed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseCommand' } } } }
      responses:
        '200': { description: Updated case or replay, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/plan-items/{planItemId}/occur:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: planItemId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cases]
      operationId: occurCaseUserEvent
      summary: Trigger a native CMMN user event with current case-role eligibility
      description: >-
        Requires task.act and current membership of an authorized case role mapped to a workspace group.
        The listener must belong to this case and be available. Expected version, reason, idempotency and
        case hold checks apply. The native occur event evaluates sentries. Event-role eligibility grants
        plan metadata access, not protected case data access. Audit metadata excludes the reason.
      x-orqix-permission: task.act
      x-orqix-audit: case.planitem.changed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseCommand' } } } }
      responses:
        '200': { description: Updated case or replay, content: { application/json: { schema: { $ref: '#/components/schemas/CaseInstance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/cases/instances/{instanceId}/plan-items/{planItemId}/plan:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: instanceId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: planItemId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Cases]
      operationId: planCaseDiscretionaryItem
      summary: Plan a discretionary item of a stage's planning table into the case
      description: >-
        Requires task.act and current membership of a case role authorized on the discretionary item, mapped to a
        workspace group. The item must be available to plan in an active stage. The planned item then follows its own
        required and manual activation rules. Expected version, reason, idempotency and case hold checks apply. Audit
        metadata excludes the reason.
      x-orqix-permission: task.act
      x-orqix-audit: case.planitem.changed
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseCommand' } } } }
      responses:
