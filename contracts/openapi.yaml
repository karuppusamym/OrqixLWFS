      properties:
        type:
          enum:
          - subject
          - idpGroup
        value:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
    DocumentSourceGrant:
      type: object
      required:
      - source
      - browseOperation
      - versionsOperation
      - audience
      - enabled
      - revision
      properties:
        source:
          $ref: '#/components/schemas/DocumentSource'
        browseOperation:
          type: string
        versionsOperation:
          type: string
        audience:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentSourcePrincipal'
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    PutDocumentSourceGrant:
      type: object
      required:
      - label
      - connectionKey
      - definitionVersion
      - browseOperation
      - versionsOperation
      - driveId
      - folderId
      - audience
      - enabled
      - expectedRevision
      properties:
        label:
          type: string
        connectionKey:
          type: string
        definitionVersion:
          type: integer
        driveId:
          type: string
        folderId:
          type: string
        browseOperation:
          type: string
        versionsOperation:
          type: string
        audience:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentSourcePrincipal'
        enabled:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483646
      additionalProperties: false
    DocumentSourceFiles:
      type: object
      required:
      - driveId
      - folderId
      - filesJson
      - fileCount
      - hasMore
      properties:
        driveId:
          type: string
        folderId:
          type: string
        filesJson:
          type: string
        fileCount:
          type: integer
          minimum: 0
          maximum: 100
        hasMore:
          const: false
      additionalProperties: false
    DocumentSourceVersions:
      type: object
      required:
      - driveId
      - itemId
      - versionsJson
      - versionCount
      - hasMore
      properties:
        driveId:
          type: string
        itemId:
          type: string
        versionsJson:
          type: string
        versionCount:
          type: integer
          minimum: 0
          maximum: 100
        hasMore:
          const: false
      additionalProperties: false

    Permission:
      type: string
      enum:
        - workflow.read
        - workflow.edit
        - workflow.publish
        - workflow.export
        - workflow.start
        - run.read
        - run.read-data
        - run.operate
        - task.act
        - connection.read
        - connection.manage
        - workspace.manage-access
        - audit.read
        - message.send
        - document.browse
        - job.work
        - workflow.approve-promotion
        - agent.approve-write-tool
    AgentWriteSubject:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
    AgentWriteToolDeclared:
      type: object
      description: A write tool as declared in an agent connection version (connection-definition agentSpec.writeTools). Declaring it authorizes nothing.
      required: [connectionKey, connectionVersion, connectionName, operation, operationLabel, toolName, label, description, adapterKey, kind, to, maxCalls]
      properties:
        connectionKey: { $ref: '#/components/schemas/Key' }
        connectionVersion: { type: integer, minimum: 1 }
        connectionName: { type: string }
        operation: { type: string }
        operationLabel: { type: string }
        toolName: { type: string }
        label: { type: string }
        description: { type: string }
        adapterKey: { type: string }
        kind: { type: string, enum: [email, teams] }
        to: { type: array, items: { type: string }, description: Fixed recipients (email); empty for Teams }
        maxCalls: { type: integer, minimum: 1, maximum: 3 }
    AgentWriteToolApproval:
      type: object
      required: [id, workflowKey, connectionKey, connectionVersion, operation, toolName, adapterKey, status, approvedBy, approvedAt, approvalReason, revokedBy, revokedAt, revokeReason, expiresAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workflowKey: { $ref: '#/components/schemas/Key' }
        connectionKey: { $ref: '#/components/schemas/Key' }
        connectionVersion: { type: integer, minimum: 1 }
        operation: { type: string }
        toolName: { type: string }
        adapterKey: { type: string }
        status: { type: string, enum: [active, revoked, expired], description: 'expired: past expiresAt; authorizes nothing, like revoked (S85)' }
        approvedBy: { $ref: '#/components/schemas/AgentWriteSubject' }
        approvedAt: { $ref: '#/components/schemas/Timestamp' }
        approvalReason: { type: string }
        revokedBy: { oneOf: [{ $ref: '#/components/schemas/AgentWriteSubject' }, { type: 'null' }] }
        revokedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        revokeReason: { type: [string, 'null'] }
        expiresAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }], description: 'Null when the approval does not expire' }
        version: { type: integer, minimum: 1 }
    AgentWriteToolOverview:
      type: object
      required: [tools, approvals, canApprove, canRevoke]
      properties:
        tools: { type: array, items: { $ref: '#/components/schemas/AgentWriteToolDeclared' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/AgentWriteToolApproval' } }
        canApprove: { type: boolean, description: The caller holds agent.approve-write-tool }
        canRevoke: { type: boolean, description: The caller holds agent.approve-write-tool or connection.manage }
    AgentWriteToolApproveRequest:
      type: object
      additionalProperties: false
      required: [workflowKey, connectionKey, connectionVersion, operation, toolName, reason]
      properties:
        workflowKey: { $ref: '#/components/schemas/Key' }
        connectionKey: { $ref: '#/components/schemas/Key' }
        connectionVersion: { type: integer, minimum: 1 }
        operation: { type: string, minLength: 1, maxLength: 100 }
        toolName: { type: string, pattern: '^[a-z][a-z0-9_]{0,47}$' }
        reason: { type: string, maxLength: 500, description: Required (422 REASON_REQUIRED when blank) }
        expiresInDays: { type: [integer, 'null'], minimum: 1, maximum: 90, description: 'Optional (S85): the approval expires this many days from now; omitted or null means no expiry' }
    AgentWriteToolRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    AgentWriteCall:
      type: object
      description: One write slot of an agent execution. Holds no message content; state is the effect journal state (null while not yet registered).
      required: [id, runId, nodeId, connectionKey, connectionVersion, operation, toolName, callIndex, adapterKey, kind, approvalId, approvedBy, requestedBy, argumentChars, effectId, state, attempts, lastErrorCode, reconciledOutcome, reconciledBy, reconciledAt, reconcileReason, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        nodeId: { type: string }
        connectionKey: { $ref: '#/components/schemas/Key' }
        connectionVersion: { type: integer }
        operation: { type: string }
        toolName: { type: string }
        callIndex: { type: integer, minimum: 1, maximum: 3 }
        adapterKey: { type: string }
        kind: { type: string, enum: [email, teams] }
        approvalId: { $ref: '#/components/schemas/Uuid' }
        approvedBy: { $ref: '#/components/schemas/AgentWriteSubject' }
        requestedBy: { $ref: '#/components/schemas/AgentWriteSubject' }
        argumentChars: { type: integer, minimum: 0 }
        effectId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        state: { type: [string, 'null'], enum: [pending, inFlight, succeeded, retryableFailure, permanentFailure, unknown, notApplied, null] }
        attempts: { type: integer }
        lastErrorCode: { type: [string, 'null'] }
        reconciledOutcome: { type: [string, 'null'], enum: [succeeded, notApplied, null] }
        reconciledBy: { oneOf: [{ $ref: '#/components/schemas/AgentWriteSubject' }, { type: 'null' }] }
        reconciledAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        reconcileReason: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AgentWriteCallList:
      type: object
      required: [items, canReconcile]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentWriteCall' } }
        canReconcile: { type: boolean, description: The caller holds run.operate }
    AgentWriteReconcileRequest:
      type: object
      additionalProperties: false
      required: [outcome, reason, expectedVersion]
      properties:
        outcome: { type: string, enum: [succeeded, notApplied], description: What the operator found at the target; never inferred }
        reason: { type: string, maxLength: 500 }
        remoteReference: { type: [string, 'null'], maxLength: 200 }
        expectedVersion: { type: integer, minimum: 1 }
    AgentWriteRetention:
      type: object
      additionalProperties: false
      required: [version, eligibleNow]
      properties:
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        version: { type: integer, minimum: 0, description: '0 until a setting is saved' }
        eligibleNow: { type: integer, minimum: 0, description: Write records the next sweep would remove under this setting }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    SetAgentWriteRetention:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        expectedVersion: { type: integer, minimum: 0 }
    WorkspaceRole:
      type: string
      enum: [WORKSPACE_ADMIN, WORKFLOW_DESIGNER, PUBLISHER, OPERATOR, VIEWER, APPROVER]

    Problem:
      type: object
      description: RFC 9457 problem details with Orqix extension members.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference, description: 'https://orqix.example/problems/{code-in-kebab-case}' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - MALFORMED_REQUEST
            - IDEMPOTENCY_KEY_REQUIRED
            - INVALID_CURSOR
            - UNAUTHENTICATED
            - FORBIDDEN
            - CSRF_INVALID
            - SELF_APPROVAL_DENIED
            - SEPARATION_OF_DUTIES
            - NOT_ELIGIBLE
            - NOT_FOUND
            - IDEMPOTENCY_KEY_REUSED
            - DUPLICATE_KEY
            - WORKFLOW_VERSION_CONFLICT
            - PROMOTION_APPROVAL_REQUIRED
            - RELEASE_NOT_ACTIVE
            - TASK_VERSION_CONFLICT
            - TASK_ALREADY_CLAIMED
            - TASK_NOT_CLAIMED_BY_CALLER
            - TASK_NOT_OPEN
            - RUN_NOT_ACTIVE
            - RUN_HAS_OPEN_TASKS
            - RUN_BUSY
            - RUN_NOT_RECOVERABLE
            - RUN_SUSPENDED
            - RUN_NOT_SUSPENDED
            - RUN_NOT_SUSPENDABLE
            - RUN_NOT_REPAIRABLE
            - RUN_NOT_MIGRATABLE
            - SIGNAL_NOT_AWAITED
            - CALLBACK_ALREADY_RESUMED
            - CALLBACK_NOT_WAITING
            - JOB_LEASE_LOST
            - JOB_NOT_OPEN
            - EFFECT_NOT_RECONCILED
            - EFFECT_STATE_CONFLICT
            - GROUP_REVISION_CONFLICT
            - CONFIGURATION_VERSION_CONFLICT
            - RESOURCE_IN_USE
            - STALE_REVISION
            - PAYLOAD_TOO_LARGE
            - VALIDATION_FAILED
            - WORKFLOW_INVALID
            - WARNINGS_NOT_ACKNOWLEDGED
            - NO_ACTIVE_RELEASE
            - REASON_REQUIRED
            - CONNECTION_NOT_BOUND
            - EGRESS_NOT_ALLOWED
            - OPERATION_NOT_TESTABLE
            - PRECONDITION_REQUIRED
            - QUOTA_EXCEEDED
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
            - AI_NOT_CONFIGURED
            - AI_MODEL_NOT_ALLOWED
            - AI_OUTPUT_INVALID
            - AI_PROVIDER_UNAVAILABLE
            - AI_BUDGET_EXCEEDED
            - SOURCE_INVALID
            - MIGRATION_BLOCKED
            - ATTACHMENT_BLOCKED
            - ATTACHMENT_LIMIT_REACHED
            - FEATURE_DISABLED
            - INTERNAL_ERROR
        correlationId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        openItems:
          type: array
          description: MIGRATION_BLOCKED only - compatibility report items that are still open (blockers and unresolved actions)
          items: { $ref: '#/components/schemas/CompatibilityIssue' }
        currentRevision: { type: integer }
        currentVersion: { type: integer }
        decisions:
          type: array
          description: importDecisionDmn and convertDecisionDmn only - the decisions of the file, to choose one with decisionId
          items: { $ref: '#/components/schemas/DecisionDmnChoice' }
        feature:
          description: FEATURE_DISABLED only - the switched-off module
          allOf: [{ $ref: '#/components/schemas/WorkspaceFeature' }]
    FieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: 'JSON Pointer into the request body, e.g. /input/amount' }
        code: { type: string, description: 'Keyword that failed: required, type, enum, minimum, maximum, maxLength, multipleOf, additionalProperties, pattern (message: the form author''s plain-text patternMessage)' }
        message: { type: string }

    SubjectRef:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
    PrincipalRef:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [subject, idpGroup] }
        value: { type: string, minLength: 1, maxLength: 256, description: 'Subject UUID or IdP group claim value' }
    Principal:
      description: PrincipalRef as returned by the server, with a display name when known.
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [subject, idpGroup] }
        value: { type: string, minLength: 1, maxLength: 256 }
        displayName: { type: string }

    Me:
      type: object
      required: [subject, workspaces, platformAdmin]
      properties:
        subject:
          type: object
          required: [id, displayName]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            displayName: { type: string }
            email: { type: [string, 'null'] }
        platformAdmin: { type: boolean }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMembership' }
    WorkspaceMembership:
      type: object
      required: [id, key, name, organizationName, isTest, permissions, disabledFeatures]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        organizationName: { type: string }
        isTest: { type: boolean }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        disabledFeatures:
          type: array
          description: Modules a workspace administrator switched off (S127); empty when everything is on
          items: { $ref: '#/components/schemas/WorkspaceFeature' }
    WorkspaceFeature:
      type: string
      enum: [ai, cases, migration, agents, apps, kafka]
      description: |
        A product module that can be switched off per workspace (S127). ai - AI assistance (drafts, explanations, form
        and edit suggestions, Blueprint proposals). cases - case types and starting cases. migration - Camunda and Pega
        import. agents - agent connections (MCP and A2A behind them) and approving agent write tools. apps - application
        pages and UI extensions. kafka - Kafka triggers, Kafka adapters and Kafka-sourced inbound triggers.
    WorkspaceFeatureState:
      type: object
      additionalProperties: false
      required: [feature, enabled, updatedAt, updatedBy]
      properties:
        feature: { $ref: '#/components/schemas/WorkspaceFeature' }
        enabled: { type: boolean }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }], description: 'null until first switched' }
        updatedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
    WorkspaceFeatures:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceFeatureState' }
    SetWorkspaceFeature:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    Organization:
      type: object
      required: [id, key, name, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [organizationId, key, name, isTest, initialAdmins]
      properties:
        organizationId: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { $ref: '#/components/schemas/Name' }
        isTest: { type: boolean }
        allowSelfApprovalWorkflows: { type: boolean, default: false, description: 'Only accepted when isTest is true' }
        initialAdmins:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PrincipalRef' }
    WorkspaceAdminView:
      type: object
      required: [id, organizationId, key, name, isTest, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        isTest: { type: boolean }
        allowSelfApprovalWorkflows: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    Template:
      type: object
      required: [id, name, description, typicalOwner, requiredInputs]
      properties:
        id: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        description: { type: string }
        typicalOwner: { type: string }
        requiredInputs: { type: array, items: { type: string } }
        requiredGroups: { type: array, items: { $ref: '#/components/schemas/Key' } }
        requiredConnections: { type: array, items: { $ref: '#/components/schemas/Key' } }
        requiredWorkflows: { type: array, items: { $ref: '#/components/schemas/Key' }, description: 'Workflows the template starts as child requests; they must be published first.' }

    WorkflowSummary:
      type: object
      required: [id, key, name, draftRevision, activeRelease, canStart, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        description: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/SubjectRef' }
        draftRevision: { type: integer }
        activeRelease:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, releaseNumber, publishedAt, draftRevision]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                releaseNumber: { type: integer }
                publishedAt: { $ref: '#/components/schemas/Timestamp' }
                draftRevision: { type: integer, description: 'The draft revision this release was published from; the workflow has unpublished changes when draftRevision (on the workflow) is greater' }
        canStart: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        folderId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Present only for callers with workflow.read and only when the workflow is in a folder
    WorkflowFolder:
      type: object
      required: [id, name, version, workflowCount, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        workflowCount: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkflowOrganization:
      type: object
      required: [folders, unfiledCount, owners, folderLimit]
      properties:
        folders: { type: array, items: { $ref: '#/components/schemas/WorkflowFolder' } }
        unfiledCount: { type: integer, minimum: 0 }
        owners:
          type: array
          items:
            type: object
            required: [id, displayName, workflowCount]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              displayName: { type: string }
              workflowCount: { type: integer, minimum: 1 }
        folderLimit: { type: integer }
    WorkflowFolderName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    RenameWorkflowFolder:
      type: object
      additionalProperties: false
      required: [name, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expectedVersion: { type: integer, minimum: 1 }
    SetWorkflowFolder:
      type: object
      additionalProperties: false
      required: [folderId]
      properties:
        folderId:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Uuid' }]
        expectedFolderVersion: { type: integer, minimum: 1, description: 'Required with a folder; omitted when folderId is null' }
    WorkflowComment:
      type: object
      required: [id, elementId, body, authorId, authorName, createdAt, resolved, mentions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        elementId: { type: string }
        parentId:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Uuid' }]
        body: { type: string, minLength: 1, maxLength: 2000 }
        authorId: { $ref: '#/components/schemas/Uuid' }
        authorName: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        resolved: { type: boolean }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByName: { type: [string, 'null'] }
        mentions:
          type: array
          maxItems: 10
          description: People mentioned in this comment (CMP01), with their current display names; each appears as "@Display Name" in body
          items: { $ref: '#/components/schemas/SubjectRef' }
    WorkflowDiscussionThread:
      type: object
      required: [root, replies]
      properties:
        root: { $ref: '#/components/schemas/WorkflowComment' }
        replies: { type: array, items: { $ref: '#/components/schemas/WorkflowComment' } }
    WorkflowDiscussion:
      type: object
      required: [threads, openByElement, canPost]
      properties:
        threads: { type: array, items: { $ref: '#/components/schemas/WorkflowDiscussionThread' } }
        openByElement: { type: object, additionalProperties: { type: integer, minimum: 1 } }
        canPost: { type: boolean }
    PostWorkflowComment:
      type: object
      additionalProperties: false
      required: [elementId, body]
      properties:
        elementId: { type: string, minLength: 1, maxLength: 128, description: 'A step or connection ID of the current draft' }
        body: { type: string, minLength: 1, maxLength: 2000 }
        parentId: { $ref: '#/components/schemas/Uuid' }
        mentions:
          type: array
          maxItems: 10
          description: >-
            People to mention (CMP01, docs/build/S87). A mention is kept only for an enabled person other than the author
            who can read this workflow and whose "@Display Name" is in body; anything else is ignored without an error.
          items: { $ref: '#/components/schemas/Uuid' }
    ResolveWorkflowThread:
      type: object
      additionalProperties: false
      required: [resolved]
      properties:
        resolved: { type: boolean }
    ArchiveWorkflow:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: 'The workflow version' }
        reason: { type: string, minLength: 3, maxLength: 300 }
    RestoreWorkflow:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: 'The archived workflow version' }
        reason: { type: string, minLength: 3, maxLength: 300 }
    ArchivedWorkflow:
      type: object
      required: [id, key, name, version, archivedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        version: { type: integer }
        archivedAt: { type: string, format: date-time }
        archivedBy:
          description: Null for workflows archived before this was recorded
          oneOf:
            - { $ref: '#/components/schemas/SubjectRef' }
            - { type: 'null' }
        activeReleaseNumber: { type: [integer, 'null'] }
    ArchivedWorkflows:
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArchivedWorkflow' } }
        truncated: { type: boolean }
    SetWorkflowOwner:
      type: object
      additionalProperties: false
      required: [ownerSubjectId, expectedVersion]
      properties:
        ownerSubjectId: { $ref: '#/components/schemas/Uuid' }
        expectedVersion: { type: integer, minimum: 1, description: 'The workflow version' }
    WorkspaceEnvironment:
      type: object
      required: [workspaceId, stage, explicit, version, requireApproval]
      properties:
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        stage: { type: string, enum: [development, test, staging, production] }
        explicit: { type: boolean, description: 'False when derived from the workspace test flag' }
        version: { type: integer, minimum: 0 }
        requireApproval: { type: boolean, description: 'Production only: promotions into this workspace need a second person with workflow.approve-promotion' }
    SetWorkspaceEnvironment:
      type: object
      additionalProperties: false
      required: [stage, expectedVersion]
      properties:
        stage: { type: string, enum: [development, test, staging, production] }
        expectedVersion: { type: integer, minimum: 0 }
        requireApproval:
          type: [boolean, 'null']
          description: 'Omit to keep the current setting. true is only accepted with stage production; any other stage switches it off.'
    WorkflowRollout:
      type: object
      required: [version, activeReleaseNumber, canary]
      properties:
        version: { type: integer, minimum: 1 }
        activeReleaseNumber: { type: [integer, 'null'] }
        canary:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [releaseId, releaseNumber, percent, setAt]
              properties:
                releaseId: { $ref: '#/components/schemas/Uuid' }
                releaseNumber: { type: integer }
                percent: { type: integer, minimum: 1, maximum: 50 }
                setAt: { $ref: '#/components/schemas/Timestamp' }
    SetWorkflowCanary:
      type: object
      additionalProperties: false
      required: [releaseId, percent, expectedVersion]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        percent: { type: integer, minimum: 1, maximum: 50 }
        expectedVersion: { type: integer, minimum: 1, description: 'The workflow version' }
    ReleaseAnalytics:
      type: object
      required: [days, from, to, releases]
      properties:
        days: { type: integer }
        from: { $ref: '#/components/schemas/Timestamp' }
        to: { $ref: '#/components/schemas/Timestamp' }
        releases:
          type: array
          items:
            type: object
            required: [releaseId, releaseNumber, active, canary, started, open, needsAttention, succeeded, rejected, cancelled, averageCompletionSeconds, successShare]
            properties:
              releaseId: { $ref: '#/components/schemas/Uuid' }
              releaseNumber: { type: integer }
              active: { type: boolean }
              canary: { type: boolean }
              started: { type: integer, minimum: 0 }
              open: { type: integer, minimum: 0 }
              needsAttention: { type: integer, minimum: 0 }
              succeeded: { type: integer, minimum: 0 }
              rejected: { type: integer, minimum: 0 }
              cancelled: { type: integer, minimum: 0 }
              averageCompletionSeconds: { type: [number, 'null'], description: 'Completed requests only' }
              successShare: { type: [number, 'null'], description: 'succeeded / (succeeded + rejected + cancelled); null until one has finished' }
    PromoteRelease:
      type: object
      additionalProperties: false
      required: [targetWorkspaceId]
      properties:
        targetWorkspaceId: { $ref: '#/components/schemas/Uuid' }
        expectedDraftRevision: { type: [integer, 'null'], minimum: 1, description: 'Required when the target already has the workflow' }
    PromotionReport:
      type: object
      required: [compatible, sourceStage, targetStage, approvalRequired, targetWorkflow, connections, groups, workflows, issues]
      properties:
        compatible: { type: boolean, description: 'True when the target compiles the definition without blockers' }
        sourceStage: { type: string }
        targetStage: { type: string }
        approvalRequired: { type: boolean, description: 'True when the target is a production workspace that requires approval: request the promotion instead of promoting' }
        targetWorkflow:
          type: object
          required: [exists, id, draftRevision]
          properties:
            exists: { type: boolean }
            id: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Uuid' }] }
            draftRevision: { type: [integer, 'null'] }
        connections:
          type: array
          items:
            type: object
            required: [key, definitionVersion, status]
            properties:
              key: { type: string }
              definitionVersion: { type: integer }
              status: { type: string, enum: [ready, bindingMissing, definitionMissing, definitionDiffers] }
        groups:
          type: array
          items:
            type: object
            required: [key, exists, memberCount]
            properties:
              key: { type: string }
              exists: { type: boolean }
              memberCount: { type: integer, minimum: 0 }
        workflows:
          type: array
          items:
            type: object
            required: [workflowKey, publishedInTarget]
            properties:
              workflowKey: { type: string }
              publishedInTarget: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    ReleasePromotion:
      type: object
      required: [id, targetWorkspaceId, targetWorkflowId, draftRevision, createdWorkflow, report]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        targetWorkspaceId: { $ref: '#/components/schemas/Uuid' }
        targetWorkflowId: { $ref: '#/components/schemas/Uuid' }
        draftRevision: { type: integer, minimum: 1 }
        createdWorkflow: { type: boolean }
        report: { $ref: '#/components/schemas/PromotionReport' }
    RequestPromotion:
      type: object
      additionalProperties: false
      required: [targetWorkspaceId]
      properties:
        targetWorkspaceId: { $ref: '#/components/schemas/Uuid' }
        expectedDraftRevision: { type: [integer, 'null'], minimum: 1, description: 'Required when the target already has the workflow' }
        note: { type: [string, 'null'], maxLength: 500 }
    PromotionDecision:
      type: object
      additionalProperties: false
      properties:
        note: { type: [string, 'null'], maxLength: 500, description: 'Required when rejecting' }
    PromotionRequest:
      type: object
      required: [id, status, sourceWorkspaceKey, workflowKey, releaseNumber, targetWorkspaceId, expectedDraftRevision, note, requestedById, requestedBy, requestedAt, decidedBy, decidedAt, decisionNote, promotionId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        sourceWorkspaceKey: { type: string }
        workflowKey: { type: string }
        releaseNumber: { type: integer }
        targetWorkspaceId: { $ref: '#/components/schemas/Uuid' }
        expectedDraftRevision: { type: [integer, 'null'] }
        note: { type: [string, 'null'] }
        requestedById: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string }
        requestedAt: { $ref: '#/components/schemas/Timestamp' }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Timestamp' }] }
        decisionNote: { type: [string, 'null'] }
        promotionId: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Uuid' }] }
    PromotionRecord:
      type: object
      required: [id, direction, sourceWorkspaceKey, targetWorkspaceKey, workflowKey, releaseNumber, targetDraftRevision, createdWorkflow, promotedAt, promotedBy, approvedBy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        direction: { type: string, enum: [incoming, outgoing] }
        sourceWorkspaceKey: { type: string }
        targetWorkspaceKey: { type: string }
        workflowKey: { type: string }
        releaseNumber: { type: integer }
        targetDraftRevision: { type: integer }
        createdWorkflow: { type: boolean }
        promotedAt: { $ref: '#/components/schemas/Timestamp' }
        promotedBy: { type: string }
        approvedBy: { type: [string, 'null'], description: 'The second person who approved it; null when no approval was required' }
    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowSummary'
        - type: object
          required: [version, createdAt, permissions]
          properties:
            version: { type: integer, description: 'Concurrency token for active-release changes' }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/Permission' }
    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { $ref: '#/components/schemas/Name' }
        description: { type: string, maxLength: 2000 }
        templateId: { $ref: '#/components/schemas/Key' }
    WorkflowDraft:
      type: object
      required: [workflowId, revision, savedAt, savedBy, definition]
      properties:
        workflowId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, minimum: 1 }
        savedAt: { $ref: '#/components/schemas/Timestamp' }
        savedBy: { $ref: '#/components/schemas/SubjectRef' }
        definition:
          type: object
          description: Canonical workflow document, possibly incomplete. Validate with POST /validate.
    SaveDraftRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition:
          type: object
          description: Must contain schemaVersion "0.1". Max 256 KiB serialized, depth 32.
    ValidationIssue:
      type: object
      required: [code, severity, message, path]
      properties:
        code: { type: string, pattern: '^WF_[A-Z_]+$' }
        severity: { type: string, enum: [blocker, warning] }
        message: { type: string }
        path: { type: string, description: 'JSON Pointer into the definition' }
        nodeId: { type: [string, 'null'] }
        transitionId: { type: [string, 'null'] }
    ValidationReport:
      type: object
      required: [revision, compilerVersion, publishable, issues]
      properties:
        revision: { type: integer }
        compilerVersion: { type: string }
        publishable: { type: boolean, description: 'True when there are no blockers' }
        semanticHash: { type: [string, 'null'] }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    DraftBpmn:
      type: object
      additionalProperties: false
      required: [revision, compilerVersion, available, bpmn, diagram, roundTrip, keptFromDraft, blockers]
      properties:
        revision: { type: integer, minimum: 1 }
        compilerVersion: { type: string }
        available: { type: boolean, description: 'False when the draft has blockers (it has no BPMN form yet)' }
        bpmn: { type: [string, 'null'], description: 'process.bpmn20.xml exactly as publishing would generate it' }
        diagram: { type: boolean, description: 'The BPMN contains a diagram, so canvas positions are carried' }
        roundTrip:
          type: object
          additionalProperties: false
          required: [identical, differences]
          properties:
            identical: { type: boolean, description: 'Draft to BPMN to draft gives the same name, steps, connections and positions' }
            differences:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path: { type: string, description: 'JSON Pointer into the draft' }
                  message: { type: string }
        keptFromDraft:
          type: array
          description: Sections BPMN does not carry; applying BPMN keeps them from the draft unchanged
          items: { type: string }
        blockers: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    BpmnCheckRequest:
      type: object
      additionalProperties: false
      required: [revision, bpmn]
      properties:
        revision: { type: integer, minimum: 1, description: 'Draft revision the BPMN was exported from' }
        bpmn: { type: string, minLength: 1, maxLength: 1048576 }
    BpmnApplyRequest:
      type: object
      additionalProperties: false
      required: [bpmn]
      properties:
        bpmn: { type: string, minLength: 1, maxLength: 1048576 }
    BpmnCheck:
      type: object
      additionalProperties: false
      required: [revision, applicable, problems, notes, changes]
      properties:
        revision: { type: integer, minimum: 1 }
        applicable: { type: boolean }
        problems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, elementId, message]
            properties:
              kind: { type: string, enum: [xml, unsupported, identity, blocker, notRepresentable, otherSection, roundTrip, draftRoundTrip] }
              elementId: { type: [string, 'null'], description: 'BPMN element id when the problem has one' }
              message: { type: string }
        notes: { type: array, description: 'Values that are recomputed rather than read (hashes, release pins, diagram lines)', items: { type: string } }
        changes:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [kind, what]
            properties:
              kind: { type: string, enum: [added, removed, changed] }
              what: { type: string }
    DecisionEvaluateRequest:
      type: object
      additionalProperties: false
      required: [revision, values]
      properties:
        revision: { type: integer, minimum: 1 }
        values:
          type: object
          description: 'Map of fieldRef to sample value, for example {"/input/amount": 5000}'
          additionalProperties: { type: [string, number, boolean] }
    DecisionEvaluateResult:
      type: object
      required: [matchedRow, usedDefault, output]
      properties:
        matchedRow: { type: [integer, 'null'], description: 'Zero-based row index, null when the default applied; under COLLECT the first matching row' }
        usedDefault: { type: boolean }
        output: { type: object, additionalProperties: { type: [string, number, boolean] } }
        matchedRows:
          type: array
          description: Zero-based indexes of every row that applies, in table order (several only under COLLECT, whose results are combined; empty when the default applied)
          items: { type: integer, minimum: 0 }

    WorkflowTestCase:
      type: object
      additionalProperties: false
      required: [id, name, input, expect]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        input: { type: object, additionalProperties: true }
        scenario: { $ref: '#/components/schemas/SimulationScenario' }
        expect: { type: string, minLength: 1, maxLength: 200, description: 'Expected business outcome, or __needsAttention__' }
        assertions: { $ref: '#/components/schemas/SimulationAssertions' }
    WorkflowTestSummary:
      type: object
      additionalProperties: false
      required: [suiteVersion, cases, lastRun]
      properties:
        suiteVersion: { type: integer, minimum: 0 }
        cases: { type: integer, minimum: 0 }
        lastRun:
          type: [object, 'null']
          additionalProperties: false
          required: [revision, passed, passedCases, totalCases, testedAt]
          properties:
            revision: { type: integer, minimum: 1 }
            passed: { type: boolean }
            passedCases: { type: integer, minimum: 0 }
            totalCases: { type: integer, minimum: 0 }
            testedAt: { type: string, format: date-time }
    SimulationAssertions:
      type: object
      additionalProperties: false
      description: What a test case checks after its dry run (STU03). Every item must hold for the case to pass.
      properties:
        outcome: { type: string, minLength: 1, maxLength: 200, description: 'Expected business outcome, or __needsAttention__' }
        outputs:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, op]
            properties:
              field: { type: string, minLength: 1, maxLength: 200, description: 'Output key, or /steps/<stepId>/<name> for a value a step wrote' }
              op: { type: string, enum: [equals, contains, range] }
              value: { type: [string, number, boolean], description: 'For equals and contains' }
              min: { type: number }
              max: { type: number }
        path:
          type: object
          additionalProperties: false
          required: [steps]
          properties:
            steps: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 200 } }
            match: { type: string, enum: [exact, inOrder], default: exact, description: 'exact - the steps visited, in order of first visit; inOrder - these steps are visited in this order, others may come between' }
        rules:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [stepId, rule]
            properties:
              stepId: { type: string, minLength: 1, maxLength: 200 }
              rule:
                oneOf:
                  - { type: integer, minimum: 1, maximum: 1000, description: 'Rule number (1-based)' }
                  - { type: string, enum: [otherwise] }
        approvals:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [stepId, decision]
            properties:
              stepId: { type: string, minLength: 1, maxLength: 200 }
              decision: { type: string, enum: [approved, rejected, timedOut] }
    SimulationAssertionResults:
      type: object
      required: [passed, results]
      properties:
        passed: { type: boolean }
        results:
          type: array
          items: { $ref: '#/components/schemas/SimulationAssertionResult' }
    SimulationAssertionResult:
      type: object
      required: [kind, label, passed, expected, actual]
      properties:
        kind: { type: string, enum: [outcome, output, path, rule, approval] }
        label: { type: string }
        passed: { type: boolean }
        expected: { type: string, description: 'What the case expects, in words' }
        actual: { type: string, description: 'What the dry run did, in words' }
        detail: { type: string, description: 'For a path: the first difference' }
    SimulateCasesRequest:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        revision: { type: integer, minimum: 1 }
        useActiveRelease: { type: boolean }
        cases:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, input]
            properties:
              id: { type: string, minLength: 1, maxLength: 80 }
              input: { type: object, additionalProperties: true }
              scenario: { $ref: '#/components/schemas/SimulationScenario' }
              assertions: { $ref: '#/components/schemas/SimulationAssertions' }
    SimulateCasesResult:
      type: object
      additionalProperties: false
      required: [source, passed, total, results]
      properties:
        source:
          type: object
          required: [revision, releaseNumber]
          properties:
            revision: { type: [integer, 'null'] }
            releaseNumber: { type: [integer, 'null'] }
        passed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, status, passed]
            properties:
              id: { type: string }
              status: { type: string, enum: [finished, needsAttention, invalid] }
              passed: { type: boolean }
              outcome:
                type: object
                properties:
                  status: { type: string }
                  businessOutcome: { type: [string, 'null'] }
                  outcomeKind: { type: [string, 'null'] }
                  summary: { type: string }
              assertions: { $ref: '#/components/schemas/SimulationAssertionResults' }
              problem: { type: string }
              fieldErrors:
                type: array
                items:
                  type: object
                  properties:
                    pointer: { type: string }
                    code: { type: string }
                    message: { type: string }
    WorkflowTestSuite:
      type: object
      additionalProperties: false
      required: [version, cases]
      properties:
        version: { type: integer, minimum: 0 }
        cases: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/WorkflowTestCase' } }
    SaveWorkflowTestSuite:
      type: object
      additionalProperties: false
      required: [expectedVersion, cases]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        cases: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/WorkflowTestCase' } }
    RunWorkflowTestSuite:
      type: object
      additionalProperties: false
      required: [revision, suiteVersion]
      properties:
        revision: { type: integer, minimum: 1 }
        suiteVersion: { type: integer, minimum: 1 }
    WorkflowTestReport:
      type: object
      additionalProperties: false
      required: [suiteVersion, revision, passed, results]
      properties:
        suiteVersion: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        passed: { type: boolean }
        results:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, passed, status]
            properties:
              id: { type: string }
              passed: { type: boolean }
              status: { type: string, enum: [finished, needsAttention, invalid] }
              failures:
                type: array
                description: Failed assertions with expected and actual (returned to the designer, never stored)
                items: { $ref: '#/components/schemas/SimulationAssertionResult' }
    SimulateRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        revision: { type: integer, minimum: 1, description: 'Draft revision to test; the current draft when omitted' }
        useActiveRelease: { type: boolean, description: 'Test the active release instead of a draft' }
        input:
          type: object
          description: The sample request, answers to the request form
          additionalProperties: true
        scenario: { $ref: '#/components/schemas/SimulationScenario' }
        assertions: { $ref: '#/components/schemas/SimulationAssertions' }
    SimulationScenario:
      type: object
      additionalProperties: false
      description: What happens at the steps a person or another system would decide. Everything defaults to the happy path.
      properties:
        approvals:
          type: object
          description: By step ID. Default is approve.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              outcome: { type: string, enum: [approve, reject, timeout] }
              reason: { type: string, maxLength: 1000 }
        calls:
          type: object
          description: >
            By step ID of a Call a system step (also an agent step). Default is success with a sample answer built from
            the response schema of the operation. A mock (status, body, delaySeconds, or failure timeout) is classified
            like the runtime classifies a real answer; nothing is sent.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              failure: { type: string, enum: [rejected, unavailable, unknownOutcome, timeout] }
              result: { type: object, additionalProperties: true, description: 'Partial answer with only the mapped fields (not checked against the response schema)' }
              status: { type: integer, minimum: 200, maximum: 599, description: 'HTTP status of the mocked answer; default the first success status' }
              body: { type: [object, array], description: 'The full mocked response body, checked against the response schema of the operation' }
              delaySeconds: { type: integer, minimum: 0, maximum: 2592000, description: 'How long the answer takes; above the step time limit it is a timeout' }
        workers:
          type: object
          description: By step ID of a Work by an external worker step. Default is a sample result.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              result: { type: object, additionalProperties: true, description: 'The result fields (checked against the declared fields)' }
              failure: { type: string, enum: [failed] }
              delaySeconds: { type: integer, minimum: 0, maximum: 2592000 }
        adapters:
          type: object
          description: By step ID of a Send through an adapter step. Default is delivered to the local stub.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              failure: { type: string, enum: [unavailable, unknownOutcome] }
              rowCount: { type: integer, minimum: 0, maximum: 10000, description: 'Rows a database read returns' }
        children:
          type: object
          description: By step ID of a Start another workflow step.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              outcomes:
                type: array
                maxItems: 25
                description: Business outcome of each occurrence in order; later occurrences use the default
                items: { type: string, maxLength: 100 }
              results:
                type: object
                additionalProperties: true
                description: Result fields of the child workflow, by child field
        messages:
          type: object
          description: By step ID of a Wait for a message step. arrives (default) or timeout, or a mock with the payload and a delay.
          additionalProperties:
            oneOf:
              - { type: string, enum: [arrives, timeout] }
              - type: object
                additionalProperties: false
                properties:
                  outcome: { type: string, enum: [arrives, timeout] }
                  payload: { type: object, additionalProperties: true, description: 'Payload fields (checked against the declared fields)' }
                  delaySeconds: { type: integer, minimum: 0, maximum: 2592000, description: 'Later than the time limit means a timeout' }
        simulateChildren: { type: boolean, description: 'Run the active release of each child workflow too (at most 3 levels)' }
        childScenarios:
          type: object
          description: Scenario for the child workflow of a step, by step ID (used with simulateChildren)
          additionalProperties: { type: object, additionalProperties: true }
    SimulationResult:
      type: object
      required: [source, outcome, outputs, trace, warnings, coverage, limits]
      properties:
        source:
          type: object
          required: [revision, releaseNumber]
          properties:
            revision: { type: [integer, 'null'] }
            releaseNumber: { type: [integer, 'null'] }
        outcome:
          type: object
          required: [status, summary]
          properties:
            status: { type: string, enum: [finished, needsAttention] }
            businessOutcome: { type: [string, 'null'] }
            outcomeKind: { type: [string, 'null'] }
            endStepId: { type: [string, 'null'] }
            summary: { type: string }
            attention:
              type: [object, 'null']
              properties:
                stepId: { type: string }
                stepLabel: { type: string }
                reason: { type: string, description: 'EFFECT_REJECTED, RETRIES_EXHAUSTED, EFFECT_UNKNOWN, RESPONSE_INVALID, CHILD_NEEDS_ATTENTION, INTERNAL_ERROR, ...' }
                message: { type: string }
        outputs: { type: object, additionalProperties: true }
        trace:
          type: array
          items: { $ref: '#/components/schemas/SimulationStep' }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              stepId: { type: [string, 'null'] }
              message: { type: string }
        coverage:
          type: object
          required: [steps, routes, rules, summary]
          properties:
            steps:
              type: object
              properties:
                visited: { type: integer }
                total: { type: integer }
                notVisited: { type: array, items: { type: object, additionalProperties: true } }
            routes:
              type: object
              properties:
                taken: { type: integer }
                total: { type: integer }
                notTaken: { type: array, items: { type: object, additionalProperties: true } }
            rules:
              type: object
              properties:
                matched: { type: integer }
                total: { type: integer }
                notMatched: { type: array, items: { type: object, additionalProperties: true } }
            summary: { type: string }
        limits: { type: string, description: What a dry run cannot prove }
        assertions: { $ref: '#/components/schemas/SimulationAssertionResults' }
    SimulationStep:
      type: object
      required: [seq, stepId, stepLabel, kind, kindLabel, summary, details]
      properties:
        seq: { type: integer, minimum: 1 }
        stepId: { type: string }
        stepLabel: { type: string }
        kind: { type: string }
        kindLabel: { type: string }
        branch: { type: string, description: 'Parallel branch such as 2 or 2.1; absent outside parallel work' }
        summary: { type: string, description: 'What happened and why, in plain language' }
        details: { type: object, additionalProperties: true, description: 'Kind-specific facts: evaluated rows, route conditions, assigned group, request and result of a call, message text' }
        wrote: { type: object, additionalProperties: true, description: 'Values this step stored at /steps/<id>/...' }
        transitionId: { type: [string, 'null'], description: 'The route followed out of this step; null when the run ended or stopped here' }
        nextStepId: { type: [string, 'null'] }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [draftRevision]
      properties:
        draftRevision: { type: integer, minimum: 1 }
        acknowledgeWarnings: { type: boolean, default: false }
        activate: { type: boolean, default: true, description: 'Make this release the one used for new starts' }
        releaseNote: { type: string, maxLength: 1000 }
    ReleaseSummary:
      type: object
      required: [id, workflowId, releaseNumber, draftRevision, publishedAt, publishedBy, isActive, compilerVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workflowId: { $ref: '#/components/schemas/Uuid' }
        releaseNumber: { type: integer }
        draftRevision: { type: integer }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedBy: { $ref: '#/components/schemas/SubjectRef' }
        isActive: { type: boolean }
        compilerVersion: { type: string }
        releaseNote: { type: [string, 'null'] }
    Release:
      allOf:
        - $ref: '#/components/schemas/ReleaseSummary'
        - type: object
          required: [sourceHash, semanticHash, warnings, manifest, definition]
          properties:
            sourceHash: { type: string }
            semanticHash: { type: string }
            warnings: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
            manifest: { $ref: '#/components/schemas/ReleaseManifest' }
            definition: { $ref: './workflow-v0.schema.json' }
    ReleaseManifest:
      type: object
      required: [releaseId, workflowKey, schemaVersion, compilerVersion, sourceHash, semanticHash, bpmnHash, dmnHashes, processDefinitionId, decisions, connections, groups]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        workflowKey: { $ref: '#/components/schemas/Key' }
        schemaVersion: { type: string }
        compilerVersion: { type: string }
        sourceHash: { type: string }
        semanticHash: { type: string }
        bpmnHash: { type: string }
        dmnHashes: { type: object, additionalProperties: { type: string } }
        processDefinitionId: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [key, version]
            properties:
              key: { $ref: '#/components/schemas/Key' }
              version: { type: integer }
        connections:
          type: array
          items:
            type: object
            required: [key, definitionVersion, definitionHash]
            properties:
              key: { $ref: '#/components/schemas/Key' }
              definitionVersion: { type: integer }
              definitionHash: { type: string }
        groups: { type: array, items: { $ref: '#/components/schemas/Key' } }
        assets:
          type: array
          description: Shared asset versions the release's copies were published from (docs/build/S61)
          items:
            type: object
            required: [kind, key, version, target]
            properties:
              kind: { type: string }
              key: { $ref: '#/components/schemas/Key' }
              version: { type: integer }
              target: { type: string }

    StartForm:
      type: object
      required: [workflowId, workflowName, releaseId, releaseNumber, inputSchema, isTest]
      properties:
        workflowId: { $ref: '#/components/schemas/Uuid' }
        workflowName: { type: string }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        releaseNumber: { type: integer }
        inputSchema: { type: object }
        inputUi: { type: object }
        isTest: { type: boolean }
    StartRunRequest:
      type: object
      additionalProperties: false
      required: [workflowId, input]
      properties:
        workflowId: { $ref: '#/components/schemas/Uuid' }
        expectedReleaseId:
          description: Release whose form the client rendered. 409 RELEASE_NOT_ACTIVE if another release became active.
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
        businessKey: { type: string, minLength: 1, maxLength: 100 }
        input: { type: object, additionalProperties: true, description: 'Validated against the active release inputSchema' }
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [name, correlationKey]
      properties:
        name: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z][a-zA-Z0-9]*(-[a-z0-9][a-zA-Z0-9]*)*$', example: payment-received }
        correlationKey: { type: string, minLength: 1, maxLength: 200, description: 'The value that identifies the request, for example its order number. Matched exactly (case-sensitive).' }
        payload:
          description: Flat object of scalar values (text up to 1,000 characters, numbers, true or false); at most 10 values and 16 KiB.
          oneOf: [{ type: object, additionalProperties: { type: [string, number, boolean, 'null'] } }, { type: 'null' }]
    DeliveredRun:
      type: object
      required: [runId, runReference, nodeId]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        runReference: { type: string, example: ORQ-1043 }
        nodeId: { type: string }
    MessageAccepted:
      type: object
      required: [id, status, matched, delivered, bufferedUntil]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [delivered, buffered] }
        matched: { type: integer, minimum: 0 }
        delivered: { type: array, items: { $ref: '#/components/schemas/DeliveredRun' } }
        bufferedUntil:
          description: End of the buffer window while status is buffered.
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
    CurrentStep:
      type: object
      required: [nodeId, label, kind, since]
      properties:
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [approval, http, wait, child, generateDocument, external, waitForSignal, compensate, adapter] }
        messageName: { type: [string, 'null'], description: 'Set while the step (kind wait) waits for this message (docs/build/S16).' }
        since: { $ref: '#/components/schemas/Timestamp' }
        candidateGroup: { type: [string, 'null'] }
        assignee: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    Attention:
      type: object
      required: [reason, nodeId, message, since]
      properties:
        reason:
          type: string
          enum: [RETRIES_EXHAUSTED, EFFECT_UNKNOWN, EFFECT_REJECTED, RESPONSE_INVALID, CONNECTION_UNAVAILABLE, POLICY_DENIED, INTERNAL_ERROR, RUN_WAITING_ON_NOTHING]
        nodeId: { type: [string, 'null'] }
        effectId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        message: { type: string, description: 'Business-readable, redacted' }
        since: { $ref: '#/components/schemas/Timestamp' }
    Run:
      type: object
      required: [id, workflow, release, initiator, lifecycle, outcome, outcomeKind, currentSteps, attention, createdAt, updatedAt, endedAt, isTest, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference:
          type: string
          description: Human request reference unique within the workspace, e.g. ORQ-1043 (shown instead of the UUID)
        workflow:
          type: object
          required: [id, key, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            key: { $ref: '#/components/schemas/Key' }
            name: { type: string }
        release:
          type: object
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer }
        businessKey: { type: [string, 'null'] }
        requestTitle:
          type: [string, 'null']
          description: >-
            What the request is about: the first text field of the request form (in form order), trimmed and cut to 120
            characters, for list display. Null for a caller who may not read the request data (the rule of `input` on
            RunDetail: the initiator, a task participant, or run.read-data) and when the form has no text field.
        initiator: { $ref: '#/components/schemas/SubjectRef' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        outcome: { type: [string, 'null'], description: 'Business outcome label from the end node' }
        outcomeKind: { oneOf: [{ $ref: '#/components/schemas/OutcomeKind' }, { type: 'null' }] }
        currentSteps: { type: array, items: { $ref: '#/components/schemas/CurrentStep' } }
        attention: { oneOf: [{ $ref: '#/components/schemas/Attention' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        isTest: { type: boolean }
        version: { type: integer }
        stage:
          description: The current stage (docs/build/S17); null when the workflow has no stages or none was entered yet.
          oneOf: [{ $ref: '#/components/schemas/StageView' }, { type: 'null' }]
        parentRun:
          description: The run that started this one through a "Start another workflow" step (S12); null for ordinary runs.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ParentRun'
    ParentRun:
      type: object
      required: [id, reference, nodeId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string, description: 'e.g. ORQ-1011' }
        nodeId: { type: string }
        nodeLabel: { type: [string, 'null'] }
    ChildRun:
      type: object
      required: [id, reference, workflow, release, nodeId, lifecycle, startedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow:
          type: object
          required: [id, key, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            key: { $ref: '#/components/schemas/Key' }
            name: { type: string }
        release:
          type: object
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer }
        nodeId: { type: string }
        nodeLabel: { type: [string, 'null'] }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        outcome: { type: [string, 'null'] }
        outcomeKind: { oneOf: [{ $ref: '#/components/schemas/OutcomeKind' }, { type: 'null' }] }
        attention: { oneOf: [{ $ref: '#/components/schemas/Attention' }, { type: 'null' }] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        iteration: { type: integer, minimum: 1 }
    RunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Run' } }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [tasks, allowedActions]
          properties:
            input: { type: [object, 'null'], description: 'Null unless the caller is the initiator, a task participant, or holds run.read-data' }
            inputLabels: { type: object, additionalProperties: { type: string } }
            output: { type: [object, 'null'] }
            children:
              description: Runs started by steps of this run, oldest first. A child that needs attention is visible here.
              type: array
              items: { $ref: '#/components/schemas/ChildRun' }
            stages:
              description: The stages of the workflow with this request's progress; empty when the workflow has no stages.
              type: array
              items: { $ref: '#/components/schemas/StageView' }
            tasks: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
            effects:
              description: Present only for run.operate holders.
              type: array
              items: { $ref: '#/components/schemas/Effect' }
            completedEffectsNotReversed:
              description: After cancellation, external effects that had already succeeded.
              type: array
              items: { $ref: '#/components/schemas/Effect' }
            suspension:
              description: Present while an operator has suspended the request. `reason` is shown to run.operate holders only.
              type: object
              additionalProperties: false
              required: [since]
              properties:
                since: { $ref: '#/components/schemas/Timestamp' }
                reason: { type: string }
            allowedActions:
              type: object
              required: [cancel, retry, reconcile, suspend, resume]
              properties:
                cancel: { $ref: '#/components/schemas/ActionAvailability' }
                retry: { $ref: '#/components/schemas/ActionAvailability' }
                reconcile: { $ref: '#/components/schemas/ActionAvailability' }
                suspend: { $ref: '#/components/schemas/ActionAvailability' }
                resume: { $ref: '#/components/schemas/ActionAvailability' }
    ActionAvailability:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reasonCode: { type: [string, 'null'] }
    StageView:
      type: object
      additionalProperties: false
      description: >-
        A case stage of a request (docs/build/S17): a presentation layer over its steps. `index` counts from 1. `state` is
        notStarted, active or completed; `overdue` is true for an active stage past `dueAt`.
      required: [id, label, index, total, state, overdue]
      properties:
        id: { type: string }
        label: { type: string }
        index: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 1 }
        state: { type: string, enum: [notStarted, active, completed] }
        enteredAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        completedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        overdue: { type: boolean }
        sla: { type: [string, 'null'], description: ISO-8601 time limit of the stage (PT1M to P90D) }
    StagedUpload:
      type: object
      additionalProperties: false
      required: [id, name, contentType, sizeBytes, sha256, scanStatus, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, description: Sanitized display name; never a path }
        contentType: { type: string, description: Canonical content type of the detected file type }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    ScanStatus:
      type: string
      enum: [notScanned, clean, infected, error]
      description: notScanned means no scanner is configured; infected and error files are never served.
    Attachment:
      type: object
      additionalProperties: false
      required: [id, runId, name, contentType, sizeBytes, sha256, scanStatus, uploadedBy, uploadedAt, canRemove, downloadable]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        fieldKey: { type: [string, 'null'], description: The request form field the file was chosen for; null for files added later }
        name: { type: string }
        description: { type: [string, 'null'], maxLength: 200 }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        uploadedBy: { $ref: '#/components/schemas/SubjectRef' }
        uploadedAt: { $ref: '#/components/schemas/Timestamp' }
        removedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        removedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        canRemove: { type: boolean }
        downloadable: { type: boolean, description: 'False for removed files, quarantined files and files blocked by the scan' }
        quarantinedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        quarantineReason: { type: [string, 'null'], maxLength: 300 }
    AttachmentLimits:
      type: object
      additionalProperties: false
      required: [maxFileBytes, maxFiles, maxTotalBytes, usedFiles, usedBytes, allowedTypes]
      properties:
        maxFileBytes: { type: integer }
        maxFiles: { type: integer }
        maxTotalBytes: { type: integer }
        usedFiles: { type: integer }
        usedBytes: { type: integer }
        allowedTypes: { type: array, items: { type: string, enum: [pdf, png, jpeg, txt, csv, docx, xlsx, pptx] } }
    AttachmentList:
      type: object
      additionalProperties: false
      required: [items, limits, canAdd]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        limits: { $ref: '#/components/schemas/AttachmentLimits' }
        canAdd: { type: boolean }
    QuarantineAttachment:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }
    AttachmentOcr:
      type: object
      additionalProperties: false
      required: [attachmentId, provider, status, extractedAt]
      properties:
        attachmentId: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, description: 'The provider that produced the result, for example local-stub' }
        status: { type: string, enum: [extracted, unsupported] }
        text: { type: [string, 'null'], maxLength: 100000, description: Present only when status is extracted }
        extractedAt: { $ref: '#/components/schemas/Timestamp' }
    AttachmentRetention:
      type: object
      additionalProperties: false
      required: [version, eligibleNow]
      properties:
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        version: { type: integer, minimum: 0, description: '0 until a setting is saved' }
        eligibleNow: { type: integer, minimum: 0, description: Files the next sweep would remove under this setting }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    SetAttachmentRetention:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        expectedVersion: { type: integer, minimum: 0 }
    DocumentFormat:
      type: string
      enum: [pdf, docx]
    DocumentTemplateSummary:
      type: object
      additionalProperties: false
      required: [id, key, name, latestVersion, format, placeholderCount, archived, createdAt, updatedAt, owner, revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        owner: { $ref: '#/components/schemas/SubjectRef' }
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 300 }
        latestVersion: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        placeholderCount: { type: integer, minimum: 0 }
        archived: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    DocumentTemplatePage:
      type: object
      additionalProperties: false
      required: [items, templateLimit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DocumentTemplateSummary' } }
        templateLimit: { type: integer }
    DocumentTemplateVersion:
      type: object
      additionalProperties: false
      required: [version, format, body, placeholders, sha256, createdBy, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        body: { type: string, minLength: 1, maxLength: 16000 }
        placeholders: { type: array, items: { type: string } }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        changeNote: { type: [string, 'null'], maxLength: 300 }
        createdBy: { $ref: '#/components/schemas/SubjectRef' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    DocumentTemplate:
      type: object
      additionalProperties: false
      required: [id, key, name, latestVersion, archived, createdAt, updatedAt, versions, owner, revision]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        owner: { $ref: '#/components/schemas/SubjectRef' }
        revision: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: [string, 'null'] }
        latestVersion: { type: integer, minimum: 1 }
        archived: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        versions: { type: array, items: { $ref: '#/components/schemas/DocumentTemplateVersion' } }
    CreateDocumentTemplate:
      type: object
      additionalProperties: false
      required: [name, format, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 300 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        body: { type: string, minLength: 1, maxLength: 16000, description: 'Plain text with {{field}} placeholders, as in the Generate a document step' }
        changeNote: { type: [string, 'null'], maxLength: 300 }
        key:
          description: Stable key used by versioned workflow references (docs/build/S61); derived from the name when omitted
          $ref: '#/components/schemas/Key'
    AddDocumentTemplateVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion, format, body]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        body: { type: string, minLength: 1, maxLength: 16000 }
        changeNote: { type: [string, 'null'], maxLength: 300 }
    SharedAssetKind:
      type: string
      enum: [decision, documentTemplate, connection]
    SharedAssetSummary:
      type: object
      additionalProperties: false
      required: [kind, key, name, owner, latestVersion, archived, revision, updatedAt]
      properties:
        kind: { $ref: '#/components/schemas/SharedAssetKind' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/SubjectRef' }
        latestVersion: { type: integer, minimum: 1 }
        archived: { type: boolean }
        revision: { type: integer, minimum: 0, description: 'Compare-and-set counter for owner and archive changes (0 for a connection never changed)' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        id: { type: [string, 'null'], format: uuid, description: 'Decision or template id; null for connections (identified by key)' }
    SharedAssetPage:
      type: object
      additionalProperties: false
      required: [items, searchedKinds, truncated]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SharedAssetSummary' } }
        searchedKinds: { type: array, items: { $ref: '#/components/schemas/SharedAssetKind' } }
        truncated: { type: boolean }
    SharedAssetVersion:
      type: object
      additionalProperties: false
      required: [version, sha256, createdBy, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        changeNote: { type: [string, 'null'] }
        createdBy: { $ref: '#/components/schemas/SubjectRef' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        content:
          description: The decision table content of this version (decisions only)
          oneOf:
            - { $ref: '#/components/schemas/DecisionAssetContent' }
            - { type: 'null' }
    SharedAsset:
      type: object
      additionalProperties: false
      required: [asset, versions]
      properties:
        asset: { $ref: '#/components/schemas/SharedAssetSummary' }
        versions: { type: array, items: { $ref: '#/components/schemas/SharedAssetVersion' } }
    SharedAssetUsage:
      type: object
      additionalProperties: false
      required: [kind, key, latestVersion, items]
      properties:
        kind: { $ref: '#/components/schemas/SharedAssetKind' }
        key: { $ref: '#/components/schemas/Key' }
        latestVersion: { type: integer, minimum: 1 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [workflowId, workflowKey, workflowName, stale]
            properties:
              workflowId: { $ref: '#/components/schemas/Uuid' }
              workflowKey: { type: string }
              workflowName: { type: string }
              draftVersion: { type: [integer, 'null'], description: 'Version pinned by the current draft, null when the draft does not reference the asset' }
              activeReleaseNumber: { type: [integer, 'null'] }
              activeReleaseVersion: { type: [integer, 'null'], description: 'Version the active release was published with' }
              stale: { type: boolean, description: 'The draft or the active release pins an older version than the latest' }
    DecisionAssetContent:
      type: object
      additionalProperties: false
      required: [hitPolicy, rows, default]
      description: The shareable part of a workflow decision table (contracts/workflow-v0.schema.json decisionTable without key and version)
      properties:
        hitPolicy: { type: string, enum: [UNIQUE, FIRST, ANY, PRIORITY, COLLECT] }
        aggregation: { type: string, enum: [SUM, MIN, MAX, COUNT], description: 'COLLECT only, required there' }
        priority:
          type: object
          description: PRIORITY only, required there - the output that decides and its values from the highest to the lowest priority
          additionalProperties: false
          required: [output, order]
          properties:
            output: { type: string }
            order: { type: array, minItems: 2, maxItems: 20, items: { type: [string, number, boolean] } }
        rows: { type: array, minItems: 1, maxItems: 50, items: { type: object, additionalProperties: true } }
        default: { type: object, additionalProperties: true }
    DecisionDmnChoice:
      type: object
      additionalProperties: false
      required: [id, name, table]
      properties:
        id: { type: string }
        name: { type: string }
        table: { type: boolean, description: false when the decision is not a decision table }
    DecisionDmnConversion:
      type: object
      additionalProperties: false
      required: [decisions, decisionId, name, content, notes]
      properties:
        decisions: { type: array, items: { $ref: '#/components/schemas/DecisionDmnChoice' } }
        decisionId: { type: [string, 'null'], description: The decision read; null when the file has several and none was chosen }
        name: { type: [string, 'null'] }
        content:
          oneOf:
            - { $ref: '#/components/schemas/DecisionAssetContent' }
            - { type: 'null' }
        notes: { type: array, items: { type: string } }
    CreateDecisionAsset:
      type: object
      additionalProperties: false
      required: [key, name, content]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 300 }
        content: { $ref: '#/components/schemas/DecisionAssetContent' }
        changeNote: { type: [string, 'null'], maxLength: 300 }
    AddDecisionAssetVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion, content]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/DecisionAssetContent' }
        changeNote: { type: [string, 'null'], maxLength: 300 }
    RunComment:
      type: object
      additionalProperties: false
      required: [id, runId, author, text, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        author:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            displayName: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
    RunCommentPage:
      type: object
      additionalProperties: false
      required: [comments, hasMore]
      properties:
        comments:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/RunComment' }
        hasMore: { type: boolean }
    RunEvent:
      type: object
      required: [seq, type, occurredAt, data]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { type: string, description: 'See event catalog in docs/build/S5-runtime.md' }
        nodeId: { type: [string, 'null'] }
        nodeLabel:
          type: [string, 'null']
          description: Business label of the node from the run's pinned release (helpers map to their owning node), so timelines never show raw IDs.
        actor: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        data: { type: object, additionalProperties: true, description: 'Event-specific fields (S5 section 8 catalog). DECISION_EVALUATED includes outputs and evidence (input field/value pairs, evaluated candidate rows, and defaultSelected) only for callers allowed to read request data. Metadata-only readers receive the decision/table identifiers without outputs or evidence.' }
    EventPage:
      type: object
      required: [items, nextAfter, hasMore, lifecycle]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RunEvent' } }
        nextAfter: { type: integer, description: 'Pass as ?after= on the next poll' }
        hasMore: { type: boolean }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
    PathNode:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { type: string, description: 'Canonical step type (start, approval, decision, branch, http, notification, parallelSplit, parallelJoin, wait, startWorkflow, end; others may be added).' }
        label: { type: string }
        outcomeKind: { oneOf: [{ $ref: '#/components/schemas/OutcomeKind' }, { type: 'null' }], description: Finish steps only }
        outcome: { type: [string, 'null'], description: Finish steps only (the business outcome label) }
        hasTimeout: { type: boolean, description: An approval with a time limit and a route for when it runs out }
        position:
          oneOf:
            - type: object
              required: [x, y]
              properties: { x: { type: number }, y: { type: number } }
            - { type: 'null' }
          description: Layout saved by the designer; null when the studio never arranged this step.
    PathTransition:
      type: object
      required: [id, from, to, on]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        on: { type: string, enum: [next, approved, rejected, timedOut, failed, condition, default, error], description: 'error only on a section error route (S59).' }
        label: { type: [string, 'null'], description: The designer's route label. Conditions are never included. }
    PathVisit:
      type: object
      required: [nodeId, occurrence, enteredAt, leftAt, outcome]
      properties:
        nodeId: { type: string }
        occurrence: { type: integer, minimum: 1, description: 'Which time the request was at this step (repeats in loops).' }
        itemIndex: { type: integer, minimum: 0, maximum: 19, description: 'List-driven approval only (S88): the 0-based list position of the item this task decided. Left out otherwise.' }
        itemLabel: { type: string, description: 'List-driven approval only (S88): what the task showed for its item.' }
        enteredAt: { $ref: '#/components/schemas/Timestamp' }
        leftAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        outcome:
          oneOf:
            - { type: string, enum: [approved, rejected, timedOut, failed, completed, cancelled, raised, interrupted] }
            - { type: 'null' }
          description: Null while the request is still at the step.
    PathCurrent:
      type: object
      required: [nodeId, label, kind, status, since]
      properties:
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [approval, http, wait, child, generateDocument, external, waitForSignal, compensate, adapter] }
        status: { type: string, enum: [waiting, running, needsAttention] }
        since: { $ref: '#/components/schemas/Timestamp' }
        candidateGroup: { type: [string, 'null'] }
        assignee: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    RunPath:
      type: object
      required: [runId, lifecycle, diagram, visited, current, taken]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        diagram:
          type: object
          required: [nodes, transitions]
          properties:
            nodes: { type: array, items: { $ref: '#/components/schemas/PathNode' } }
            transitions: { type: array, items: { $ref: '#/components/schemas/PathTransition' } }
            scopes: { type: array, items: { $ref: '#/components/schemas/PathScope' }, description: 'Sections and handlers (S59).' }
        visited: { type: array, items: { $ref: '#/components/schemas/PathVisit' } }
        current: { type: array, items: { $ref: '#/components/schemas/PathCurrent' } }
        taken: { type: array, items: { type: string }, description: Ids of the routes the request has used. }
        historyTruncated: { type: boolean, description: History exceeded the diagram limit; only current steps are reliable. }
        scopeVisits: { type: array, items: { $ref: '#/components/schemas/PathScopeVisit' }, description: 'Each time a section was entered or a handler started (S59).' }
    PathScope:
      type: object
      required: [id, label, type, nodes, routes]
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [embedded, event] }
        nodes: { type: array, items: { type: string } }
        trigger: { type: [string, 'null'], enum: [error, signal, timer, null] }
        interrupting: { type: [boolean, 'null'] }
        routes: { type: array, items: { $ref: '#/components/schemas/PathTransition' }, description: 'A section''s time-limit and error routes; from is the section id.' }
    PathScopeVisit:
      type: object
      required: [scopeId, startedAt, endedAt, how]
      properties:
        scopeId: { type: string }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        how: { type: [string, 'null'], enum: [completed, timedOut, error, signal, timer, null] }
    InsightsRange:
      type: object
      required: [from, to, days, generatedAt]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 365 }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
    InsightsWorkflow:
      type: object
      required: [id, key, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
    InsightsTotals:
      type: object
      required: [started, completed, fulfilled, rejected, cancelled, open, needsAttention]
      description: Requests started in the range, by where they stand now. started = completed + cancelled + open.
      properties:
        started: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        fulfilled: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0, description: 'Running, waiting or needing attention (needsAttention is included).' }
        needsAttention: { type: integer, minimum: 0 }
    InsightsCycleTime:
      type: object
      required: [workflow, completed, medianSeconds, p90Seconds]
      properties:
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        completed: { type: integer, minimum: 1 }
        medianSeconds: { type: integer, minimum: 0 }
        p90Seconds: { type: integer, minimum: 0 }
    InsightsOpenRun:
      type: object
      required: [runId, reference, workflow, lifecycle, startedAt, ageSeconds, stepLabel]
      description: A request identified by its reference only, never by its title or data.
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        ageSeconds: { type: integer, minimum: 0 }
        stepLabel: { type: [string, 'null'], description: The step it is at (first current step). }
    InsightsAttentionRun:
      type: object
      required: [runId, reference, workflow, reason, since, stepLabel]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        reason: { type: string, enum: [RETRIES_EXHAUSTED, EFFECT_UNKNOWN, EFFECT_REJECTED, RESPONSE_INVALID, CONNECTION_UNAVAILABLE, POLICY_DENIED, INTERNAL_ERROR, RUN_WAITING_ON_NOTHING] }
        since: { $ref: '#/components/schemas/Timestamp' }
        stepLabel: { type: [string, 'null'] }
    InsightsTimeout:
      type: object
      required: [workflow, nodeId, label, timeouts, decided, share]
      properties:
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        nodeId: { type: string }
        label: { type: string }
        timeouts: { type: integer, minimum: 1, description: Approvals that reached their time limit in the range. }
        decided: { type: integer, minimum: 0, description: Approvals of this step that ended in the range (decided or timed out). }
        share: { type: number, minimum: 0, maximum: 1 }
    InsightsOverdue:
      type: object
      required: [runId, reference, workflow, kind, stepLabel, dueAt, overdueSeconds]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        kind: { type: string, enum: [approval, wait] }
        stepLabel: { type: string }
        dueAt: { $ref: '#/components/schemas/Timestamp' }
        overdueSeconds: { type: integer, minimum: 1 }
    InsightsSummary:
      type: object
      required: [range, totals, cycleTimes, oldestOpen, needsAttention, sla]
      properties:
        range: { $ref: '#/components/schemas/InsightsRange' }
        totals: { $ref: '#/components/schemas/InsightsTotals' }
        cycleTimes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/InsightsCycleTime' }, description: 'Started to completed, per workflow, for requests that completed (not cancelled).' }
        oldestOpen: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/InsightsOpenRun' }, description: 'All open requests of the workspace (or workflow), oldest first.' }
        needsAttention: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/InsightsAttentionRun' } }
        sla:
          type: object
          required: [timeouts, overdue, overdueCount]
          properties:
            timeouts: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/InsightsTimeout' } }
            overdue: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/InsightsOverdue' } }
            overdueCount: { type: integer, minimum: 0 }
    InsightsDay:
      type: object
      required: [date, started, completed, fulfilled, rejected]
      properties:
        date: { type: string, format: date }
        started: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        fulfilled: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    InsightsThroughput:
      type: object
      required: [range, days]
      properties:
        range: { $ref: '#/components/schemas/InsightsRange' }
        days: { type: array, maxItems: 365, items: { $ref: '#/components/schemas/InsightsDay' } }
    InsightsStep:
      type: object
      required: [workflow, nodeId, label, kind, count, openNow, averageWaitSeconds, p90WaitSeconds, timeouts, timeoutShare]
      properties:
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [approval, wait] }
        count: { type: integer, minimum: 0, description: Times the step finished in the range (waited and left). }
        openNow: { type: integer, minimum: 0, description: Requests waiting at the step right now. }
        averageWaitSeconds: { type: [integer, 'null'] }
        p90WaitSeconds: { type: [integer, 'null'] }
        timeouts: { type: integer, minimum: 0 }
        timeoutShare: { type: number, minimum: 0, maximum: 1 }
    InsightsSteps:
      type: object
      required: [range, items, truncated]
      properties:
        range: { $ref: '#/components/schemas/InsightsRange' }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/InsightsStep' } }
        truncated: { type: boolean }
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    ExternalJobFetchRequest:
      type: object
      additionalProperties: false
      required: [workerId, topics]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        topics: { type: array, minItems: 1, maxItems: 10, items: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' } }
        maxJobs: { type: integer, minimum: 1, maximum: 10 }
        leaseSeconds: { type: integer, minimum: 30, maximum: 3600 }
    ExternalJob:
      type: object
      additionalProperties: false
      required: [id, topic, input, fence, leaseExpiresAt, attempt, maxAttempts, runReference, nodeId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        topic: { type: string }
        input: { type: object, additionalProperties: true, description: 'Only the values the step maps, by name.' }
        fence: { type: integer, minimum: 1 }
        leaseExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        attempt: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1 }
        runReference: { type: string }
        nodeId: { type: string }
    ExternalJobBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExternalJob' } }
    ExternalJobExtendRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        leaseSeconds: { type: integer, minimum: 30, maximum: 3600 }
    ExternalJobExtendResult:
      type: object
      additionalProperties: false
      required: [leaseExpiresAt]
      properties:
        leaseExpiresAt: { $ref: '#/components/schemas/Timestamp' }
    ExternalJobAwaitCallbackRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence, timeoutSeconds]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        timeoutSeconds: { type: integer, minimum: 30, maximum: 86400 }
    ExternalJobCallbackRegistration:
      type: object
      additionalProperties: false
      required: [callbackId, deadline]
      properties:
        callbackId: { $ref: '#/components/schemas/Uuid' }
        deadline: { type: string, format: date-time }
    ExternalJobCallbackResult:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result: { type: object, additionalProperties: true }
    ExternalJobCallbackFailure:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
    ExternalJobCompleteRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence, result]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        result: { type: object, additionalProperties: { type: [string, number, boolean] } }
    ExternalJobFailRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence, message, retryable]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        message: { type: string, minLength: 1, maxLength: 500 }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
    SendBackOpen:
      type: object
      additionalProperties: false
      required: [id, reason, fields, sentAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        fields: { type: array, items: { type: string } }
        sentAt: { $ref: '#/components/schemas/Timestamp' }
    SendBackRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    WithdrawSendBackRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
    AnswerSendBackRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, changes]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: Task version shown with the send-back }
        changes: { type: object, minProperties: 1, maxProperties: 10, additionalProperties: true }
        note: { type: string, maxLength: 500 }
    SendBack:
      type: object
      additionalProperties: false
      required: [id, taskId, nodeId, stepLabel, status, reason, fields, sentBy, sentAt, closedAt, note, taskVersion, canAnswer]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        taskId: { type: string }
        nodeId: { type: string }
        stepLabel: { type: string }
        status: { type: string, enum: [open, answered, withdrawn] }
        reason: { type: string }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, title, schema, value]
            properties:
              key: { type: string }
              title: { type: string }
              schema: { type: [object, 'null'], additionalProperties: true }
              value: { description: Current value; null without access to the request data }
        sentBy: { $ref: '#/components/schemas/SubjectRef' }
        sentAt: { $ref: '#/components/schemas/Timestamp' }
        closedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        taskVersion: { type: integer, minimum: 0 }
        canAnswer: { type: boolean }
    SendBackList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SendBack' } }
    CorrectTaskInputRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, changes]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        changes:
          type: object
          minProperties: 1
          maxProperties: 10
          description: Field key to its new single value.
          additionalProperties: { type: [string, number, boolean] }
    SendRunSignalRequest:
      type: object
      additionalProperties: false
      required: [signal, reason, expectedVersion]
      properties:
        signal: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z][a-zA-Z0-9]*(-[a-z0-9][a-zA-Z0-9]*)*$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    SuspendRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    RepairRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    RunDiagnosis:
      type: object
      additionalProperties: false
      required: [state, repairable, message, projectedNodeIds, engineNodeIds, version]
      properties:
        state: { type: string, enum: [inSync, projectionDrift, strandedToken, emptyRequest, engineMissing, unsupported, protected, ended] }
        repairable: { type: boolean }
        message: { type: string }
        projectedNodeIds: { type: array, items: { type: string } }
        engineNodeIds: { type: array, items: { type: string } }
        version: { type: integer }
    ConsistencyFinding:
      type: object
      additionalProperties: false
      required: [runId, reference, state, repairable, message, version, firstSeenAt, checkedAt]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        state: { type: string, enum: [projectionDrift, strandedToken, emptyRequest, engineMissing, unsupported] }
        repairable: { type: boolean }
        message: { type: string }
        version: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time }
    ConsistencyFindings:
      type: object
      additionalProperties: false
      required: [enabled, scannedRuns, lastCheckedAt, total, items]
      properties:
        enabled: { type: boolean }
        scannedRuns: { type: integer }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/ConsistencyFinding' } }
    MigrateRunRequest:
      type: object
      additionalProperties: false
      required: [targetReleaseId, reason, expectedVersion]
      properties:
        targetReleaseId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    MigrationFinding:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [STEP_COUNT, STEP_UNKNOWN, STEP_KIND, MULTI_INSTANCE, PER_ITEM, STEP_MISSING, STEP_CHANGED, HISTORY_CHANGED, PARALLEL_REGION, STAGES_CHANGED, SUBPROCESSES, INPUT_INVALID] }
        message: { type: string }
        nodeId: { type: [string, 'null'] }
    MigrationOption:
      type: object
      additionalProperties: false
      required: [release, active, publishedAt, compatible, findings]
      properties:
        release:
          type: object
          additionalProperties: false
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer, minimum: 1 }
        active: { type: boolean, description: This is the release new requests start on. }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        compatible: { type: boolean }
        findings: { type: array, items: { $ref: '#/components/schemas/MigrationFinding' } }
    MigrationOptions:
      type: object
      additionalProperties: false
      required: [current, ready, options]
      properties:
        current:
          type: object
          additionalProperties: false
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer, minimum: 1 }
        ready: { type: boolean }
        notReadyReason: { type: [string, 'null'] }
        options: { type: array, items: { $ref: '#/components/schemas/MigrationOption' } }
    ResumeRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    RetryRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        effectId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    ReconcileEffectRequest:
      type: object
      additionalProperties: false
      required: [resolution, evidence]
      properties:
        resolution: { type: string, enum: [confirmedApplied, confirmedNotApplied] }
        evidence:
          type: object
          additionalProperties: false
          required: [note]
          properties:
            note: { type: string, minLength: 10, maxLength: 1000 }
            remoteReference: { type: string, maxLength: 200 }
        result:
          type: object
          description: Required for confirmedApplied; keys must equal the node's resultMapping keys.
          additionalProperties: { type: [string, number, boolean] }
    Effect:
      type: object
      required: [id, nodeId, connectionKey, operation, effectClass, state, attempts, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nodeId: { type: string }
        label: { type: string }
        connectionKey: { $ref: '#/components/schemas/Key' }
        operation: { type: string }
        effectClass: { type: string, enum: [readOnly, idempotentWithKey, nonIdempotent] }
        state: { type: string, enum: [pending, inFlight, succeeded, retryableFailure, permanentFailure, unknown, notApplied] }
        attempts: { type: integer }
        lastHttpStatus: { type: [integer, 'null'] }
        lastErrorCode: { type: [string, 'null'] }
        lastErrorDetail: { type: [string, 'null'], description: 'Redacted; never contains credentials or payload values' }
        remoteReference: { type: [string, 'null'] }
        resolution: { type: [object, 'null'] }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    TaskSummary:
      type: object
      required: [id, runId, workflowName, nodeId, label, requester, candidateGroup, assignee, status, createdAt, version, priority]
      properties:
        id: { type: string }
        runId: { $ref: '#/components/schemas/Uuid' }
        runReference: { type: string, description: 'Human request reference, e.g. ORQ-1043' }
        workflowName: { type: string }
        businessKey: { type: [string, 'null'] }
        nodeId: { type: string }
        label: { type: string }
        requestTitle: { type: [string, 'null'], description: 'First text field of the request, for list display' }
        requester: { $ref: '#/components/schemas/SubjectRef' }
        candidateGroup:
          type: object
          required: [key, name]
          properties:
            key: { $ref: '#/components/schemas/Key' }
            name: { type: string }
        assignee: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        status: { type: string, enum: [open, completed, cancelled] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        version: { type: integer }
        priority: { type: integer, minimum: 0, maximum: 100, description: Higher values are shown first in the open queue; default 0 }
        decision: { oneOf: [{ $ref: '#/components/schemas/TaskDecision' }, { type: 'null' }] }
        stage:
          description: The stage of the workflow this step belongs to, with the request's timing for it; null when the workflow has no stages or the step is in none.
          oneOf: [{ $ref: '#/components/schemas/StageView' }, { type: 'null' }]
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [request, history, allowedActions, form]
          properties:
            request:
              type: object
              required: [input, inputSchema]
              properties:
                input: { type: object }
                inputSchema: { type: object, description: 'Pinned release schema, used for labels/formatting' }
                inputUi: { type: object }
            approvalView:
              type: [object, 'null']
              additionalProperties: true
              description: Immutable approval presentation copied from the pinned workflow release. Request data and current action permissions remain authoritative.
            history: { type: array, items: { $ref: '#/components/schemas/TaskDecision' } }
            form:
              type: object
              required: [rejectReasonRequired]
              properties:
                rejectReasonRequired: { type: boolean }
                correctableFields:
                  description: Request fields the caller may correct on this task now (holder or operator, task open, not suspended); empty otherwise.
                  type: array
                  items: { type: string }
                sendBack:
                  description: The open send-back of this task (S116); while it is open the task is neither decided nor corrected by the holder
                  oneOf: [{ $ref: '#/components/schemas/SendBackOpen' }, { type: 'null' }]
                fieldAccess:
                  description: Step form (S123). How each request field is shown on this task; unlisted fields are readOnly. Hidden fields are left out of request.input.
                  type: object
                  additionalProperties: { type: string, enum: [hidden, readOnly, editable, required] }
                capture:
                  description: Step form (S123). Form schema of the fields the decider fills in when approving (send them as fields on the decision).
                  type: object
                  additionalProperties: true
            allowedActions:
              type: object
              required: [claim, release, decide, reassign, priority]
              properties:
                claim: { $ref: '#/components/schemas/ActionAvailability' }
                release: { $ref: '#/components/schemas/ActionAvailability' }
                decide: { $ref: '#/components/schemas/ActionAvailability' }
                reassign: { $ref: '#/components/schemas/ActionAvailability' }
                priority: { $ref: '#/components/schemas/ActionAvailability' }
            completedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
    TaskPriorityRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, priority, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    VersionedCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, action]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        action: { type: string, enum: [approve, reject] }
        reason: { type: string, maxLength: 1000, description: 'Required (non-blank) when action = reject' }
        comment: { type: string, maxLength: 2000 }
        fields:
          description: 'Values for the fields the step captures (task form.capture, S123). Approve only: a rejection with fields is refused with 422.'
          type: object
          maxProperties: 10
          additionalProperties: true
    TaskDecision:
      type: object
      required: [id, taskId, runId, nodeId, actor, action, decidedAt, policyFlags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        taskId: { type: string }
        runId: { $ref: '#/components/schemas/Uuid' }
        nodeId: { type: string }
        label: { type: string }
        actor: { $ref: '#/components/schemas/SubjectRef' }
        action: { type: string, enum: [approve, reject] }
        reason: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        decidedAt: { $ref: '#/components/schemas/Timestamp' }
        policyFlags: { type: array, items: { type: string } }
    ReassignRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        assigneeSubjectId:
          description: Eligible member of the task's candidate group. Omit to return the task to the group.
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
        reason: { type: string, minLength: 1, maxLength: 500 }

    Notification:
      type: object
      required: [id, kind, message, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        runReference: { type: [string, 'null'], description: 'Human request reference of runId, e.g. ORQ-1043' }
        requestTitle: { type: [string, 'null'], description: 'Title of the request runId (see Run.requestTitle); null when the recipient may not read the request data' }
        kind: { type: string, enum: [workflowMessage, runAttention, discussionMention, promotionRequest, promotionDecision], description: 'promotionRequest: a promotion into this workspace waits for approval (open Promotions); promotionDecision: your promotion request was approved or rejected (workflowId is the source workflow)' }
        message: { type: string, description: 'For discussionMention: who mentioned the recipient, on which step and workflow; never the comment text' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        readAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        workflowId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'discussionMention: the workflow whose discussion mentions the recipient; promotionDecision: the promoted source workflow' }
        elementId: { type: [string, 'null'], description: 'discussionMention only: the step or connection ID of the discussion' }

    ConnectionSummary:
      type: object
      required: [key, name, latestVersion, versions, binding, operations]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        kind:
          type: string
          enum: [http, agent, microsoftGraph]
          description: http (default) or agent (an AI task over an MCP server, docs/build/S13-agents-mcp.md)
        latestVersion: { type: integer }
        versions: { type: array, items: { type: integer } }
        binding:
          type: object
          required: [configured, enabled]
          properties:
            configured: { type: boolean }
            enabled: { type: boolean }
            host: { type: [string, 'null'] }
        operations:
          type: array
          items:
            type: object
            required: [name, label, effectClass, testable]
            properties:
              name: { type: string }
              label: { type: string }
              effectClass: { type: string, enum: [readOnly, idempotentWithKey, nonIdempotent] }
              testable: { type: boolean }
    ConnectionDefinitionRecord:
      type: object
      required: [version, definition, definitionHash, createdAt, createdBy]
      properties:
        version: { type: integer }
        definition: { $ref: './connection-definition-v0.schema.json' }
        definitionHash: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        createdBy: { $ref: '#/components/schemas/SubjectRef' }
    ConnectionDetail:
      type: object
      required: [key, definitions, binding]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        definitions: { type: array, items: { $ref: '#/components/schemas/ConnectionDefinitionRecord' } }
        binding: { oneOf: [{ $ref: '#/components/schemas/ConnectionBinding' }, { type: 'null' }] }
    OAuthAuthorization:
      type: object
      additionalProperties: false
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    OAuthStatus:
      type: object
      additionalProperties: false
      required: [status, expiresAt, remoteRevocation]
      properties:
        status: { type: string, enum: [consentRequired, connected, refreshing, disconnected] }
        expiresAt: { type: [string, 'null'], format: date-time }
        remoteRevocation: { type: [string, 'null'], enum: [confirmed, unconfirmed, notConfigured, null] }
    OAuthFinishRequest:
      type: object
      additionalProperties: false
      required: [state, code]
      properties:
        state: { type: string, minLength: 43, maxLength: 43 }
        code: { type: string, minLength: 1, maxLength: 4096 }
    ConnectionAuth:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [none, bearerToken, apiKeyHeader, oauth2ClientCredentials, oauth2AuthorizationCode] }
        headerName: { type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{0,63}$' }
        secretRef: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', description: 'Name of a mounted secret, never the secret value' }
    PutConnectionBindingRequest:
      type: object
      additionalProperties: false
      required: [baseUrl, auth, enabled]
      properties:
        baseUrl: { type: string, format: uri, maxLength: 500 }
        auth: { $ref: '#/components/schemas/ConnectionAuth' }
        enabled: { type: boolean }
    ConnectionBinding:
      type: object
      required: [connectionKey, baseUrl, auth, enabled, revision, updatedAt, updatedBy]
      properties:
        connectionKey: { $ref: '#/components/schemas/Key' }
        baseUrl: { type: string }
        auth: { $ref: '#/components/schemas/ConnectionAuth' }
        enabled: { type: boolean }
        revision: { type: integer }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { $ref: '#/components/schemas/SubjectRef' }
    ConnectionTestResult:
      type: object
      required: [outcome, durationMs]
      properties:
        outcome: { type: string, enum: [succeeded, failed] }
        httpStatus: { type: [integer, 'null'] }
        durationMs: { type: integer }
        errorCode: { type: [string, 'null'], description: 'e.g. EGRESS_NOT_ALLOWED, TIMEOUT, CONNECT_FAILED, UNEXPECTED_STATUS, RESPONSE_INVALID; agents: AI_PROVIDER_UNAVAILABLE, AI_BUDGET_EXCEEDED, MCP_UNAVAILABLE, OUTPUT_INVALID' }
        detail: { type: [string, 'null'] }
        output:
          type: [object, 'null']
          description: Agent tests return the schema-valid structured result. Microsoft document tests return safe provenance including document, version or snapshot identifiers and hashes; extracted content and signed URLs are excluded.
        summary:
          type: [string, 'null']
          description: Agent test only. The business sentence the run timeline would show.

    RoleBinding:
      type: object
      required: [id, role, principal, source, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        principal: { $ref: '#/components/schemas/Principal' }
        source: { type: string, enum: [manual, seed, bootstrap] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    PermissionGrant:
      type: object
      required: [id, permission, workflowId, principal, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        permission: { type: string, enum: [workflow.start, connection.manage, message.send, document.browse, job.work, audit.read, workflow.approve-promotion, agent.approve-write-tool] }
        workflowId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        principal: { $ref: '#/components/schemas/Principal' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    Group:
      type: object
      required: [key, name, revision]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        members:
          description: Present only for workspace.manage-access holders.
          type: array
          items: { $ref: '#/components/schemas/Principal' }
        revision: { type: integer }
    AccessOverview:
      type: object
      required: [roleBindings, grants, groups]
      properties:
        roleBindings: { type: array, items: { $ref: '#/components/schemas/RoleBinding' } }
        grants: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } }
        groups: { type: array, items: { $ref: '#/components/schemas/Group' } }
    AiProfile:
      type: object
      required: [id, label, model, variablePrice]
      properties:
        id: { type: string }
        label: { type: string }
        model: { type: string, description: 'OpenRouter model id' }
        variablePrice: { type: boolean, description: 'True for routers such as typesafe/jev-router whose price depends on the routed model' }
    AiStatus:
      type: object
      required: [enabled, profiles]
      properties:
        enabled: { type: boolean }
        reason: { type: [string, 'null'], description: 'Why AI is unavailable (no key, credentials rejected, all profiles excluded, budget exhausted)' }
        defaultProfile: { type: [string, 'null'] }
        profiles: { type: array, items: { $ref: '#/components/schemas/AiProfile' } }
        excludedModels: { type: array, items: { type: string } }
        maxPrice:
          type: object
          properties:
            promptPerMillion: { type: number }
            completionPerMillion: { type: number }
        budget:
          type: object
          properties:
            monthlyUsd: { type: number }
            spentUsd: { type: number }
        disabledProfiles:
          type: array
          description: 'Profiles paused by the circuit breaker: their router chose a model the policy refuses; paused until the next UTC midnight'
          items:
            type: object
            required: [id, label, model, reason, until]
            properties:
              id: { type: string }
              label: { type: string }
              model: { type: string, description: 'The model the router chose' }
              reason: { type: string }
              until: { $ref: '#/components/schemas/Timestamp' }
    AiDraftRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: { type: string, minLength: 10, maxLength: 4000 }
        name: { type: string, minLength: 1, maxLength: 200 }
        profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'Model profile id from getAiStatus; the default profile when omitted' }
    AiGeneration:
      type: object
      required: [profile, model, promptVersion, attempts, durationMs]
      properties:
        profile: { type: string }
        model: { type: string, description: 'Model that produced the accepted output (routers report the routed model when known)' }
        promptVersion: { type: string }
        attempts: { type: integer }
        escalated: { type: boolean }
        inputTokens: { type: [integer, 'null'] }
        outputTokens: { type: [integer, 'null'] }
        costUsd: { type: [number, 'null'], description: 'From the provider usage report; null when not reported (never shown as zero)' }
        durationMs: { type: integer }
        policyViolation: { type: [string, 'null'], description: 'Set when a router chose a model the policy refuses (excluded, not allowed, or above the price caps); the profile is then paused for the rest of the UTC day' }
    AiGenerationJob:
      type: object
      required: [id, status, startedAt, profile]
      description: An accepted AI draft generation. Poll getAiGeneration until status is succeeded or failed.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
        profile: { type: string }
        result: { $ref: '#/components/schemas/AiDraftResult' }
        problem: { $ref: '#/components/schemas/Problem' }
    AiDraftResult:
      type: object
      required: [workflow, draft, report, assumptions, missingConfiguration, generation]
      properties:
        workflow: { $ref: '#/components/schemas/Workflow' }
        draft: { $ref: '#/components/schemas/WorkflowDraft' }
        report: { $ref: '#/components/schemas/ValidationReport' }
        assumptions: { type: array, items: { type: string } }
        missingConfiguration:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message: { type: string }
              nodeId: { type: [string, 'null'] }
              code: { type: [string, 'null'] }
        generation: { $ref: '#/components/schemas/AiGeneration' }
    WorkflowExplanation:
      type: object
      required: [summary, steps, generation]
      properties:
        summary: { type: string }
        validation:
          type: object
          description: Compiler readiness for this definition against current workspace configuration; authoritative independently of AI text
          required: [publishable, issues]
          properties:
            publishable: { type: boolean }
            issues:
              type: array
              items: { $ref: '#/components/schemas/ValidationIssue' }
        steps:
          type: array
          items:
            type: object
            required: [nodeId, text]
            properties:
              nodeId: { type: string }
              text: { type: string }
        generation: { $ref: '#/components/schemas/AiGeneration' }
    AiFormSuggestion:
      type: object
      description: S90 form suggestions. Every change already passed the compiler's form rules against the submitted form; apply only on an explicit user action.
      required: [changes, rejected, notes, generation]
      properties:
        changes:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AiFormChange' }
        rejected:
          type: array
          items:
            type: object
            required: [op, key, reasons]
            properties:
              op: { type: string }
              key: { type: string }
              reasons: { type: array, items: { type: string } }
        notes: { type: array, maxItems: 5, items: { type: string } }
        notAForm: { type: [string, 'null'], description: 'Why the description is not about a request form, when it is not' }
        generation: { $ref: '#/components/schemas/AiGeneration' }
    AiFormChange:
      type: object
      required: [op, key, required, reason]
      properties:
        op: { type: string, enum: [add, update, remove] }
        key: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
        field: { type: object, description: The complete question after the change (workflow-v0 formField); absent for remove }
        required: { type: boolean, description: Whether the question is required after the change }
        reason: { type: string, maxLength: 300 }
        before: { type: object, description: The question as it is now (update and remove) }
        wasRequired: { type: boolean, description: Whether the question is required now (update and remove) }
    AiDraftEditRequest:
      type: object
      description: STU02 conversation turn. revision must be the latest draft revision (save the draft first).
      additionalProperties: false
      required: [instruction, revision]
      properties:
        instruction: { type: string, minLength: 2, maxLength: 2000 }
        revision: { type: integer, minimum: 1, description: The draft revision the author is looking at }
        mode: { type: string, enum: [edit, regenerate], default: edit, description: 'regenerate rebuilds the draft from the request form and the start step' }
        history:
          type: array
          maxItems: 8
          description: The last turns of this conversation, oldest first; kept only in the browser
          items:
            type: object
            additionalProperties: false
            required: [role, text]
            properties:
              role: { type: string, enum: [author, assistant] }
              text: { type: string, minLength: 1, maxLength: 2000 }
        profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
        noQuestions: { type: boolean, default: false, description: 'S124: the author asked for a draft now, so the assistant asks no clarifying questions' }
    AiConversation:
      type: object
      required: [turns, updatedAt, version]
      properties:
        turns: { type: array, items: { $ref: '#/components/schemas/AiConversationTurn' } }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        version: { type: integer, minimum: 0, description: 0 when nothing is saved }
    AiConversationTurn:
      type: object
      additionalProperties: false
      required: [role, text]
      properties:
        role: { type: string, enum: [author, assistant] }
        text: { type: string, minLength: 1, maxLength: 2000 }
        mode: { type: string, enum: [edit, regenerate] }
        questions: { type: array, maxItems: 3, items: { type: string } }
        proposal: { type: object, additionalProperties: true, description: The assistant's proposal as it was shown }
    AiDraftEditProposal:
      type: object
      description: STU02 proposal. Every change already passed the compiler against the draft revision; apply only on an explicit user action.
      required: [revision, mode, changes, rejected, notes, generation]
      properties:
        revision: { type: integer, description: The draft revision the proposal was validated against }
        mode: { type: string, enum: [edit, regenerate] }
        message: { type: string, maxLength: 300, description: The assistant's short reply to the author }
        changes:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AiDraftEditChange' }
        rejected:
          type: array
          items:
            type: object
            required: [summary, reasons]
            properties:
              summary: { type: string }
              reasons: { type: array, items: { type: string } }
        notes: { type: array, maxItems: 5, items: { type: string } }
        notAnEdit: { type: string, description: 'Why the instruction is not about this workflow, when it is not' }
        definition: { type: object, additionalProperties: true, description: 'regenerate only: the complete proposed draft (workflow-v0 document with layout)' }
        generation: { $ref: '#/components/schemas/AiGeneration' }
        questions: { type: array, maxItems: 3, items: { type: string, maxLength: 200 }, description: 'S124: clarifying questions asked instead of changes; answer them in the next turn or ask for a draft with noQuestions' }
    AiDraftEditChange:
      type: object
      required: [id, summary, operations, dependsOn]
      properties:
        id: { type: string, description: 'c1, c2, ... in proposal order' }
        summary: { type: string, maxLength: 300 }
        operations:
          type: array
          minItems: 1
          maxItems: 60
          items: { $ref: '#/components/schemas/AiDraftEditOperation' }
        dependsOn: { type: array, items: { type: string }, description: Earlier changes that create or modify something this change relies on }
    AiDraftEditOperation:
      type: object
      description: >-
        One normalized edit operation. addStep {id, kind, label, config (complete)}; updateStep {id, config (patch; null
        removes a setting), before}; renameStep {id, label, before}; removeStep {id, before}; connect {transitionId
        (chosen by the server), from, to, on, label?, condition?}; disconnect {transitionId, before};
        changeFormField {action, key, field?, required, before?, wasRequired?}. S124: setFieldRule {key, rule
        (visibleWhen|requiredWhen), condition (null removes), before}; setStepFieldAccess {id, config (patch of
        fieldAccess and capture), before}; setFormGroups {groups, before}; addDecision {id, label, table}; addCall {id,
        label, config (complete), definitionVersion, addsDependency}. before is the element as it was when the
        operation was validated; the studio skips a change whose targets differ from it.
      required: [op]
      properties:
        op: { type: string, enum: [addStep, updateStep, renameStep, removeStep, connect, disconnect, changeFormField, setFieldRule, setStepFieldAccess, setFormGroups, addDecision, addCall] }
        rule: { type: string, enum: [visibleWhen, requiredWhen] }
        groups: { type: array, items: { type: object, additionalProperties: true } }
        table: { type: object, additionalProperties: true }
        definitionVersion: { type: integer, minimum: 1 }
        addsDependency: { type: boolean }
        id: { type: string }
        kind: { type: string, enum: [approval, branch, notification, wait, end] }
        label: { type: string }
        config: { type: object, additionalProperties: true }
        transitionId: { type: string }
        from: { type: string }
        to: { type: string }
        'on': { type: string, enum: [next, approved, rejected, timedOut, failed, condition, default] }
        condition: { type: [object, 'null'], additionalProperties: true }
        action: { type: string, enum: [add, update, remove] }
        key: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
        field: { type: object, additionalProperties: true }
        required: { type: boolean }
        before: { type: [object, array, 'null'], additionalProperties: true }
        wasRequired: { type: boolean }
    CompatibilityIssue:
      type: object
      required: [sourceElementId, sourceKind, severity, reasonCode, explanation, resolutionStatus]
      properties:
        sourceElementId: { type: string }
        sourceName: { type: [string, 'null'] }
        sourceKind: { type: string }
        severity: { type: string, enum: [supported, info, review, action, blocker] }
        reasonCode: { type: string }
        explanation: { type: string }
        suggestedAction: { type: [string, 'null'] }
        targetNodeId: { type: [string, 'null'] }
        resolutionStatus: { type: string, enum: [open, resolved, acknowledged, notNeeded] }
        sourcePath: { type: [string, 'null'] }
    CompatibilityReport:
      type: object
      required: [sourceSystem, adapterVersion, sourceHash, elementCounts, issues, assumptions, publishable]
      properties:
        sourceSystem: { type: string, enum: [camunda7, camunda8, bpmn, dmn, camundaForm, pega, cmmn] }
        sourceVersion: { type: [string, 'null'] }
        adapterVersion: { type: string }
        sourceHash: { type: string }
        processId: { type: [string, 'null'] }
        processName: { type: [string, 'null'] }
        elementCounts:
          type: object
          properties:
            total: { type: integer }
            supported: { type: integer }
            info: { type: integer }
            review: { type: integer, description: 'Converted items whose behaviour could differ; they never block conversion' }
            action: { type: integer }
            blocker: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/CompatibilityIssue' } }
        assumptions: { type: array, items: { type: string } }
        requiredMappings:
          type: object
          properties:
            groups: { type: array, items: { type: string } }
            approvalTasks: { type: array, items: { type: string } }
            serviceTasks: { type: array, items: { type: string } }
            childWorkflows: { type: array, items: { type: string } }
            serviceGroups:
              type: object
              description: 'Implementation key (topic:..., jobType:..., class:..., delegateExpression:..., expression:...) to the service task ids that share it; one serviceGroupMappings entry covers all of them'
              additionalProperties: { type: array, items: { type: string } }
            decisionTasks: { type: array, items: { type: string }, description: 'Business rule tasks that call a DMN decision by a literal id and need a decisionMappings entry' }
        mappingHints: { $ref: '#/components/schemas/MappingHints' }
        testCases:
          type: array
          description: 'Generated behaviour checks (DMN): the source semantics versus the converted table evaluated by the compiler'
          items: { $ref: '#/components/schemas/MigrationTestCase' }
        publishable: { type: boolean, description: 'True when no blocker, open action or unacknowledged info item remains. Review items never affect it.' }
    MappingHints:
      type: object
      description: 'Structured facts for the mapping helper (Camunda 8), keyed by source element id. Header and query parameter values, credentials and full URLs are never included.'
      properties:
        services:
          type: object
          additionalProperties:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [jobWorker, httpJson, unsupportedConnector] }
              jobType: { type: [string, 'null'] }
              suggestedOperation: { type: [string, 'null'], description: 'Operation name suggested from the step name or job type' }
              method: { type: [string, 'null'], description: 'Original HTTP method (provenance, read-only)' }
              urlHost: { type: [string, 'null'] }
              urlPath: { type: [string, 'null'], description: 'Original path without query (provenance, read-only)' }
              urlComputed: { type: boolean }
              authentication: { type: [string, 'null'], description: 'Authentication type name only' }
              headerNames: { type: array, items: { type: string } }
              queryNames: { type: array, items: { type: string } }
              resultVariable: { type: [string, 'null'] }
              inputFields: { type: object, additionalProperties: { type: string }, description: 'Request body name to request field key' }
              resultFields: { type: object, additionalProperties: { type: string }, description: 'Result name to JSON Pointer into the response body' }
              unmapped: { type: array, items: { type: string } }
              replacement: { type: [string, 'null'] }
        forms:
          type: object
          additionalProperties:
            type: object
            properties:
              target: { type: string, enum: [start, userTask] }
              formId: { type: [string, 'null'] }
              formKey: { type: [string, 'null'] }
              binding: { type: [string, 'null'] }
              state: { type: string, enum: [embedded, upload, unsupported] }
        calls:
          type: object
          additionalProperties:
            type: object
            properties:
              processId: { type: [string, 'null'] }
              binding: { type: [string, 'null'] }
              propagateAllChildVariables: { type: boolean }
              propagateAllParentVariables: { type: boolean }
              inputMapping: { type: object, additionalProperties: { type: string } }
              resultMapping: { type: object, additionalProperties: { type: string } }
        formPreviews:
          type: object
          description: 'Preview per form: embedded forms by element id, an uploaded form file by its form id'
          additionalProperties:
            type: object
            properties:
              formId: { type: [string, 'null'] }
              fields: { type: array, items: { $ref: '#/components/schemas/FormPreviewField' } }
              skipped: { type: array, items: { $ref: '#/components/schemas/FormPreviewField' } }
    FormPreviewField:
      type: object
      properties:
        id: { type: [string, 'null'] }
        key: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        component: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        widget: { type: [string, 'null'] }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }
        disposition: { type: [string, 'null'] }
        reasonCode: { type: [string, 'null'] }
    MigrationTestCase:
      type: object
      required: [decision, name, input, expected, actual, status]
      properties:
        decision: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: { type: [string, number, boolean] } }
        expected: { type: object, additionalProperties: { type: [string, number, boolean] } }
        actual: { type: object, additionalProperties: { type: [string, number, boolean] } }
        matchedRow: { type: [integer, 'null'], description: 'Zero-based row of the converted table, null when its default applied' }
        status: { type: string, enum: [passed, failed] }
    ServiceTaskMapping:
      type: object
      additionalProperties: false
      required: [connectionRef, operation, inputMapping, resultMapping]
      properties:
        connectionRef: { $ref: '#/components/schemas/Key' }
        operation: { type: string }
        inputMapping: { type: object, additionalProperties: { type: string } }
        resultMapping: { type: object, additionalProperties: { type: string } }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 30 }
        definitionVersion: { type: integer, minimum: 1, default: 1 }
    BlueprintElementId: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$' }
    BlueprintDisposition:
      type: string
      enum: [proposed, mapped, manuallyResolved, excluded]
      description: 'proposed = not yet reviewed; mapped = reviewed against its source page; manuallyResolved = edited or added by the reviewer; excluded = out of scope with a dispositionReason'
    BlueprintTranscription:
      type: object
      additionalProperties: false
      description: Reviewed structured transcription of a blueprint (docs/build/S91); the single source of truth for conversion.
      required: [format]
      properties:
        format: { type: string, const: orqix-blueprint-transcription-0.1 }
        caseType:
          type: [object, 'null']
          additionalProperties: false
          required: [name, disposition]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            sourcePage: { type: [integer, 'null'], minimum: 1 }
            sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
            disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
            dispositionReason: { type: [string, 'null'], maxLength: 500 }
        start: { type: [string, 'null'], description: 'Id of the first step or decision' }
        stages: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/BlueprintNamedElement' } }
        roles: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/BlueprintNamedElement' } }
        fields:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, disposition]
            properties:
              id: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
              name: { type: string, minLength: 1, maxLength: 200 }
              type: { type: [string, 'null'], enum: [string, number, integer, boolean, date, null] }
              required: { type: boolean }
              sourcePage: { type: [integer, 'null'], minimum: 1 }
              sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
              disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
              dispositionReason: { type: [string, 'null'], maxLength: 500 }
        steps:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, disposition]
            properties:
              id: { $ref: '#/components/schemas/BlueprintElementId' }
              name: { type: string, minLength: 1, maxLength: 200 }
              stage: { type: [string, 'null'] }
              type: { type: [string, 'null'], enum: [approval, task, automated, null] }
              role: { type: [string, 'null'] }
              next: { type: [string, 'null'], description: 'Step, decision or outcome after approval (or completion)' }
              onReject: { type: [string, 'null'], description: 'Target when an approver rejects' }
              sourcePage: { type: [integer, 'null'], minimum: 1 }
              sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
              disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
              dispositionReason: { type: [string, 'null'], maxLength: 500 }
        decisions:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, disposition]
            properties:
              id: { $ref: '#/components/schemas/BlueprintElementId' }
              name: { type: string, minLength: 1, maxLength: 200 }
              rules:
                type: array
                maxItems: 20
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    field: { type: [string, 'null'] }
                    operator: { type: [string, 'null'], enum: ['>=', '>', '<=', '<', '==', '!=', null] }
                    value: { type: [string, 'null'], maxLength: 200 }
                    target: { type: [string, 'null'] }
              otherwise: { type: [string, 'null'] }
              sourcePage: { type: [integer, 'null'], minimum: 1 }
              sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
              disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
              dispositionReason: { type: [string, 'null'], maxLength: 500 }
        slas:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, disposition]
            properties:
              id: { $ref: '#/components/schemas/BlueprintElementId' }
              name: { type: string, minLength: 1, maxLength: 200 }
              step: { type: [string, 'null'] }
              amount: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
              unit: { type: [string, 'null'], enum: [minutes, hours, days, workingDays, null] }
              sourcePage: { type: [integer, 'null'], minimum: 1 }
              sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
              disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
              dispositionReason: { type: [string, 'null'], maxLength: 500 }
        outcomes:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, disposition]
            properties:
              id: { $ref: '#/components/schemas/BlueprintElementId' }
              name: { type: string, minLength: 1, maxLength: 200 }
              type: { type: [string, 'null'], enum: [success, rejected, null] }
              sourcePage: { type: [integer, 'null'], minimum: 1 }
              sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
              disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
              dispositionReason: { type: [string, 'null'], maxLength: 500 }
        integrations:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, disposition]
            properties:
              id: { $ref: '#/components/schemas/BlueprintElementId' }
              name: { type: string, minLength: 1, maxLength: 200 }
              target: { type: [string, 'null'], maxLength: 200 }
              step: { type: [string, 'null'] }
              sourcePage: { type: [integer, 'null'], minimum: 1 }
              sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
              disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
              dispositionReason: { type: [string, 'null'], maxLength: 500 }
    BlueprintNamedElement:
      type: object
      additionalProperties: false
      required: [id, name, disposition]
      properties:
        id: { $ref: '#/components/schemas/BlueprintElementId' }
        name: { type: string, minLength: 1, maxLength: 200 }
        sourcePage: { type: [integer, 'null'], minimum: 1 }
        sourceExcerpt: { type: [string, 'null'], maxLength: 500 }
        disposition: { $ref: '#/components/schemas/BlueprintDisposition' }
        dispositionReason: { type: [string, 'null'], maxLength: 500 }
    BlueprintTranscriptionView:
      type: object
      required: [migrationId, status, revision, transcriptionSha256, origin, savedAt, layout, pageCount, javascript, embeddedFiles, pages, transcription, report]
      properties:
        migrationId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [analyzed, converted, failed] }
        revision: { type: integer, minimum: 1 }
        transcriptionSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Send as transcriptionSha256 when converting this revision' }
        origin: { type: string, enum: [extracted, edited] }
        savedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        savedAt: { type: string, format: date-time }
        layout:
          type: object
          required: [id, revision]
          properties:
            id: { type: string, description: 'pega-blueprint (Pega Blueprint export) or generic-outline' }
            revision: { type: string }
        pageCount: { type: integer, minimum: 1, maximum: 60 }
        javascript: { type: boolean, description: 'The PDF contained JavaScript or automatic actions; they were ignored' }
        embeddedFiles: { type: boolean, description: 'The PDF contained embedded files; they were not opened' }
        pages:
          type: array
          items:
            type: object
            required: [number, text, sha256, unclassifiedLines]
            properties:
              number: { type: integer, minimum: 1 }
              text: { type: string, description: 'Extracted page text; with the pega-blueprint layout, the page in reading order (lifecycle stage by stage, steps indented under their stage, table cells separated by tabs)' }
              sha256: { type: string }
              unclassifiedLines: { type: integer, minimum: 0 }
        transcription: { $ref: '#/components/schemas/BlueprintTranscription' }
        report: { $ref: '#/components/schemas/CompatibilityReport' }
    PegaRuleArchive:
      type: object
      required: [migrationId, status, decoder, adapterVersion, sourceSha256, stack, archiveBlockers, entries, contexts, startingPoints, conversion]
      properties:
        migrationId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [analyzed, converted, failed] }
        decoder: { type: string, description: Decoder and resolver version }
        adapterVersion: { type: string }
        sourceSha256: { type: string }
        application: { type: [string, 'null'], description: 'Rule-Application name and version declared in the archive; not proof of a certified Pega release' }
        stack:
          type: array
          description: Application ruleset stack in precedence order
          items: { type: object, required: [name, version], properties: { name: { type: string }, version: { type: string } } }
        archiveBlockers:
          type: array
          items: { type: object, required: [code, paths], properties: { code: { type: string }, paths: { type: array, items: { type: string } } } }
        entries:
          type: array
          items: { $ref: '#/components/schemas/PegaRuleEntry' }
        contexts:
          type: array
          items: { $ref: '#/components/schemas/PegaRuleContext' }
        startingPoints:
          type: array
          items: { $ref: '#/components/schemas/PegaRuleStartingPoint' }
        convertedStartRule: { type: [string, 'null'] }
        caseConversion:
          description: The case definition created from a case type of this archive (S117)
          oneOf:
            - type: 'null'
            - type: object
              required: [startRule, caseDefinitionId, caseKey, caseVersion, sourceSha256]
              properties:
                startRule: { type: string }
                caseDefinitionId: { $ref: '#/components/schemas/Uuid' }
                caseKey: { type: string }
                caseVersion: { type: integer }
                sourceSha256: { type: string }
        conversion:
          type: array
          description: Recorded per-rule results of the converted starting point (empty before conversion)
          items:
            type: object
            required: [rule, startRule, resolution, conversion, targets, reasons]
            properties:
              rule: { type: string }
              startRule: { type: string }
              resolution: { type: string }
              conversion: { type: string, enum: [converted, review, blocked, notUsed, shadowed, supported] }
              targetKind: { type: [string, 'null'] }
              targets: { type: array, items: { type: string } }
              targetSha256: { type: [string, 'null'] }
              reasons: { type: array, items: { type: string } }
    PegaRuleEntry:
      type: object
      required: [path, sha256, status, circumstanced]
      properties:
        path: { type: string }
        sha256: { type: string }
        status: { type: string, enum: [manifest, rule, data, delegation, refused], description: 'delegation is a System-User-MyRules record kept as provenance' }
        reason: { type: [string, 'null'], description: Refusal reason code }
        detail: { type: [string, 'null'] }
        ruleType: { type: [string, 'null'] }
        className: { type: [string, 'null'] }
        ruleName: { type: [string, 'null'] }
        ruleset: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        availability: { type: [string, 'null'], description: 'Yes, No, Blocked, Withdrawn or Final' }
        circumstanced: { type: boolean, description: 'The rule has a qualifier (property or date circumstance, or a date range)' }
        qualifier:
          description: 'kind property (property, value), date (property, date YYYYMMDD), dateRange (from, to as YYYYMMDDTHHMMSS.mmm GMT) or multivariate (parts)'
          oneOf: [{ type: 'null' }, { type: object, required: [kind], additionalProperties: true, properties: { kind: { type: string, enum: [property, date, dateRange, multivariate] } } }]
    PegaRuleContext:
      type: object
      required: [className, chain, keys]
      properties:
        className: { type: string }
        chain: { type: array, description: 'Class inheritance searched, closest first', items: { type: string } }
        keys:
          type: array
          items:
            type: object
            required: [ruleType, ruleName, status, candidates]
            properties:
              ruleType: { type: string }
              ruleName: { type: string }
              status: { type: string, enum: [resolved, noCandidate, circumstanceUnresolved, ambiguous, blocked, finalOverridden] }
              chosen: { type: [string, 'null'], description: Entry path of the effective rule }
              variants:
                type: array
                description: 'Circumstance and date variants of the chosen base rule, with their qualifier (S115)'
                items: { type: object, required: [rule, kind], additionalProperties: true, properties: { rule: { type: string }, kind: { type: string } } }
              candidates:
                type: array
                items: { type: object, required: [rule, outcome], properties: { rule: { type: string }, outcome: { type: string } } }
    PegaRuleStartingPoint:
      type: object
      required: [rule, kind, context, name, label, blocked, report, rules, assignments, subflows, calls]
      properties:
        rule: { type: string }
        kind: { type: string, enum: [caseType, flow, process], description: 'process is a flow a case type runs as a process; convert and publish it so a case definition can pin it (S117)' }
        context: { type: string }
        name: { type: string }
        label: { type: string }
        blocked: { type: boolean }
        report: { $ref: '#/components/schemas/CompatibilityReport' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/PegaRuleResult' }
        assignments:
          type: array
          description: 'Assignments to map: the work queue needs a groupMappings entry, and one of the two flow actions is chosen as approval in approvalRoutes (never inferred)'
          items:
            type: object
            required: [id, label, workQueue, flow, actions]
            properties:
              id: { type: string }
              label: { type: string }
              workQueue: { type: string }
              flow: { type: string }
              actions:
                type: array
                items: { type: object, required: [connectorId, flowAction], properties: { connectorId: { type: string }, flowAction: { type: string } } }
        subflows:
          type: array
          description: 'Subflow calls that become child workflow steps; each id needs a childWorkflowMappings entry naming a published workflow'
          items:
            type: object
            required: [id, label, flow, source]
            properties:
              id: { type: string }
              label: { type: string }
              flow: { type: string, description: Subflow rule name }
              source: { type: string, description: Flow that calls it }
        calls:
          type: array
          description: 'Connector and data page calls that become call steps (S117); each id needs a connectionMappings entry naming a workspace connection operation'
          items:
            type: object
            required: [id, label, connector, method, inputMapping, resultMapping, timeoutSeconds, flow]
            properties:
              id: { type: string }
              label: { type: string }
              connector: { type: string }
              dataPage: { type: [string, 'null'] }
              method: { type: string }
              endpoint: { type: [string, 'null'], description: 'Source endpoint, shown for review only' }
              inputMapping: { type: object, additionalProperties: { type: string } }
              resultMapping: { type: object, additionalProperties: { type: string } }
              timeoutSeconds: { type: integer }
              flow: { type: string }
        caseTarget:
          description: 'For a case type: the processes and alternate stages a case definition conversion needs mappings for (S117)'
          oneOf:
            - type: 'null'
            - type: object
              required: [processes, alternates]
              properties:
                processes:
                  type: array
                  items:
                    type: object
                    required: [taskId, stageId, stageLabel, flow, optional, alternate]
                    properties:
                      taskId: { type: string }
                      stageId: { type: string }
                      stageLabel: { type: string }
                      flow: { type: string }
                      rule: { type: [string, 'null'] }
                      optional: { type: boolean }
                      alternate: { type: boolean }
                alternates:
                  type: array
                  items: { type: object, required: [stageId, label], properties: { stageId: { type: string }, label: { type: string } } }
    PegaCaseDefinitionRequest:
      type: object
      additionalProperties: false
      required: [key, name, pegaStartRule]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        pegaStartRule: { type: string, description: Entry path of the case type }
        workflowMappings: { type: object, description: 'Process flow name to the key of the published workflow converted from it', additionalProperties: { type: string } }
        roleMappings: { type: object, description: 'Optional process flow name or alternate stage id to the workspace group that plans it or moves the case there', additionalProperties: { type: string } }
        dryRun: { type: boolean, default: false, description: Build and check the proposal without creating anything }
        acknowledgeInfo: { type: boolean }
        acknowledgeReview: { type: boolean }
    PegaCaseDefinitionResult:
      type: object
      required: [dryRun, key, name, sourceXml, sourceSha256, dataFields, workflowTasks, report]
      properties:
        dryRun: { type: boolean }
        key: { type: string }
        name: { type: string }
        sourceXml: { type: string, description: Generated CMMN 1.1 in the case designer subset }
        sourceSha256: { type: string }
        dataFields: { type: array, items: { $ref: '#/components/schemas/CaseDataField' } }
        workflowTasks: { type: array, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        report: { $ref: '#/components/schemas/CompatibilityReport' }
        definition: { oneOf: [{ $ref: '#/components/schemas/CaseDefinition' }, { type: 'null' }], description: The created case definition (absent for a dry run) }
    PegaRuleResult:
      type: object
      required: [rule, ruleType, className, ruleName, ruleset, version, availability, sourceSha256, resolution, conversion, targets, reasons, delegatedTo]
      properties:
        rule: { type: string }
        ruleType: { type: string }
        className: { type: string }
        ruleName: { type: string }
        ruleset: { type: string }
        version: { type: string }
        availability: { type: string }
        sourceSha256: { type: string }
        role: { type: [string, 'null'] }
        resolution: { type: string, description: 'selected, a shadowing outcome, or outsideContext' }
        conversion: { type: string, enum: [converted, review, blocked, notUsed, shadowed, supported] }
        targetKind: { type: [string, 'null'] }
        targets: { type: array, items: { type: string } }
        targetSha256: { type: [string, 'null'], description: SHA-256 of the mapping-independent target fragment }
        reasons: { type: array, items: { type: string } }
        circumstance: { type: [string, 'null'], description: 'The rule qualifier in words (for example .Category = Services)' }
        delegatedTo: { type: array, items: { type: string }, description: 'Access groups the rule is delegated to (provenance only)' }
    MigrationJob:
      type: object
      required: [id, fileName, status, report, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fileName: { type: string }
        status: { type: string, enum: [analyzed, converted, failed] }
        report: { $ref: '#/components/schemas/CompatibilityReport' }
        convertedWorkflowId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        sourceMap:
          type: [object, 'null']
          description: Original source identifiers or archive file dispositions mapped to target draft elements
          additionalProperties: true
    ConvertMigrationRequest:
      type: object
      additionalProperties: false
      required: [workflowKey, name]
      properties:
        workflowKey: { $ref: '#/components/schemas/Key' }
        name: { $ref: '#/components/schemas/Name' }
        groupMappings:
          type: object
          description: Camunda candidate group or assignee to workspace group key
          additionalProperties: { $ref: '#/components/schemas/Key' }
        approvalRoutes:
          type: object
          description: userTask id to the outgoing flows that mean approved and rejected
          additionalProperties:
            type: object
            additionalProperties: false
            required: [approvedFlowId, rejectedFlowId]
            properties:
              approvedFlowId: { type: string }
              rejectedFlowId: { type: string }
        serviceTaskMappings:
          type: object
          description: serviceTask id to a registered connection operation; overrides a serviceGroupMappings entry for that task
          additionalProperties: { $ref: '#/components/schemas/ServiceTaskMapping' }
        serviceGroupMappings:
          type: object
          description: 'Implementation key from requiredMappings.serviceGroups (for example topic:send-mail or class:com.example.AuditDelegate) to one mapping that covers every service task of that implementation'
          additionalProperties: { $ref: '#/components/schemas/ServiceTaskMapping' }
        decisionMappings:
          type: object
          description: 'Business rule task id to an uploaded DMN migration of this workspace; the task becomes a decision step with the converted table'
          additionalProperties:
            type: object
            additionalProperties: false
            required: [migrationId]
            properties:
              migrationId: { $ref: '#/components/schemas/Uuid' }
              decisionId: { type: string, minLength: 1, maxLength: 128, description: 'Decision of the DMN file; defaults to the id the task calls' }
              inputRef: { type: string, description: 'Field the table tests, /input/<field> or /steps/<node>/<output>; defaults to /input/<DMN input name>' }
        formMappings:
          type: object
          description: 'Start event or user task id (a linked form named in report.mappingHints.forms with state upload) to an uploaded camundaForm migration whose form id matches. A start form becomes the request form; a user task form becomes a note on the approval step.'
          additionalProperties:
            type: object
            additionalProperties: false
            required: [migrationId]
            properties:
              migrationId: { $ref: '#/components/schemas/Uuid' }
        decisionId: { type: string, minLength: 1, maxLength: 128, description: 'DMN migrations only: the decision to convert; optional when the file has exactly one decision' }
        pegaStartRule: { type: string, minLength: 1, maxLength: 500, description: 'Native Pega rule archives (pegaRules) only: the archive entry path of the starting point to convert (an effective case type or starting flow); optional when the archive has exactly one. For these archives only workflowKey, name, groupMappings, approvalRoutes, childWorkflowMappings, connectionMappings, the acknowledgements and pegaStartRule are accepted.' }
        connectionMappings:
          type: object
          description: 'Native Pega rule archives only (S117): call step id to the workspace connection operation it runs; request and result mappings come from the connector'
          additionalProperties:
            type: object
            additionalProperties: false
            required: [connectionRef, operation]
            properties:
              connectionRef: { $ref: '#/components/schemas/Key' }
              operation: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
              definitionVersion: { type: integer, minimum: 1 }
              timeoutSeconds: { type: integer, minimum: 1, maximum: 30 }
        transcriptionSha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Pega Blueprint PDF migrations only (required there): the transcriptionSha256 of the reviewed transcription revision being converted. Routes, request fields and steps come from that transcription, so approvalRoutes, inputSchema and other mappings except groupMappings are refused.' }
        inputSchema:
          type: object
          description: Reviewed canonical request schema; otherwise inferred from BPMN comparisons and service input mappings
          additionalProperties: true
        childWorkflowMappings:
          type: object
          description: callActivity id to a published workflow in the same workspace; publication pins its release
          additionalProperties:
            type: object
            additionalProperties: false
            required: [workflowRef, inputMapping, resultMapping]
            properties:
              workflowRef: { $ref: '#/components/schemas/Key' }
              inputMapping: { type: object, additionalProperties: { type: string } }
              resultMapping: { type: object, additionalProperties: { type: string } }
              forEach:
                type: object
                description: 'Required for a multi-instance call activity over a plain collection. The source collection has no bound, so the designer sets one (1 to 25). Mode follows the source (isSequential).'
                additionalProperties: false
                required: [itemInput, maxItems]
                properties:
                  itemInput: { type: string, description: 'Request field of the child that receives each item' }
                  maxItems: { type: integer, minimum: 1, maximum: 25 }
                  itemType: { type: string, enum: [string, integer, number, boolean], description: 'Item type of the generated collection field; not needed with an explicit inputSchema' }
              collectionMapping: { type: object, additionalProperties: { type: string }, description: 'Collected output name to a guaranteed child result (only with forEach)' }
        acknowledgeInfo: { type: boolean, default: false, description: 'Accept info-level losses such as dropped listeners' }
        acknowledgeReview: { type: boolean, default: false, description: 'Mark review items as acknowledged in the report. Review items never block conversion, with or without it.' }
