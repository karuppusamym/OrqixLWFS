        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/test-suite:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getWorkflowTestSuite
      summary: Read designer-only shared test samples
      x-orqix-permission: workflow.edit
      responses:
        '200':
          description: Shared suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestSuite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [Workflows]
      operationId: saveWorkflowTestSuite
      summary: Save an immutable shared test suite revision
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.tests.saved
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWorkflowTestSuite' }
      responses:
        '200':
          description: Shared suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestSuite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/test-suite/run:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: runWorkflowTestSuite
      summary: Test the exact draft and current shared suite; retain count-only pass/fail results
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.tests.run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunWorkflowTestSuite' }
      responses:
        '200':
          description: Test report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/simulate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: simulateWorkflow
      summary: Test this workflow - a dry run of a draft revision or the active release with a sample request and a scenario (no side effects)
      description: >
        Walks the canonical definition with the same form validation, decision evaluation and condition semantics as
        production (S4 section 13). It is not the engine: nothing is started, called or stored, connections are not
        contacted and no time passes. 422 VALIDATION_FAILED for a sample request that does not fit the request form
        (field errors under /input), 422 WORKFLOW_INVALID with issues when the workflow has blocking problems,
        422 NO_ACTIVE_RELEASE for useActiveRelease on an unpublished workflow, 429 after 30 runs a minute.
      x-orqix-permission: workflow.read
      x-orqix-audit: workflow.simulated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateRequest' }
      responses:
        '200':
          description: The trace of the dry run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Releases]
      operationId: publishDraft
      summary: Revalidate an exact draft revision, deploy it and create an immutable release
      x-orqix-permission: workflow.publish
      x-orqix-audit: workflow.published
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: Idempotent replay of an earlier publish
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Releases]
      operationId: listReleases
      x-orqix-permission: workflow.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Releases, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReleaseSummary' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [Releases]
      operationId: getRelease
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Immutable release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [Releases]
      operationId: exportRelease
      summary: Secret-free bundle (canonical JSON, BPMN, DMN, manifest, source map)
      x-orqix-permission: workflow.export
      x-orqix-audit: workflow.exported
      responses:
        '200':
          description: ZIP bundle
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/active-release:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Releases]
      operationId: setActiveRelease
      summary: Select the release used for new starts (rollback = select an older release)
      description: Existing runs are never moved. The release must belong to this workflow.
      x-orqix-permission: workflow.publish
      x-orqix-audit: workflow.active-release.changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [releaseId, expectedVersion]
              properties:
                releaseId: { $ref: '#/components/schemas/Uuid' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/workflows/{workflowId}/start-form:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Runs]
      operationId: getStartForm
      summary: Request form of the active release
      x-orqix-permission: workflow.start
      responses:
        '200':
          description: Start form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartForm' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/messages:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Runs]
      operationId: sendMessage
      summary: Tell waiting requests that something happened (a named message with a correlation key)
      description: |
        Delivers the message to every active request waiting at a "Wait for a message" step with the same message
        name and correlation key (at most 25). When none waits, the message is kept for a bounded time (24 hours by
        default) and given to the first wait that starts with that name and key; after that it is dropped. Never
        buffered beyond the limits (429). The payload is a flat object of scalar values (at most 16 KiB) and must match
        the values the waiting step declares (422). Machine clients with a bearer token may call it.
      x-orqix-permission: message.send
      x-orqix-audit: message.received
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Accepted (delivered to waiting requests or buffered); an idempotent replay returns the same status with the header Idempotent-Replayed true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/runs:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Runs]
      operationId: listRuns
      summary: Runs in the workspace (operator/viewer view)
      x-orqix-permission: run.read
      parameters:
        - name: workflowId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/Lifecycle' }
        - name: outcomeKind
          in: query
          schema: { $ref: '#/components/schemas/OutcomeKind' }
        - name: businessKey
          in: query
          description: Exact business key or generated request reference (for example ORQ-1003).
          schema: { type: string, maxLength: 100 }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - name: overdue
          in: query
          description: true lists only runs with a stage that is past its due time (docs/build/S17).
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of runs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Runs]
      operationId: startRun
      summary: Start a run of the workflow's active release
      description: |
        Validates input against the active release's input schema (BigDecimal numerics), derives the initiator
        from the authenticated principal, and commits the run, the engine instance and the idempotency record
        in one transaction. 201 means durably accepted. Runs continue asynchronously after the first wait state.
      x-orqix-permission: workflow.start
      x-orqix-audit: run.started
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '201':
          description: Accepted and committed
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      description: Readable by run.read holders, the initiator, and subjects who hold or held a task in the run.
      x-orqix-permission: run.read | initiator | taskParticipant
      responses:
        '200':
          description: Run detail; sections are omitted when the caller lacks the needed permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/comments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: listRunComments
      summary: Read immutable comments with request-data authorization
      x-orqix-permission: run.read-data | initiator | taskParticipant
      parameters:
        - name: before
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Newest 50 comments; pass the last comment ID as before for older comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCommentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Runs]
      operationId: createRunComment
      summary: Add an immutable plain-text collaboration note
      x-orqix-permission: run.operate | initiator | taskParticipant
      x-orqix-audit: comment.created
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunComment' }
        '200':
          description: Idempotent replay of the original comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/attachment-uploads:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload a file for a request form that is not started yet
      description: |
        Multipart upload of one `file` part (docs/build/S17). The file is checked (allowed type, content signature,
        size) and kept for `expiresAt`; the request form then refers to it by `id` in a field of `format: attachment`
        and starting the request attaches it. Files that are never attached are deleted after the expiry.
      x-orqix-permission: workflow.start
      x-orqix-audit: attachment.added
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: base64, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagedUpload' }
        '201':
          description: File accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagedUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/attachment-uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: uploadId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Attachments]
      operationId: discardAttachmentUpload
      summary: Remove a file chosen on a request form (own files that are not attached to a request)
      x-orqix-permission: workspace.member
      x-orqix-audit: attachment.removed
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/attachments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Attachments]
      operationId: listRunAttachments
      summary: Files of a request, including removed ones (metadata only), with the limits and what the caller may do
      description: Visible like the request data (initiator, task participants, run.read-data holders).
      x-orqix-permission: run.read-data | initiator | taskParticipant
      responses:
        '200':
          description: Files in the order they were added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      operationId: addRunAttachment
      summary: Add a file to a request in progress
      description: |
        Multipart upload: one `file` part and an optional `description` (at most 200 characters). Allowed types: PDF,
        PNG, JPEG, text, CSV, docx, xlsx, pptx (checked by name, declared type and content). At most 10 MiB per file,
        25 files and 50 MiB per request (configurable).
      x-orqix-permission: run.operate | initiator | taskParticipant
      x-orqix-audit: attachment.added
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: base64, contentMediaType: application/octet-stream }
                description: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '201':
          description: File added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      tags: [Attachments]
      operationId: removeRunAttachment
      summary: Remove a file (soft delete - the metadata stays on the request, the bytes are deleted)
      description: The initiator while the request is in progress, and holders of run.operate at any time. Removing a removed file succeeds.
      x-orqix-permission: run.operate | initiator
      x-orqix-audit: attachment.removed
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/content:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: downloadRunAttachment
      summary: Download a file
      description: |
        Always `Content-Type: application/octet-stream` with `Content-Disposition: attachment`,
        `X-Content-Type-Options: nosniff` and `Content-Security-Policy: sandbox`; a browser never renders the file.
        Files blocked by the virus scan answer 409 ATTACHMENT_BLOCKED.
      x-orqix-permission: run.read-data | initiator | taskParticipant
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Content-Security-Policy:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/quarantine:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      tags: [Attachments]
      operationId: quarantineAttachment
      summary: Quarantine a file - download and text extraction are refused while the bytes are kept for review
      description: Needs run.operate. Quarantining a quarantined file succeeds without change. Quarantined files are never removed by retention.
      x-orqix-permission: run.operate
      x-orqix-audit: attachment.quarantined
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuarantineAttachment' }
      responses:
        '204': { description: Quarantined }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/release:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      tags: [Attachments]
      operationId: releaseAttachment
      summary: Release a quarantined file so it can be downloaded again (a file blocked by the virus scan stays blocked)
      x-orqix-permission: run.operate
      x-orqix-audit: attachment.released
      responses:
        '204': { description: Released }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/ocr:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: getAttachmentOcr
      summary: The stored text extraction of a file (404 until one was requested)
      description: Visible like the request data. The text is deleted with the file and when the file is quarantined.
      x-orqix-permission: run.read-data | initiator | taskParticipant
      responses:
        '200':
          description: The extraction result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentOcr' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Attachments]
      operationId: requestAttachmentOcr
      summary: Extract text from a file with the configured OCR provider
      description: |
        Needs run.operate and request-data visibility. The shipped provider is a local stub that reads text and CSV
        files and reports every other type as `unsupported`; no external OCR service is called. Quarantined, blocked
        and removed files are refused. A new request replaces the earlier result.
      x-orqix-permission: run.operate
      x-orqix-audit: attachment.ocr.requested
      responses:
        '200':
          description: The extraction result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentOcr' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/attachment-retention:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Attachments]
      operationId: getAttachmentRetention
      summary: The workspace file retention setting and how many files the next sweep would remove
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: The setting (retentionDays null means files are kept until removed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentRetention' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Attachments]
      operationId: setAttachmentRetention
      summary: Set (1 to 3650 days) or clear the number of days after a request ends that its files are kept
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: attachment.retention.updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAttachmentRetention' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentRetention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: listRunEvents
      summary: Ordered, commit-safe run timeline for polling
      x-orqix-permission: run.read | initiator | taskParticipant
      parameters:
        - name: after
          in: query
          description: Return events with seq greater than this value.
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/path:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunPath
      summary: Where the request is - the workflow diagram with the path taken and the current steps
      description: |
        Everything the "Where is my request" diagram needs in one cheap read: the pinned release's graph (step labels,
        kinds, routes, saved layout positions; never conditions, field names or request data), the steps the request
        has passed (derived from the run events and the release graph; silent steps such as choices and parallel
        splits are inferred), which routes were taken, and the steps it is at now with their status. Same access rule
        as the run events.
      x-orqix-permission: run.read | initiator | taskParticipant
      responses:
        '200':
          description: The path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPath' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/insights/summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Insights]
      operationId: getInsightsSummary
      summary: Workflow analytics - counts, cycle times, oldest open requests, attention list and SLA view
      description: |
        Aggregates over the runs started in the date range (cards, cycle time per workflow) plus the current state of
        the workspace (oldest open, needing attention, overdue). Never contains request titles or input data; requests
        are identified by their reference only. The query has a time limit; 503 DEPENDENCY_UNAVAILABLE when exceeded.
      x-orqix-permission: run.read
      parameters:
        - $ref: '#/components/parameters/InsightsFrom'
        - $ref: '#/components/parameters/InsightsTo'
        - $ref: '#/components/parameters/InsightsWorkflowId'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/insights/throughput:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Insights]
      operationId: getInsightsThroughput
      summary: Requests started and completed per day (UTC), zero-filled
      x-orqix-permission: run.read
      parameters:
        - $ref: '#/components/parameters/InsightsFrom'
        - $ref: '#/components/parameters/InsightsTo'
        - $ref: '#/components/parameters/InsightsWorkflowId'
      responses:
        '200':
          description: One entry per day in the range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsThroughput' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/insights/steps:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Insights]
      operationId: getInsightsSteps
      summary: Bottlenecks - time waiting at each approval and wait step
      description: Steps started in the range, slowest average first. Capped at 200 rows (`truncated`).
      x-orqix-permission: run.read
      parameters:
        - $ref: '#/components/parameters/InsightsFrom'
        - $ref: '#/components/parameters/InsightsTo'
        - $ref: '#/components/parameters/InsightsWorkflowId'
      responses:
        '200':
          description: Per-step waiting time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsSteps' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Stop future progression; completed external effects are reported, not reversed
      x-orqix-permission: run.operate
      x-orqix-audit: run.cancelled
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRunRequest' }
      responses:
        '200':
          description: Cancelled (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/suspend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: suspendRun
      summary: Pause an active request without ending it
      description: >-
        Freezes the request's tasks, timers and jobs. Refused with 409 RUN_NOT_SUSPENDABLE for requests that need
        attention, child requests and requests with running child requests. Messages sent meanwhile are buffered.
      x-orqix-permission: run.operate
      x-orqix-audit: run.suspended
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRunRequest' }
      responses:
        '200':
          description: Suspended (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/diagnosis:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunDiagnosis
      summary: Compare what the request shows with what the engine holds
      description: >-
        Read-only. Reports inSync, projectionDrift (open approvals the engine holds are missing from the request; repairable),
        strandedToken (the engine has a token that nothing can move; cancel only), emptyRequest, engineMissing,
        unsupported, protected (suspended) or ended.
      x-orqix-permission: run.operate
      responses:
        '200':
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDiagnosis' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/repair:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: repairRun
      summary: Rebuild the open approval steps of a request from the engine
      description: >-
        Only for projectionDrift on a running or waiting request that is not suspended. The decision is re-made under
        the request lock; the engine is never triggered, skipped or modified. Refused with 409 RUN_NOT_REPAIRABLE
        otherwise, including stranded tokens, which can only be cancelled.
      x-orqix-permission: run.operate
      x-orqix-audit: run.projection-repaired
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepairRunRequest' }
      responses:
        '200':
          description: Repaired (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/resume:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: resumeRun
      summary: Continue a suspended request
      description: Timers that fell due while the request was suspended fire after it resumes.
      x-orqix-permission: run.operate
      x-orqix-audit: run.resumed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeRunRequest' }
      responses:
        '200':
          description: Resumed (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/migration-options:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunMigrationOptions
      summary: Releases this request could move to, with the reasons it cannot move to the others
      description: >-
        Newest first, at most 20, excluding the release the request follows. `ready` is false until the request is
        suspended; the options are still listed so an operator can see what would be possible.
      x-orqix-permission: run.operate
      responses:
        '200':
          description: Migration options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationOptions' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/migrate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: migrateRun
      summary: Move a suspended request to another release of its workflow
      description: >-
        Only while the request is suspended, and only when the part of the workflow already travelled and the step it
        waits at are identical in the target release. Refused with 409 RUN_NOT_MIGRATABLE and a `findings` list
        otherwise. The request stays suspended; resume it afterwards.
      x-orqix-permission: run.operate
      x-orqix-audit: run.migrated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrateRunRequest' }
      responses:
        '200':
          description: Migrated (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/external-jobs/fetch-and-lock:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [ExternalJobs]
      operationId: fetchExternalJobs
      summary: Lease available jobs of the topics a worker serves
      description: >-
        Returns up to `maxJobs` jobs and leases each to `workerId` for at most the step's lease time. Each lease has a
        `fence` that grows with every lock; present it on every later call. Jobs of suspended or ended requests are not
        offered. High-volume protocol call: not audited individually.
      x-orqix-permission: job.work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobFetchRequest' }
      responses:
        '200':
          description: Leased jobs (possibly none)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalJobBatch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/extend-lock:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: extendExternalJobLock
      summary: Keep a lease while the work continues
      description: >-
        409 JOB_LEASE_LOST when the fence or worker no longer matches. High-volume protocol call, so it is not audited
        individually.
      x-orqix-permission: job.work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobExtendRequest' }
      responses:
        '200':
          description: New lease end
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalJobExtendResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: completeExternalJob
      summary: Report the result of a leased job
      description: >-
        The result must be exactly the fields the step declares, with their types (422 otherwise). The request then
        continues. 409 JOB_LEASE_LOST when the lease or fence is no longer the caller's; 409 JOB_NOT_OPEN when the job or
        request has ended; 409 RUN_SUSPENDED while the request is suspended.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.completed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobCompleteRequest' }
      responses:
        '204': { description: Completed (or replay) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/fail:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: failExternalJob
      summary: Report that a leased job could not be done
      description: >-
        A retryable failure returns the job to the queue after `retryAfterSeconds` (default: the workflow's retry delay)
        until the attempt limit; otherwise the request needs attention and an operator decides.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.failed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobFailRequest' }
      responses:
        '204': { description: Recorded (or replay) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: retryRun
      summary: Resume a run that needs attention when policy says retry is safe
      description: Refused with 409 EFFECT_NOT_RECONCILED while the effect outcome is unknown.
      x-orqix-permission: run.operate
      x-orqix-audit: run.retry-requested
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryRunRequest' }
      responses:
        '200':
          description: Retry scheduled (run returns to running)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/effects/{effectId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/EffectId'
    post:
      tags: [Runs]
      operationId: reconcileEffect
      summary: Record operator-verified outcome of an unknown or failed external effect
      description: |
        confirmedApplied requires the mapped result fields (validated against the operation response types) and
        resumes the run without calling the remote system again. confirmedNotApplied makes the effect eligible
        for POST /retry. Evidence is mandatory and audited.
      x-orqix-permission: run.operate
      x-orqix-audit: effect.reconciled
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileEffectRequest' }
      responses:
        '200':
          description: Effect after reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Effect' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/me/requests:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Runs]
      operationId: listMyRequests
      summary: Runs started by the caller (server forces initiator = caller)
      x-orqix-permission: workspace.member
      parameters:
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/Lifecycle' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of the caller's runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/me/notifications:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      x-orqix-permission: workspace.member
      parameters:
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's in-app notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
                  unreadCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Idempotently mark the caller's own notification read
      x-orqix-permission: recipient
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Tasks]
      operationId: listTasks
      x-orqix-permission: task.act
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [assigned, claimable, completed]
          description: |
            assigned = open tasks claimed by the caller; claimable = open unclaimed tasks whose candidate group
            contains the caller, excluding the caller's own requests unless self-approval is allowed;
            completed = tasks the caller decided.
        - name: sort
          in: query
          description: Open queue order; priority sorts descending then oldest first. Completed tasks retain decision order.
          schema: { type: string, enum: [priority, oldest, newest], default: priority }
        - name: minPriority
          in: query
          description: Optional open-task priority threshold; unsupported for completed tasks.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, counts]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
                  counts:
                    type: object
                    required: [assigned, claimable]
                    properties:
                      assigned: { type: integer, minimum: 0 }
                      claimable: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      description: Visible to eligible candidates, the assignee, past deciders, and run.read holders.
      x-orqix-permission: taskEligible | run.read
      responses:
        '200':
          description: Task with request context and the caller's allowed actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks/{taskId}/claim:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: claimTask
      x-orqix-permission: task.act + candidate
      x-orqix-audit: task.claimed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedCommand' }
      responses:
        '200':
          description: Claimed by the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/tasks/{taskId}/correct-input:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: correctTaskInput
      summary: Correct request fields the workflow lets the task holder correct
      description: >-
        Only the fields listed in the step's `correctable` setting, as single values, while the task is open and the
        request is not suspended. Records before and after values with the reason. A decision prepared on the old data
        is refused with 409 TASK_VERSION_CONFLICT.
      x-orqix-permission: task.act + assignee | run.operate + run.read-data
      x-orqix-audit: task.input-corrected
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectTaskInputRequest' }
      responses:
        '200':
          description: Corrected (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/release:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: releaseTask
      summary: Return a claimed task to its group
      x-orqix-permission: assignee
      x-orqix-audit: task.released
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedCommand' }
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/tasks/{taskId}/decision:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: decideTask
      summary: Approve or reject; exactly one decision per task wins
      x-orqix-permission: assignee + task.act
      x-orqix-audit: task.decided
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDecision' }
        '201':
          description: Decision recorded and the run continued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/priority:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      operationId: setTaskPriority
      summary: Current assignee or operator changes open task priority with a reason
      x-orqix-permission: currentAssignee + task.act | run.operate
      x-orqix-audit: task.priority-changed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPriorityRequest' }
      responses:
        '200':
          description: Priority changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/reassign:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: reassignTask
      summary: Operator reassignment to an eligible subject or back to the group
      x-orqix-permission: run.operate
      x-orqix-audit: task.reassigned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Reassigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/delegates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskDelegates
      summary: Eligible known colleagues for the caller's assigned task
      x-orqix-permission: task.act & currentAssignee
      responses:
        '200':
          description: Up to 100 eligible known colleagues from a bounded directory scan
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SubjectRef' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks/{taskId}/delegate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: delegateTask
      summary: Current assignee delegates to an eligible colleague with a reason
      x-orqix-permission: task.act & currentAssignee
      x-orqix-audit: task.delegated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Task delegated; expectedVersion prevents repeated assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/connections/import-openapi:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Connections]
      operationId: reviewOpenApiConnection
      summary: Review a local OpenAPI file and explicitly choose operations and retry behavior
      description: No remote references or servers are fetched. Returns a candidate definition; registration and workspace binding use the existing separate APIs. Source is limited to 2 MiB UTF-8, with a 4 MiB encoded request limit.
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.openapi-reviewed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenApiReviewRequest' }
      responses:
        '200':
          description: Bounded review report and an optional candidate definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenApiReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/adapters:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listAdapters
      summary: Outbound adapter definitions (email, Teams, JDBC read, Kafka produce); never secrets
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Adapters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Adapters]
      operationId: createAdapter
      summary: Define an adapter with exact allowlists and a secret reference
      description: Closed configuration per kind; unknown fields (including anything resembling a secret) are refused. Teams base URLs pass the egress policy. Only the local stub transport exists in this build.
      x-orqix-permission: connection.manage
      x-orqix-audit: adapter.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adapter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/adapters/{adapterKey}/test-send:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: adapterKey
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
    post:
      tags: [Adapters]
      operationId: testAdapterSend
      summary: Validate a request against the adapter rules and deliver it to the local stub only
      description: No remote system is contacted; the outcome is always stubbed. Live acceptance is an external gate.
      x-orqix-permission: connection.manage
      x-orqix-audit: adapter.test-sent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterSendRequest' }
      responses:
        '200':
          description: Stub outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterSendResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/inbound-triggers:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listInboundTriggers
      summary: Inbound triggers; the secret reference and receive path are shown to managers only
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Triggers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTriggerList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Adapters]
      operationId: createInboundTrigger
      summary: Define a signed inbound trigger that maps payload values into a workflow's start input
      description: A received event never starts a run by itself; a person with workflow.start starts it.
      x-orqix-permission: connection.manage
      x-orqix-audit: inbound.trigger-created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundTriggerCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTrigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/inbound/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: triggerId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Adapters]
      operationId: receiveInboundEvent
      summary: Receive one signed event (no session or token)
      description: |
        Authenticated by `X-Orqix-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + "." + rawBody)>` with
        `X-Orqix-Timestamp` (epoch seconds, within 5 minutes) and a unique `X-Orqix-Event-Id` per trigger. Bodies are
        limited to 64 KiB. Only mapped scalar values are stored; a repeated event id is acknowledged as a duplicate.
      x-orqix-permission: inboundSignature
      x-orqix-audit: inbound.received
      parameters:
        - { name: X-Orqix-Event-Id, in: header, required: true, schema: { type: string, maxLength: 100 } }
        - { name: X-Orqix-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Orqix-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Accepted (or acknowledged duplicate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/inbound-events:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listInboundEvents
      summary: Received events for workflows the caller may start, newest first
      description: Mapped values are request data, so only people who can start the target workflow see the event.
      x-orqix-permission: workflow.start
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundEventList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/inbound-events/{eventId}/start:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Adapters]
      operationId: startInboundEvent
      summary: Start a run from a received event as the signed-in person
      description: Uses the caller's own workflow.start rights. The event is locked, so it starts at most one run; a repeat returns that run.
      x-orqix-permission: workflow.start
      x-orqix-audit: inbound.event-started
      responses:
        '200':
          description: Started (or already started)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundStarted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/connections:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Connections]
      operationId: listConnections
      summary: Connection metadata and operation contracts (never secrets)
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConnectionSummary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/connections/{connectionKey}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    get:
      tags: [Connections]
      operationId: getConnection
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Connection definitions and binding (binding visible to connection.manage only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/connections/{connectionKey}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: registerConnectionVersion
      summary: Register a new immutable connection definition version
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.version.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition]
              properties:
                definition: { $ref: './connection-definition-v0.schema.json' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDefinitionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/connections/{connectionKey}/binding:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    put:
      tags: [Connections]
      operationId: putConnectionBinding
      summary: Set this environment's endpoint and credential reference
      description: |
        The base URL host must be on the platform egress allowlist (S6). secretRef names a mounted secret; the
        secret value is never accepted or returned by the API. Creating the first binding needs no If-Match;
        replacing an existing binding requires If-Match with its ETag (428 if missing, 412 if stale).
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.binding.updated
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutConnectionBindingRequest' }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionBinding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /workspaces/{workspaceId}/connections/{connectionKey}/test:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Invoke a testable (readOnly) operation through the real binding and egress policy
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.tested
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, operation]
              properties:
                version: { type: integer, minimum: 1 }
                operation: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
                input:
                  type: object
                  description: Sample input for agent or Microsoft Graph operations, validated against the operation requestSchema.
      responses:
        '200':
          description: Test outcome (a failed remote call is a 200 with outcome=failed). An agent test uses AI and is metered like any AI use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/access:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Access]
      operationId: getAccessOverview
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: Role bindings, permission grants and groups of the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessOverview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/access/role-bindings:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Access]
      operationId: createRoleBinding
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.role-binding.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, principal]
              properties:
                role: { $ref: '#/components/schemas/WorkspaceRole' }
                principal: { $ref: '#/components/schemas/PrincipalRef' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/access/role-bindings/{bindingId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: bindingId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Access]
      operationId: deleteRoleBinding
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.role-binding.deleted
      responses:
        '204': { description: Deleted; cached permissions expire within 60 seconds on other pods }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/access/grants:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Access]
      operationId: createPermissionGrant
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.grant.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permission, principal]
              properties:
                permission: { type: string, enum: [workflow.start, connection.manage, message.send, document.browse, job.work] }
                workflowId:
                  description: Restrict workflow.start to one workflow; omit for workspace-wide (connection.manage, message.send, document.browse and job.work are always workspace-wide).
                  oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
                principal: { $ref: '#/components/schemas/PrincipalRef' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionGrant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/access/grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: grantId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Access]
      operationId: deletePermissionGrant
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.grant.deleted
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/groups:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Access]
      operationId: listGroups
      summary: Task-assignment groups (keys and names) for the approval step picker
      description: Members are included only for workspace.manage-access holders.
      x-orqix-permission: workflow.read | workspace.manage-access
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/groups/{groupKey}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: groupKey
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Key' }
    put:
      tags: [Access]
      operationId: putGroup
      summary: Create or replace a task-assignment group and its members
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.group.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, members]
              properties:
                name: { $ref: '#/components/schemas/Name' }
                members: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/PrincipalRef' } }
                expectedRevision:
                  description: Required when the group exists.
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/ai/status:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [AI]
      operationId: getAiStatus
      summary: Whether AI assistance is available here, with model profiles and budget (S10)
      x-orqix-permission: workflow.read | workflow.edit | workspace.manage-access
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/ai/drafts:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [AI]
      operationId: generateAiDraft
      summary: Start generating a workflow draft from a description (async; never publishes)
      description: |
        Checks and authorizes synchronously (400, 403, 404, 422 AI_NOT_CONFIGURED or AI_MODEL_NOT_ALLOWED, 429 budget or
        rate limit), then accepts the generation as a job and answers 202 with a Location to poll
        (getAiGeneration). An identical request with the same Idempotency-Key returns the same job (200). The outcome of
        the generation (the draft, or why it failed) is on the job.
      x-orqix-permission: workflow.edit
      x-orqix-audit: ai.draft.generated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiDraftRequest' }
      responses:
        '200':
          description: Idempotent replay; the job as it is now
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerationJob' }
        '202':
          description: Accepted; poll the job at Location
          headers:
            Location: { description: 'URL of the job (getAiGeneration)', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/ai/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/GenerationId'
    get:
      tags: [AI]
      operationId: getAiGeneration
      summary: Poll an AI draft generation (state is shared by all instances)
      description: |
        You always see your own generations; other people's generations are visible only to holders of workflow.edit
        in the workspace (anyone else gets 404). A generation whose instance died is failed once its deadline has passed.
        Poll every 2 seconds; a generation ends in succeeded (with result) or failed (with problem).
      x-orqix-permission: workflow.read | workflow.edit
      responses:
        '200':
          description: The generation as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerationJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/explain:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [AI]
      operationId: explainWorkflow
      summary: Explain a draft revision or release in plain business language
      x-orqix-permission: workflow.read
      x-orqix-audit: ai.workflow.explained
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision: { type: integer, minimum: 1, description: 'Draft revision; omit to explain the active release' }
                profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowExplanation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/migrations:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Migration]
      operationId: uploadMigration
      summary: Analyze Camunda BPMN, a Pega archive, or a Pega manual mapping package
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.uploaded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileName, content]
              properties:
                fileName: { type: string, minLength: 1, maxLength: 200 }
                content: { type: string, minLength: 1, maxLength: 1398104, description: 'BPMN or DMN XML, or mapping JSON text; base64 for Pega archives. Decoded sources are limited to 1 MiB.' }
                sourceFormat: { type: string, enum: [bpmn, dmn, camundaForm, pegaArchive, pegaMapping], default: bpmn, description: 'bpmn is Camunda 7/8 BPMN 2.0; dmn is a Camunda DMN 1.1-1.4 file with decision tables; camundaForm is a Camunda Forms .form JSON file that is attached to a BPMN import through formMappings.' }
      responses:
        '201':
          description: Job created with its compatibility report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/migrations/{migrationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [Migration]
      operationId: getMigration
      summary: A migration job and its compatibility report
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Migration job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/migrations/{migrationId}/convert:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [Migration]
      operationId: convertMigration
      summary: Apply designer mappings and create a workflow draft
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.converted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertMigrationRequest' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                required: [workflow, draft, report]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
                  draft: { $ref: '#/components/schemas/WorkflowDraft' }
                  report: { $ref: '#/components/schemas/CompatibilityReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/document-sources:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
      - Connections
      operationId: listDocumentSources
      x-orqix-permission: document.browse
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DocumentSource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/document-sources/grants:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
      - Connections
      operationId: listDocumentSourceGrants
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DocumentSourceGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/document-sources/grants/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Connections
      operationId: putDocumentSourceGrant
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: document.source.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutDocumentSourceGrant'
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSourceGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Invalid input or stale resource revision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Invalid input or stale resource revision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /workspaces/{workspaceId}/document-sources/{sourceId}/files:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Connections
      operationId: listDocumentSourceFiles
      x-orqix-permission: document.browse
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSourceFiles'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Approved source is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /workspaces/{workspaceId}/document-sources/{sourceId}/files/{itemId}/versions:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9!._~-]+$
    get:
      tags:
      - Connections
      operationId: listDocumentSourceFileVersions
      x-orqix-permission: document.browse
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSourceVersions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Approved source is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ORQIX_SESSION
      description: Server-side session created by OIDC authorization-code login (/oauth2/authorization/orqix).
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Machine clients (R0 scope - startRun, getRun, listRunEvents only). Issuer and audience validated.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GenerationId:
      name: generationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    EffectId:
      name: effectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Engine task identifier; always resolved through the workspace's task projection first.
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
    ConnectionKey:
      name: connectionKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Key' }
    DecisionKey:
      name: decisionKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Key' }
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    InsightsFrom:
      name: from
      in: query
      description: First day of the range (UTC date, inclusive). Default 29 days before `to`.
      schema: { type: string, format: date }
    InsightsTo:
      name: to
      in: query
      description: Last day of the range (UTC date, inclusive). Default today. The range may not exceed 365 days.
      schema: { type: string, format: date }
    InsightsWorkflowId:
      name: workflowId
      in: query
      description: Limit the figures to one workflow of the workspace (404 when it is not in the workspace).
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated, unique per logical command (UUID recommended). Retained 30 days.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the revision being replaced.
      schema: { type: string }

  headers:
    ETag:
      description: Strong entity tag of the returned revision, e.g. "r12".
      schema: { type: string }
    IdempotentReplayed:
      description: Present with value true when the response replays an earlier identical command.
      schema: { type: boolean }
    RetryAfter:
      description: Seconds before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Malformed request or missing Idempotency-Key
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: No valid session or token
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: The caller can see the resource but may not perform this action
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Version, idempotency or state conflict; currentVersion/currentState may be included
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: Stale If-Match; currentRevision included
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: If-Match header missing
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: Body exceeds the documented limit
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Semantic validation failure (fieldErrors or issues included)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Quota or rate limit
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: A required dependency (database, engine) is unavailable; nothing was committed
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    CorrectRunInputRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, changes]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        changes:
          type: object
          minProperties: 1
          maxProperties: 30
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
    RunInputCorrection:
      type: object
      additionalProperties: false
      required: [runId, version, fields, replayed]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        fields: { type: integer, minimum: 1, maximum: 30 }
        replayed: { type: boolean }
    MigrationPolicy:
      type: object
      additionalProperties: false
      required:
      - required
      - version
      - reason
      - updatedAt
      properties:
        required:
          type: boolean
        version: &id001
          type: integer
          minimum: 0
        reason: &id003
          type:
          - string
          - 'null'
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    MigrationPolicyRequest:
      type: object
      additionalProperties: false
      required:
      - required
      - expectedVersion
      - reason
      properties:
        required:
          type: boolean
        expectedVersion: *id001
        reason: &id002
          type: string
          minLength: 1
          maxLength: 1000
    MigrationReviewRequest:
      type: object
      additionalProperties: false
      required:
      - draftRevision
      - expectedVersion
      - reason
      properties:
        draftRevision:
          type: integer
          minimum: 1
        expectedVersion: *id001
        reason: *id002
    MigrationReview:
      type: object
      additionalProperties: false
      required:
      - migration
      - required
      - draftRevision
      - definitionHash
      - sourceHash
      - mappingsHash
      - mapper
      - reviewedBy
      - reviewedAt
      - reviewReason
      - reviewVersion
      - approved
      - canApprove
      - detail
      properties:
        migration:
          type: boolean
        required:
          type: boolean
        draftRevision:
          type: integer
        definitionHash: &id004
          type: string
        sourceHash: *id003
        mappingsHash: *id003
        mapper:
          oneOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        reviewedBy:
          oneOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        reviewReason: *id003
        reviewVersion: *id001
        approved:
          type: boolean
        canApprove:
          type: boolean
        detail: *id004
    UploadMigrationProjectRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
            - fileName
            - content
            properties:
              fileName:
                type: string
                minLength: 1
                maxLength: 200
              content:
                type: string
                minLength: 1
                maxLength: 1048576
              sourceFormat:
                type: string
                description: 'Optional format hint. BPMN and single-decision DMN files are supported; form files produce a project blocker. XML roots determine the format when omitted.'
                enum:
                - bpmn
                - dmn
                - form
    MigrationProject:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - files
      - conversionOrder
      - issues
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name: *id004
        status:
          type: string
          enum:
          - analyzed
          - blocked
          - converting
          - converted
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - fileName
            - migrationId
            - processId
            - dependencies
            - status
            - convertedWorkflowId
            properties:
              fileName: *id004
              migrationId:
                oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
              processId: *id003
              sourceFormat:
                description: 'Detected XML source kind; null for an unsupported or unreadable source. Omitted on older stored projects.'
                type: [string, 'null']
                enum: [bpmn, dmn, null]
              decisionIds:
                description: 'DMN decision identifiers declared by this file. Omitted on older stored projects.'
                type: array
                items: *id004
              decisionDependencies:
                description: 'BPMN business-rule task IDs mapped to referenced DMN decision IDs. Omitted on older stored projects.'
                type: object
                additionalProperties:
                  type: string
              dependencies:
                type: array
                items: *id004
              status:
                type: string
                enum:
                - analyzed
                - converted
                - failed
                - blocked
              convertedWorkflowId:
                oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
        conversionOrder:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - fileName
            - code
            - detail
            properties:
              fileName: *id004
              code: *id004
              detail: *id004
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ConvertMigrationProjectRequest:
      type: object
      additionalProperties: false
      required:
      - expectedMigrationId
      - mappings
      properties:
        expectedMigrationId:
          $ref: '#/components/schemas/Uuid'
        mappings:
          $ref: '#/components/schemas/ConvertMigrationRequest'
    MigrationProjectConversion:
      type: object
      additionalProperties: false
      required:
      - project
      - converted
      properties:
        project:
          $ref: '#/components/schemas/MigrationProject'
        converted:
          type: object
          required:
          - workflow
          - draft
          - report
          properties:
            workflow:
              $ref: '#/components/schemas/Workflow'
            draft:
              $ref: '#/components/schemas/WorkflowDraft'
            report:
              $ref: '#/components/schemas/CompatibilityReport'

    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        conversationId: { $ref: '#/components/schemas/Uuid' }
        expectedVersion: { type: integer, minimum: 1 }
        message: { type: string, minLength: 1, maxLength: 4000 }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, version, stage, message, choices]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        stage: { type: string, enum: [idle, collecting, review, confirmingTask, completed] }
        message: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [label, command]
            properties:
              label: { type: string }
              command: { type: string }
        field:
          type: object
          description: Current request field schema and its name/required flag
          additionalProperties: true
        review:
          type: object
          required: [workflowName, input]
          properties:
            workflowName: { type: string }
            input: { type: object, additionalProperties: true }
            fields:
              type: array
              description: Request values in form order with their business labels
              items:
                type: object
                required: [name, label, value]
                properties:
                  name: { type: string }
                  label: { type: string }
                  value: {}
                  display: { type: string, description: 'Readable form of the value when it differs from the stored one, for example a calendar date' }
        runId: { $ref: '#/components/schemas/Uuid' }
        taskId: { type: string }
        taskAction:
          type: string
          enum: [claim, approve, reject]
          description: Present once a task action is prepared and waiting for explicit confirmation
    Uuid: { type: string, format: uuid }
    Key: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
    Name: { type: string, minLength: 1, maxLength: 200 }
    Timestamp: { type: string, format: date-time }
    NextCursor:
      oneOf: [{ type: string }, { type: 'null' }]
    Lifecycle:
      type: string
      enum: [running, waiting, needsAttention, completed, cancelled]
    OutcomeKind:
      type: string
      enum: [success, rejected, failed]
    Adapter:
      type: object
      additionalProperties: false
      required: [id, key, kind, name, config, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        kind: { type: string, enum: [email, teams, jdbc, kafka] }
        name: { type: string }
        secretRef: { type: [string, 'null'], description: Shown to connection.manage only }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdapterList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Adapter' } }
    AdapterCreateRequest:
      type: object
      additionalProperties: false
      required: [key, kind, name, secretRef, config]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
        kind: { type: string, enum: [email, teams, jdbc, kafka] }
        name: { type: string, minLength: 1, maxLength: 100 }
        secretRef: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        config: { type: object, additionalProperties: true }
    AdapterSendRequest:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload: { type: object, additionalProperties: true }
    AdapterSendResult:
      type: object
      additionalProperties: false
      required: [adapter, kind, outcome, detail]
      properties:
        adapter: { type: string }
        kind: { type: string, enum: [email, teams, jdbc, kafka] }
        outcome: { type: string, enum: [stubbed] }
        detail: { type: object, additionalProperties: true }
    InboundTrigger:
      type: object
      additionalProperties: false
      required: [id, key, source, name, workflowId, filter, mapping, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        source: { type: string, enum: [email, teams, jdbc, kafka] }
        name: { type: string }
        workflowId: { type: string, format: uuid }
        secretRef: { type: [string, 'null'] }
        filter: { type: object, additionalProperties: true }
        mapping: { type: object, additionalProperties: { type: string } }
        enabled: { type: boolean }
        receivePath: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    InboundTriggerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InboundTrigger' } }
    InboundTriggerCreateRequest:
      type: object
      additionalProperties: false
      required: [key, source, name, workflowId, secretRef, mapping]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
        source: { type: string, enum: [email, teams, jdbc, kafka] }
        name: { type: string, minLength: 1, maxLength: 100 }
        workflowId: { type: string, format: uuid }
        secretRef: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
        filter: { type: object, additionalProperties: true }
        mapping: { type: object, additionalProperties: { type: string } }
    InboundAccepted:
      type: object
      additionalProperties: false
      required: [eventId, status, duplicate]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [received, started] }
        duplicate: { type: boolean }
    InboundEvent:
      type: object
      additionalProperties: false
      required: [id, triggerId, triggerKey, workflowId, eventId, status, input, receivedAt]
      properties:
        id: { type: string, format: uuid }
        triggerId: { type: string, format: uuid }
        triggerKey: { type: string }
        workflowId: { type: string, format: uuid }
        eventId: { type: string }
        status: { type: string, enum: [received, started] }
        input: { type: object, additionalProperties: true }
        runId: { type: [string, 'null'], format: uuid }
        receivedAt: { type: string, format: date-time }
    InboundEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InboundEvent' } }
    InboundStarted:
      type: object
      additionalProperties: false
      required: [eventId, runId, alreadyStarted]
      properties:
        eventId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        alreadyStarted: { type: boolean }
    OpenApiReviewRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, minLength: 1, maxLength: 2097152 }
        fileName: { type: string, maxLength: 200 }
        key: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        confirmEffects: { type: boolean, default: false }
        selections:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [key, effectClass]
            properties:
              key: { type: string, minLength: 1, maxLength: 80 }
              effectClass: { type: string, enum: [readOnly, idempotentWithKey, nonIdempotent] }
              idempotencyHeader: { type: string, maxLength: 64 }
    OpenApiReviewResult:
      type: object
      additionalProperties: false
      required: [report, definition]
      properties:
        definition:
          oneOf:
            - $ref: './connection-definition-v0.schema.json'
            - type: 'null'
        report:
          type: object
          required: [source, servers, auth, summary, operations, issues, suggestedKey, suggestedName]
          properties:
            source: { type: object, additionalProperties: true }
            servers: { type: array, items: { type: object, additionalProperties: true } }
            auth: { type: object, additionalProperties: true }
            suggestedKey: { type: string }
            suggestedName: { type: string }
            summary:
              type: object
              additionalProperties: { type: integer }
            issues:
              type: array
              items:
                type: object
                required: [severity, code, message]
                properties:
                  severity: { type: string }
                  code: { type: string }
                  message: { type: string }
            operations:
              type: array
              maxItems: 200
              items:
                type: object
                required: [key, method, path, disposition, blockers, notes, testable, deprecated, selectedByDefault, inputs, outputs]
                properties:
                  key: { type: string }
                  method: { type: string }
                  path: { type: string }
                  summary: { type: string }
                  disposition: { type: string, enum: [supported, simplified, blocked] }
                  blockers: { type: array, items: { type: string } }
                  notes: { type: array, items: { type: string } }
                  suggestedEffectClass: { type: string }
                  effectReason: { type: string }
                  idempotencyHeader: { type: string }
                  testable: { type: boolean }
                  deprecated: { type: boolean }
                  selectedByDefault: { type: boolean }
                  inputs: { type: array, items: { type: string } }
                  outputs: { type: array, items: { type: string } }

    DocumentSource:
      type: object
      required:
      - id
      - label
      - connectionKey
      - definitionVersion
      - driveId
      - folderId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        connectionKey:
          type: string
        definitionVersion:
          type: integer
        driveId:
          type: string
        folderId:
          type: string
      additionalProperties: false
    DocumentSourcePrincipal:
      type: object
      required:
      - type
      - value
      properties:
        type:
          enum:
          - subject
          - idpGroup
        value:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
    DocumentSourceGrant:
      type: object
      required:
      - source
      - browseOperation
      - versionsOperation
      - audience
      - enabled
      - revision
      properties:
        source:
          $ref: '#/components/schemas/DocumentSource'
        browseOperation:
          type: string
        versionsOperation:
          type: string
        audience:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentSourcePrincipal'
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    PutDocumentSourceGrant:
      type: object
      required:
      - label
      - connectionKey
      - definitionVersion
      - browseOperation
      - versionsOperation
      - driveId
      - folderId
      - audience
      - enabled
      - expectedRevision
      properties:
        label:
          type: string
        connectionKey:
          type: string
        definitionVersion:
          type: integer
        driveId:
          type: string
        folderId:
          type: string
        browseOperation:
          type: string
        versionsOperation:
          type: string
        audience:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentSourcePrincipal'
        enabled:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483646
      additionalProperties: false
    DocumentSourceFiles:
      type: object
      required:
      - driveId
      - folderId
      - filesJson
      - fileCount
      - hasMore
      properties:
        driveId:
          type: string
        folderId:
          type: string
        filesJson:
          type: string
        fileCount:
          type: integer
          minimum: 0
          maximum: 100
        hasMore:
          const: false
      additionalProperties: false
    DocumentSourceVersions:
      type: object
      required:
      - driveId
      - itemId
      - versionsJson
      - versionCount
      - hasMore
      properties:
        driveId:
          type: string
        itemId:
          type: string
        versionsJson:
          type: string
        versionCount:
          type: integer
          minimum: 0
          maximum: 100
        hasMore:
          const: false
      additionalProperties: false

    Permission:
      type: string
      enum:
        - workflow.read
        - workflow.edit
        - workflow.publish
        - workflow.export
        - workflow.start
        - run.read
        - run.read-data
        - run.operate
        - task.act
        - connection.read
        - connection.manage
        - workspace.manage-access
        - audit.read
        - message.send
        - document.browse
        - job.work
    WorkspaceRole:
      type: string
      enum: [WORKSPACE_ADMIN, WORKFLOW_DESIGNER, PUBLISHER, OPERATOR, VIEWER, APPROVER]

    Problem:
      type: object
      description: RFC 9457 problem details with Orqix extension members.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference, description: 'https://orqix.example/problems/{code-in-kebab-case}' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - MALFORMED_REQUEST
            - IDEMPOTENCY_KEY_REQUIRED
            - INVALID_CURSOR
            - UNAUTHENTICATED
            - FORBIDDEN
            - CSRF_INVALID
            - SELF_APPROVAL_DENIED
            - SEPARATION_OF_DUTIES
            - NOT_ELIGIBLE
            - NOT_FOUND
            - IDEMPOTENCY_KEY_REUSED
            - DUPLICATE_KEY
            - WORKFLOW_VERSION_CONFLICT
            - RELEASE_NOT_ACTIVE
            - TASK_VERSION_CONFLICT
            - TASK_ALREADY_CLAIMED
            - TASK_NOT_CLAIMED_BY_CALLER
            - TASK_NOT_OPEN
            - RUN_NOT_ACTIVE
            - RUN_BUSY
            - RUN_NOT_RECOVERABLE
            - RUN_SUSPENDED
            - RUN_NOT_SUSPENDED
            - RUN_NOT_SUSPENDABLE
            - RUN_NOT_REPAIRABLE
            - RUN_NOT_MIGRATABLE
            - JOB_LEASE_LOST
            - JOB_NOT_OPEN
            - EFFECT_NOT_RECONCILED
            - EFFECT_STATE_CONFLICT
            - GROUP_REVISION_CONFLICT
            - STALE_REVISION
            - PAYLOAD_TOO_LARGE
            - VALIDATION_FAILED
            - WORKFLOW_INVALID
            - WARNINGS_NOT_ACKNOWLEDGED
            - NO_ACTIVE_RELEASE
            - REASON_REQUIRED
            - CONNECTION_NOT_BOUND
            - EGRESS_NOT_ALLOWED
            - OPERATION_NOT_TESTABLE
            - PRECONDITION_REQUIRED
            - QUOTA_EXCEEDED
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
            - AI_NOT_CONFIGURED
            - AI_MODEL_NOT_ALLOWED
            - AI_OUTPUT_INVALID
            - AI_PROVIDER_UNAVAILABLE
            - AI_BUDGET_EXCEEDED
            - SOURCE_INVALID
            - MIGRATION_BLOCKED
            - ATTACHMENT_BLOCKED
            - ATTACHMENT_LIMIT_REACHED
            - INTERNAL_ERROR
        correlationId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        openItems:
          type: array
          description: MIGRATION_BLOCKED only - compatibility report items that are still open (blockers and unresolved actions)
          items: { $ref: '#/components/schemas/CompatibilityIssue' }
        currentRevision: { type: integer }
        currentVersion: { type: integer }
    FieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: 'JSON Pointer into the request body, e.g. /input/amount' }
        code: { type: string, description: 'Keyword that failed: required, type, enum, minimum, maximum, maxLength, multipleOf, additionalProperties' }
        message: { type: string }

    SubjectRef:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
    PrincipalRef:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [subject, idpGroup] }
        value: { type: string, minLength: 1, maxLength: 256, description: 'Subject UUID or IdP group claim value' }
    Principal:
      description: PrincipalRef as returned by the server, with a display name when known.
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [subject, idpGroup] }
        value: { type: string, minLength: 1, maxLength: 256 }
        displayName: { type: string }

    Me:
      type: object
      required: [subject, workspaces, platformAdmin]
      properties:
        subject:
          type: object
          required: [id, displayName]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            displayName: { type: string }
            email: { type: [string, 'null'] }
        platformAdmin: { type: boolean }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMembership' }
    WorkspaceMembership:
      type: object
      required: [id, key, name, organizationName, isTest, permissions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        organizationName: { type: string }
        isTest: { type: boolean }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    Organization:
      type: object
      required: [id, key, name, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [organizationId, key, name, isTest, initialAdmins]
      properties:
        organizationId: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { $ref: '#/components/schemas/Name' }
        isTest: { type: boolean }
        allowSelfApprovalWorkflows: { type: boolean, default: false, description: 'Only accepted when isTest is true' }
        initialAdmins:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PrincipalRef' }
    WorkspaceAdminView:
      type: object
      required: [id, organizationId, key, name, isTest, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        isTest: { type: boolean }
        allowSelfApprovalWorkflows: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    Template:
      type: object
      required: [id, name, description, typicalOwner, requiredInputs]
      properties:
        id: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        description: { type: string }
        typicalOwner: { type: string }
        requiredInputs: { type: array, items: { type: string } }
        requiredGroups: { type: array, items: { $ref: '#/components/schemas/Key' } }
        requiredConnections: { type: array, items: { $ref: '#/components/schemas/Key' } }
        requiredWorkflows: { type: array, items: { $ref: '#/components/schemas/Key' }, description: 'Workflows the template starts as child requests; they must be published first.' }

    WorkflowSummary:
      type: object
      required: [id, key, name, draftRevision, activeRelease, canStart, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        description: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/SubjectRef' }
        draftRevision: { type: integer }
        activeRelease:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, releaseNumber, publishedAt, draftRevision]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                releaseNumber: { type: integer }
                publishedAt: { $ref: '#/components/schemas/Timestamp' }
                draftRevision: { type: integer, description: 'The draft revision this release was published from; the workflow has unpublished changes when draftRevision (on the workflow) is greater' }
        canStart: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        folderId:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: Present only for callers with workflow.read and only when the workflow is in a folder
    WorkflowFolder:
      type: object
      required: [id, name, version, workflowCount, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        workflowCount: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkflowOrganization:
      type: object
      required: [folders, unfiledCount, owners, folderLimit]
      properties:
        folders: { type: array, items: { $ref: '#/components/schemas/WorkflowFolder' } }
        unfiledCount: { type: integer, minimum: 0 }
        owners:
          type: array
          items:
            type: object
            required: [id, displayName, workflowCount]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              displayName: { type: string }
              workflowCount: { type: integer, minimum: 1 }
        folderLimit: { type: integer }
    WorkflowFolderName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    RenameWorkflowFolder:
      type: object
      additionalProperties: false
      required: [name, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expectedVersion: { type: integer, minimum: 1 }
    SetWorkflowFolder:
      type: object
      additionalProperties: false
      required: [folderId]
      properties:
        folderId:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Uuid' }]
        expectedFolderVersion: { type: integer, minimum: 1, description: 'Required with a folder; omitted when folderId is null' }
    WorkflowComment:
      type: object
      required: [id, elementId, body, authorId, authorName, createdAt, resolved]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        elementId: { type: string }
        parentId:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Uuid' }]
        body: { type: string, minLength: 1, maxLength: 2000 }
        authorId: { $ref: '#/components/schemas/Uuid' }
        authorName: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        resolved: { type: boolean }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByName: { type: [string, 'null'] }
    WorkflowDiscussionThread:
      type: object
      required: [root, replies]
      properties:
        root: { $ref: '#/components/schemas/WorkflowComment' }
        replies: { type: array, items: { $ref: '#/components/schemas/WorkflowComment' } }
    WorkflowDiscussion:
      type: object
      required: [threads, openByElement, canPost]
      properties:
        threads: { type: array, items: { $ref: '#/components/schemas/WorkflowDiscussionThread' } }
        openByElement: { type: object, additionalProperties: { type: integer, minimum: 1 } }
        canPost: { type: boolean }
    PostWorkflowComment:
      type: object
      additionalProperties: false
      required: [elementId, body]
      properties:
        elementId: { type: string, minLength: 1, maxLength: 128, description: 'A step or connection ID of the current draft' }
        body: { type: string, minLength: 1, maxLength: 2000 }
        parentId: { $ref: '#/components/schemas/Uuid' }
    ResolveWorkflowThread:
      type: object
      additionalProperties: false
      required: [resolved]
      properties:
        resolved: { type: boolean }
    SetWorkflowOwner:
      type: object
      additionalProperties: false
      required: [ownerSubjectId, expectedVersion]
      properties:
        ownerSubjectId: { $ref: '#/components/schemas/Uuid' }
        expectedVersion: { type: integer, minimum: 1, description: 'The workflow version' }
    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowSummary'
        - type: object
          required: [version, createdAt, permissions]
          properties:
            version: { type: integer, description: 'Concurrency token for active-release changes' }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/Permission' }
    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { $ref: '#/components/schemas/Name' }
        description: { type: string, maxLength: 2000 }
        templateId: { $ref: '#/components/schemas/Key' }
    WorkflowDraft:
      type: object
      required: [workflowId, revision, savedAt, savedBy, definition]
      properties:
        workflowId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, minimum: 1 }
        savedAt: { $ref: '#/components/schemas/Timestamp' }
        savedBy: { $ref: '#/components/schemas/SubjectRef' }
        definition:
          type: object
          description: Canonical workflow document, possibly incomplete. Validate with POST /validate.
    SaveDraftRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition:
          type: object
          description: Must contain schemaVersion "0.1". Max 256 KiB serialized, depth 32.
    ValidationIssue:
      type: object
      required: [code, severity, message, path]
      properties:
        code: { type: string, pattern: '^WF_[A-Z_]+$' }
        severity: { type: string, enum: [blocker, warning] }
        message: { type: string }
        path: { type: string, description: 'JSON Pointer into the definition' }
        nodeId: { type: [string, 'null'] }
        transitionId: { type: [string, 'null'] }
    ValidationReport:
      type: object
      required: [revision, compilerVersion, publishable, issues]
      properties:
        revision: { type: integer }
        compilerVersion: { type: string }
        publishable: { type: boolean, description: 'True when there are no blockers' }
        semanticHash: { type: [string, 'null'] }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    DecisionEvaluateRequest:
      type: object
      additionalProperties: false
      required: [revision, values]
      properties:
        revision: { type: integer, minimum: 1 }
        values:
          type: object
          description: 'Map of fieldRef to sample value, for example {"/input/amount": 5000}'
          additionalProperties: { type: [string, number, boolean] }
    DecisionEvaluateResult:
      type: object
      required: [matchedRow, usedDefault, output]
      properties:
        matchedRow: { type: [integer, 'null'], description: 'Zero-based row index, null when the default applied' }
        usedDefault: { type: boolean }
        output: { type: object, additionalProperties: { type: [string, number, boolean] } }

    WorkflowTestCase:
      type: object
      additionalProperties: false
      required: [id, name, input, expect]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        input: { type: object, additionalProperties: true }
        scenario: { $ref: '#/components/schemas/SimulationScenario' }
        expect: { type: string, minLength: 1, maxLength: 200, description: 'Expected business outcome, or __needsAttention__' }
    WorkflowTestSuite:
      type: object
      additionalProperties: false
      required: [version, cases]
      properties:
        version: { type: integer, minimum: 0 }
        cases: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/WorkflowTestCase' } }
    SaveWorkflowTestSuite:
      type: object
      additionalProperties: false
      required: [expectedVersion, cases]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        cases: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/WorkflowTestCase' } }
    RunWorkflowTestSuite:
      type: object
      additionalProperties: false
      required: [revision, suiteVersion]
      properties:
        revision: { type: integer, minimum: 1 }
        suiteVersion: { type: integer, minimum: 1 }
    WorkflowTestReport:
      type: object
      additionalProperties: false
      required: [suiteVersion, revision, passed, results]
      properties:
        suiteVersion: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        passed: { type: boolean }
        results:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, passed, status]
            properties:
              id: { type: string }
              passed: { type: boolean }
              status: { type: string, enum: [finished, needsAttention, invalid] }
    SimulateRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        revision: { type: integer, minimum: 1, description: 'Draft revision to test; the current draft when omitted' }
        useActiveRelease: { type: boolean, description: 'Test the active release instead of a draft' }
        input:
          type: object
          description: The sample request, answers to the request form
          additionalProperties: true
        scenario: { $ref: '#/components/schemas/SimulationScenario' }
    SimulationScenario:
      type: object
      additionalProperties: false
      description: What happens at the steps a person or another system would decide. Everything defaults to the happy path.
      properties:
        approvals:
          type: object
          description: By step ID. Default is approve.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              outcome: { type: string, enum: [approve, reject, timeout] }
              reason: { type: string, maxLength: 1000 }
        calls:
          type: object
          description: By step ID of a Call a system step. Default is success with a sample answer built from the response schema of the operation.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              failure: { type: string, enum: [rejected, unavailable, unknownOutcome] }
              result: { type: object, additionalProperties: true, description: 'The answer (response body) of the system' }
        children:
          type: object
          description: By step ID of a Start another workflow step.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              outcomes:
                type: array
                maxItems: 25
                description: Business outcome of each occurrence in order; later occurrences use the default
                items: { type: string, maxLength: 100 }
              results:
                type: object
                additionalProperties: true
                description: Result fields of the child workflow, by child field
        messages:
          type: object
          description: By step ID of a Wait for a message step. arrives (default) or timeout.
          additionalProperties: { type: string, enum: [arrives, timeout] }
        simulateChildren: { type: boolean, description: 'Run the active release of each child workflow too (at most 3 levels)' }
        childScenarios:
          type: object
          description: Scenario for the child workflow of a step, by step ID (used with simulateChildren)
          additionalProperties: { type: object, additionalProperties: true }
    SimulationResult:
      type: object
      required: [source, outcome, outputs, trace, warnings, coverage, limits]
      properties:
        source:
          type: object
          required: [revision, releaseNumber]
          properties:
            revision: { type: [integer, 'null'] }
            releaseNumber: { type: [integer, 'null'] }
        outcome:
          type: object
          required: [status, summary]
          properties:
            status: { type: string, enum: [finished, needsAttention] }
            businessOutcome: { type: [string, 'null'] }
            outcomeKind: { type: [string, 'null'] }
            endStepId: { type: [string, 'null'] }
            summary: { type: string }
            attention:
              type: [object, 'null']
              properties:
                stepId: { type: string }
                stepLabel: { type: string }
                reason: { type: string, description: 'EFFECT_REJECTED, RETRIES_EXHAUSTED, EFFECT_UNKNOWN, RESPONSE_INVALID, CHILD_NEEDS_ATTENTION, INTERNAL_ERROR, ...' }
                message: { type: string }
        outputs: { type: object, additionalProperties: true }
        trace:
          type: array
          items: { $ref: '#/components/schemas/SimulationStep' }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              stepId: { type: [string, 'null'] }
              message: { type: string }
        coverage:
          type: object
          required: [steps, routes, rules, summary]
          properties:
            steps:
              type: object
              properties:
                visited: { type: integer }
                total: { type: integer }
                notVisited: { type: array, items: { type: object, additionalProperties: true } }
            routes:
              type: object
              properties:
                taken: { type: integer }
                total: { type: integer }
                notTaken: { type: array, items: { type: object, additionalProperties: true } }
            rules:
              type: object
              properties:
                matched: { type: integer }
                total: { type: integer }
                notMatched: { type: array, items: { type: object, additionalProperties: true } }
            summary: { type: string }
        limits: { type: string, description: What a dry run cannot prove }
    SimulationStep:
      type: object
      required: [seq, stepId, stepLabel, kind, kindLabel, summary, details]
      properties:
        seq: { type: integer, minimum: 1 }
        stepId: { type: string }
        stepLabel: { type: string }
        kind: { type: string }
        kindLabel: { type: string }
        branch: { type: string, description: 'Parallel branch such as 2 or 2.1; absent outside parallel work' }
        summary: { type: string, description: 'What happened and why, in plain language' }
        details: { type: object, additionalProperties: true, description: 'Kind-specific facts: evaluated rows, route conditions, assigned group, request and result of a call, message text' }
        wrote: { type: object, additionalProperties: true, description: 'Values this step stored at /steps/<id>/...' }
        transitionId: { type: [string, 'null'], description: 'The route followed out of this step; null when the run ended or stopped here' }
        nextStepId: { type: [string, 'null'] }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [draftRevision]
      properties:
        draftRevision: { type: integer, minimum: 1 }
        acknowledgeWarnings: { type: boolean, default: false }
        activate: { type: boolean, default: true, description: 'Make this release the one used for new starts' }
        releaseNote: { type: string, maxLength: 1000 }
    ReleaseSummary:
      type: object
      required: [id, workflowId, releaseNumber, draftRevision, publishedAt, publishedBy, isActive, compilerVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workflowId: { $ref: '#/components/schemas/Uuid' }
        releaseNumber: { type: integer }
        draftRevision: { type: integer }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedBy: { $ref: '#/components/schemas/SubjectRef' }
        isActive: { type: boolean }
        compilerVersion: { type: string }
        releaseNote: { type: [string, 'null'] }
    Release:
      allOf:
        - $ref: '#/components/schemas/ReleaseSummary'
        - type: object
          required: [sourceHash, semanticHash, warnings, manifest, definition]
          properties:
            sourceHash: { type: string }
            semanticHash: { type: string }
            warnings: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
            manifest: { $ref: '#/components/schemas/ReleaseManifest' }
            definition: { $ref: './workflow-v0.schema.json' }
    ReleaseManifest:
      type: object
      required: [releaseId, workflowKey, schemaVersion, compilerVersion, sourceHash, semanticHash, bpmnHash, dmnHashes, processDefinitionId, decisions, connections, groups]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        workflowKey: { $ref: '#/components/schemas/Key' }
        schemaVersion: { type: string }
        compilerVersion: { type: string }
        sourceHash: { type: string }
        semanticHash: { type: string }
        bpmnHash: { type: string }
        dmnHashes: { type: object, additionalProperties: { type: string } }
        processDefinitionId: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [key, version]
            properties:
              key: { $ref: '#/components/schemas/Key' }
              version: { type: integer }
        connections:
          type: array
          items:
            type: object
            required: [key, definitionVersion, definitionHash]
            properties:
              key: { $ref: '#/components/schemas/Key' }
              definitionVersion: { type: integer }
              definitionHash: { type: string }
        groups: { type: array, items: { $ref: '#/components/schemas/Key' } }

    StartForm:
      type: object
      required: [workflowId, workflowName, releaseId, releaseNumber, inputSchema, isTest]
      properties:
        workflowId: { $ref: '#/components/schemas/Uuid' }
        workflowName: { type: string }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        releaseNumber: { type: integer }
        inputSchema: { type: object }
        inputUi: { type: object }
        isTest: { type: boolean }
    StartRunRequest:
      type: object
      additionalProperties: false
      required: [workflowId, input]
      properties:
        workflowId: { $ref: '#/components/schemas/Uuid' }
        expectedReleaseId:
          description: Release whose form the client rendered. 409 RELEASE_NOT_ACTIVE if another release became active.
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
        businessKey: { type: string, minLength: 1, maxLength: 100 }
        input: { type: object, additionalProperties: true, description: 'Validated against the active release inputSchema' }
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [name, correlationKey]
      properties:
        name: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z][a-zA-Z0-9]*(-[a-z0-9][a-zA-Z0-9]*)*$', example: payment-received }
        correlationKey: { type: string, minLength: 1, maxLength: 200, description: 'The value that identifies the request, for example its order number. Matched exactly (case-sensitive).' }
        payload:
          description: Flat object of scalar values (text up to 1,000 characters, numbers, true or false); at most 10 values and 16 KiB.
          oneOf: [{ type: object, additionalProperties: { type: [string, number, boolean, 'null'] } }, { type: 'null' }]
    DeliveredRun:
      type: object
      required: [runId, runReference, nodeId]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        runReference: { type: string, example: ORQ-1043 }
        nodeId: { type: string }
    MessageAccepted:
      type: object
      required: [id, status, matched, delivered, bufferedUntil]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [delivered, buffered] }
        matched: { type: integer, minimum: 0 }
        delivered: { type: array, items: { $ref: '#/components/schemas/DeliveredRun' } }
        bufferedUntil:
          description: End of the buffer window while status is buffered.
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
    CurrentStep:
      type: object
      required: [nodeId, label, kind, since]
      properties:
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [approval, http, wait, child, generateDocument, external] }
        messageName: { type: [string, 'null'], description: 'Set while the step (kind wait) waits for this message (docs/build/S16).' }
        since: { $ref: '#/components/schemas/Timestamp' }
        candidateGroup: { type: [string, 'null'] }
        assignee: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    Attention:
      type: object
      required: [reason, nodeId, message, since]
      properties:
        reason:
          type: string
          enum: [RETRIES_EXHAUSTED, EFFECT_UNKNOWN, EFFECT_REJECTED, RESPONSE_INVALID, CONNECTION_UNAVAILABLE, POLICY_DENIED, INTERNAL_ERROR, RUN_WAITING_ON_NOTHING]
        nodeId: { type: [string, 'null'] }
        effectId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        message: { type: string, description: 'Business-readable, redacted' }
        since: { $ref: '#/components/schemas/Timestamp' }
    Run:
      type: object
      required: [id, workflow, release, initiator, lifecycle, outcome, outcomeKind, currentSteps, attention, createdAt, updatedAt, endedAt, isTest, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference:
          type: string
          description: Human request reference unique within the workspace, e.g. ORQ-1043 (shown instead of the UUID)
        workflow:
          type: object
          required: [id, key, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            key: { $ref: '#/components/schemas/Key' }
            name: { type: string }
        release:
          type: object
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer }
        businessKey: { type: [string, 'null'] }
        requestTitle:
          type: [string, 'null']
          description: >-
            What the request is about: the first text field of the request form (in form order), trimmed and cut to 120
            characters, for list display. Null for a caller who may not read the request data (the rule of `input` on
            RunDetail: the initiator, a task participant, or run.read-data) and when the form has no text field.
        initiator: { $ref: '#/components/schemas/SubjectRef' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        outcome: { type: [string, 'null'], description: 'Business outcome label from the end node' }
        outcomeKind: { oneOf: [{ $ref: '#/components/schemas/OutcomeKind' }, { type: 'null' }] }
        currentSteps: { type: array, items: { $ref: '#/components/schemas/CurrentStep' } }
        attention: { oneOf: [{ $ref: '#/components/schemas/Attention' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        isTest: { type: boolean }
        version: { type: integer }
        stage:
          description: The current stage (docs/build/S17); null when the workflow has no stages or none was entered yet.
          oneOf: [{ $ref: '#/components/schemas/StageView' }, { type: 'null' }]
        parentRun:
          description: The run that started this one through a "Start another workflow" step (S12); null for ordinary runs.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ParentRun'
    ParentRun:
      type: object
      required: [id, reference, nodeId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string, description: 'e.g. ORQ-1011' }
        nodeId: { type: string }
        nodeLabel: { type: [string, 'null'] }
    ChildRun:
      type: object
      required: [id, reference, workflow, release, nodeId, lifecycle, startedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow:
          type: object
          required: [id, key, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            key: { $ref: '#/components/schemas/Key' }
            name: { type: string }
        release:
          type: object
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer }
        nodeId: { type: string }
        nodeLabel: { type: [string, 'null'] }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        outcome: { type: [string, 'null'] }
        outcomeKind: { oneOf: [{ $ref: '#/components/schemas/OutcomeKind' }, { type: 'null' }] }
        attention: { oneOf: [{ $ref: '#/components/schemas/Attention' }, { type: 'null' }] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        iteration: { type: integer, minimum: 1 }
    RunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Run' } }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [tasks, allowedActions]
          properties:
            input: { type: [object, 'null'], description: 'Null unless the caller is the initiator, a task participant, or holds run.read-data' }
            inputLabels: { type: object, additionalProperties: { type: string } }
            output: { type: [object, 'null'] }
            children:
              description: Runs started by steps of this run, oldest first. A child that needs attention is visible here.
              type: array
              items: { $ref: '#/components/schemas/ChildRun' }
            stages:
              description: The stages of the workflow with this request's progress; empty when the workflow has no stages.
              type: array
              items: { $ref: '#/components/schemas/StageView' }
            tasks: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
            effects:
              description: Present only for run.operate holders.
              type: array
              items: { $ref: '#/components/schemas/Effect' }
            completedEffectsNotReversed:
              description: After cancellation, external effects that had already succeeded.
              type: array
              items: { $ref: '#/components/schemas/Effect' }
            suspension:
              description: Present while an operator has suspended the request. `reason` is shown to run.operate holders only.
              type: object
              additionalProperties: false
              required: [since]
              properties:
                since: { $ref: '#/components/schemas/Timestamp' }
                reason: { type: string }
            allowedActions:
              type: object
              required: [cancel, retry, reconcile, suspend, resume]
              properties:
                cancel: { $ref: '#/components/schemas/ActionAvailability' }
                retry: { $ref: '#/components/schemas/ActionAvailability' }
                reconcile: { $ref: '#/components/schemas/ActionAvailability' }
                suspend: { $ref: '#/components/schemas/ActionAvailability' }
                resume: { $ref: '#/components/schemas/ActionAvailability' }
    ActionAvailability:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reasonCode: { type: [string, 'null'] }
    StageView:
      type: object
      additionalProperties: false
      description: >-
        A case stage of a request (docs/build/S17): a presentation layer over its steps. `index` counts from 1. `state` is
        notStarted, active or completed; `overdue` is true for an active stage past `dueAt`.
      required: [id, label, index, total, state, overdue]
      properties:
        id: { type: string }
        label: { type: string }
        index: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 1 }
        state: { type: string, enum: [notStarted, active, completed] }
        enteredAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        completedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        overdue: { type: boolean }
        sla: { type: [string, 'null'], description: ISO-8601 time limit of the stage (PT1M to P90D) }
    StagedUpload:
      type: object
      additionalProperties: false
      required: [id, name, contentType, sizeBytes, sha256, scanStatus, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, description: Sanitized display name; never a path }
        contentType: { type: string, description: Canonical content type of the detected file type }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    ScanStatus:
      type: string
      enum: [notScanned, clean, infected, error]
      description: notScanned means no scanner is configured; infected and error files are never served.
    Attachment:
      type: object
      additionalProperties: false
      required: [id, runId, name, contentType, sizeBytes, sha256, scanStatus, uploadedBy, uploadedAt, canRemove, downloadable]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        fieldKey: { type: [string, 'null'], description: The request form field the file was chosen for; null for files added later }
        name: { type: string }
        description: { type: [string, 'null'], maxLength: 200 }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        uploadedBy: { $ref: '#/components/schemas/SubjectRef' }
        uploadedAt: { $ref: '#/components/schemas/Timestamp' }
        removedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        removedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        canRemove: { type: boolean }
        downloadable: { type: boolean, description: False for removed files, quarantined files and files blocked by the scan }
        quarantinedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        quarantineReason: { type: [string, 'null'], maxLength: 300 }
    AttachmentLimits:
      type: object
      additionalProperties: false
      required: [maxFileBytes, maxFiles, maxTotalBytes, usedFiles, usedBytes, allowedTypes]
      properties:
        maxFileBytes: { type: integer }
        maxFiles: { type: integer }
        maxTotalBytes: { type: integer }
        usedFiles: { type: integer }
        usedBytes: { type: integer }
        allowedTypes: { type: array, items: { type: string, enum: [pdf, png, jpeg, txt, csv, docx, xlsx, pptx] } }
    AttachmentList:
      type: object
      additionalProperties: false
      required: [items, limits, canAdd]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        limits: { $ref: '#/components/schemas/AttachmentLimits' }
        canAdd: { type: boolean }
    QuarantineAttachment:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }
    AttachmentOcr:
      type: object
      additionalProperties: false
      required: [attachmentId, provider, status, extractedAt]
      properties:
        attachmentId: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, description: 'The provider that produced the result, for example local-stub' }
        status: { type: string, enum: [extracted, unsupported] }
        text: { type: [string, 'null'], maxLength: 100000, description: Present only when status is extracted }
        extractedAt: { $ref: '#/components/schemas/Timestamp' }
    AttachmentRetention:
      type: object
      additionalProperties: false
      required: [version, eligibleNow]
      properties:
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        version: { type: integer, minimum: 0, description: '0 until a setting is saved' }
        eligibleNow: { type: integer, minimum: 0, description: Files the next sweep would remove under this setting }
        updatedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    SetAttachmentRetention:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        expectedVersion: { type: integer, minimum: 0 }
    DocumentFormat:
      type: string
      enum: [pdf, docx]
    DocumentTemplateSummary:
      type: object
      additionalProperties: false
      required: [id, name, latestVersion, format, placeholderCount, archived, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 300 }
        latestVersion: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        placeholderCount: { type: integer, minimum: 0 }
        archived: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    DocumentTemplatePage:
      type: object
      additionalProperties: false
      required: [items, templateLimit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DocumentTemplateSummary' } }
        templateLimit: { type: integer }
    DocumentTemplateVersion:
      type: object
      additionalProperties: false
      required: [version, format, body, placeholders, sha256, createdBy, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        body: { type: string, minLength: 1, maxLength: 16000 }
        placeholders: { type: array, items: { type: string } }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        changeNote: { type: [string, 'null'], maxLength: 300 }
        createdBy: { $ref: '#/components/schemas/SubjectRef' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    DocumentTemplate:
      type: object
      additionalProperties: false
      required: [id, name, latestVersion, archived, createdAt, updatedAt, versions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        latestVersion: { type: integer, minimum: 1 }
        archived: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        versions: { type: array, items: { $ref: '#/components/schemas/DocumentTemplateVersion' } }
    CreateDocumentTemplate:
      type: object
      additionalProperties: false
      required: [name, format, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 300 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        body: { type: string, minLength: 1, maxLength: 16000, description: 'Plain text with {{field}} placeholders, as in the Generate a document step' }
        changeNote: { type: [string, 'null'], maxLength: 300 }
    AddDocumentTemplateVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion, format, body]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/DocumentFormat' }
        body: { type: string, minLength: 1, maxLength: 16000 }
        changeNote: { type: [string, 'null'], maxLength: 300 }
    RunComment:
      type: object
      additionalProperties: false
      required: [id, runId, author, text, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        author:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            displayName: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
    RunCommentPage:
      type: object
      additionalProperties: false
      required: [comments, hasMore]
      properties:
        comments:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/RunComment' }
        hasMore: { type: boolean }
    RunEvent:
      type: object
      required: [seq, type, occurredAt, data]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { type: string, description: 'See event catalog in docs/build/S5-runtime.md' }
        nodeId: { type: [string, 'null'] }
        nodeLabel:
          type: [string, 'null']
          description: Business label of the node from the run's pinned release (helpers map to their owning node), so timelines never show raw IDs.
        actor: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        data: { type: object, additionalProperties: true, description: 'Event-specific fields (S5 section 8 catalog). DECISION_EVALUATED includes outputs and evidence (input field/value pairs, evaluated candidate rows, and defaultSelected) only for callers allowed to read request data. Metadata-only readers receive the decision/table identifiers without outputs or evidence.' }
    EventPage:
      type: object
      required: [items, nextAfter, hasMore, lifecycle]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RunEvent' } }
        nextAfter: { type: integer, description: 'Pass as ?after= on the next poll' }
        hasMore: { type: boolean }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
    PathNode:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { type: string, description: 'Canonical step type (start, approval, decision, branch, http, notification, parallelSplit, parallelJoin, wait, startWorkflow, end; others may be added).' }
        label: { type: string }
        outcomeKind: { oneOf: [{ $ref: '#/components/schemas/OutcomeKind' }, { type: 'null' }], description: Finish steps only }
        outcome: { type: [string, 'null'], description: Finish steps only (the business outcome label) }
        hasTimeout: { type: boolean, description: An approval with a time limit and a route for when it runs out }
        position:
          oneOf:
            - type: object
              required: [x, y]
              properties: { x: { type: number }, y: { type: number } }
            - { type: 'null' }
          description: Layout saved by the designer; null when the studio never arranged this step.
    PathTransition:
      type: object
      required: [id, from, to, on]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        on: { type: string, enum: [next, approved, rejected, timedOut, failed, condition, default] }
        label: { type: [string, 'null'], description: The designer's route label. Conditions are never included. }
    PathVisit:
      type: object
      required: [nodeId, occurrence, enteredAt, leftAt, outcome]
      properties:
        nodeId: { type: string }
        occurrence: { type: integer, minimum: 1, description: 'Which time the request was at this step (repeats in loops).' }
        enteredAt: { $ref: '#/components/schemas/Timestamp' }
        leftAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        outcome:
          oneOf:
            - { type: string, enum: [approved, rejected, timedOut, failed, completed, cancelled] }
            - { type: 'null' }
          description: Null while the request is still at the step.
    PathCurrent:
      type: object
      required: [nodeId, label, kind, status, since]
      properties:
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [approval, http, wait, child, generateDocument, external] }
        status: { type: string, enum: [waiting, running, needsAttention] }
        since: { $ref: '#/components/schemas/Timestamp' }
        candidateGroup: { type: [string, 'null'] }
        assignee: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    RunPath:
      type: object
      required: [runId, lifecycle, diagram, visited, current, taken]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        diagram:
          type: object
          required: [nodes, transitions]
          properties:
            nodes: { type: array, items: { $ref: '#/components/schemas/PathNode' } }
            transitions: { type: array, items: { $ref: '#/components/schemas/PathTransition' } }
        visited: { type: array, items: { $ref: '#/components/schemas/PathVisit' } }
        current: { type: array, items: { $ref: '#/components/schemas/PathCurrent' } }
        taken: { type: array, items: { type: string }, description: Ids of the routes the request has used. }
        historyTruncated: { type: boolean, description: History exceeded the diagram limit; only current steps are reliable. }
    InsightsRange:
      type: object
      required: [from, to, days, generatedAt]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 365 }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
    InsightsWorkflow:
      type: object
      required: [id, key, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
    InsightsTotals:
      type: object
      required: [started, completed, fulfilled, rejected, cancelled, open, needsAttention]
      description: Requests started in the range, by where they stand now. started = completed + cancelled + open.
      properties:
        started: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        fulfilled: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0, description: 'Running, waiting or needing attention (needsAttention is included).' }
        needsAttention: { type: integer, minimum: 0 }
    InsightsCycleTime:
      type: object
      required: [workflow, completed, medianSeconds, p90Seconds]
      properties:
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        completed: { type: integer, minimum: 1 }
        medianSeconds: { type: integer, minimum: 0 }
        p90Seconds: { type: integer, minimum: 0 }
    InsightsOpenRun:
      type: object
      required: [runId, reference, workflow, lifecycle, startedAt, ageSeconds, stepLabel]
      description: A request identified by its reference only, never by its title or data.
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        ageSeconds: { type: integer, minimum: 0 }
        stepLabel: { type: [string, 'null'], description: The step it is at (first current step). }
    InsightsAttentionRun:
      type: object
      required: [runId, reference, workflow, reason, since, stepLabel]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        reason: { type: string, enum: [RETRIES_EXHAUSTED, EFFECT_UNKNOWN, EFFECT_REJECTED, RESPONSE_INVALID, CONNECTION_UNAVAILABLE, POLICY_DENIED, INTERNAL_ERROR, RUN_WAITING_ON_NOTHING] }
        since: { $ref: '#/components/schemas/Timestamp' }
        stepLabel: { type: [string, 'null'] }
    InsightsTimeout:
      type: object
      required: [workflow, nodeId, label, timeouts, decided, share]
      properties:
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        nodeId: { type: string }
        label: { type: string }
        timeouts: { type: integer, minimum: 1, description: Approvals that reached their time limit in the range. }
        decided: { type: integer, minimum: 0, description: Approvals of this step that ended in the range (decided or timed out). }
        share: { type: number, minimum: 0, maximum: 1 }
    InsightsOverdue:
      type: object
      required: [runId, reference, workflow, kind, stepLabel, dueAt, overdueSeconds]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        reference: { type: string }
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        kind: { type: string, enum: [approval, wait] }
        stepLabel: { type: string }
        dueAt: { $ref: '#/components/schemas/Timestamp' }
        overdueSeconds: { type: integer, minimum: 1 }
    InsightsSummary:
      type: object
      required: [range, totals, cycleTimes, oldestOpen, needsAttention, sla]
      properties:
        range: { $ref: '#/components/schemas/InsightsRange' }
        totals: { $ref: '#/components/schemas/InsightsTotals' }
        cycleTimes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/InsightsCycleTime' }, description: 'Started to completed, per workflow, for requests that completed (not cancelled).' }
        oldestOpen: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/InsightsOpenRun' }, description: 'All open requests of the workspace (or workflow), oldest first.' }
        needsAttention: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/InsightsAttentionRun' } }
        sla:
          type: object
          required: [timeouts, overdue, overdueCount]
          properties:
            timeouts: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/InsightsTimeout' } }
            overdue: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/InsightsOverdue' } }
            overdueCount: { type: integer, minimum: 0 }
    InsightsDay:
      type: object
      required: [date, started, completed, fulfilled, rejected]
      properties:
        date: { type: string, format: date }
        started: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        fulfilled: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    InsightsThroughput:
      type: object
      required: [range, days]
      properties:
        range: { $ref: '#/components/schemas/InsightsRange' }
        days: { type: array, maxItems: 365, items: { $ref: '#/components/schemas/InsightsDay' } }
    InsightsStep:
      type: object
      required: [workflow, nodeId, label, kind, count, openNow, averageWaitSeconds, p90WaitSeconds, timeouts, timeoutShare]
      properties:
        workflow: { $ref: '#/components/schemas/InsightsWorkflow' }
        nodeId: { type: string }
        label: { type: string }
        kind: { type: string, enum: [approval, wait] }
        count: { type: integer, minimum: 0, description: Times the step finished in the range (waited and left). }
        openNow: { type: integer, minimum: 0, description: Requests waiting at the step right now. }
        averageWaitSeconds: { type: [integer, 'null'] }
        p90WaitSeconds: { type: [integer, 'null'] }
        timeouts: { type: integer, minimum: 0 }
        timeoutShare: { type: number, minimum: 0, maximum: 1 }
    InsightsSteps:
      type: object
      required: [range, items, truncated]
      properties:
        range: { $ref: '#/components/schemas/InsightsRange' }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/InsightsStep' } }
        truncated: { type: boolean }
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    ExternalJobFetchRequest:
      type: object
      additionalProperties: false
      required: [workerId, topics]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        topics: { type: array, minItems: 1, maxItems: 10, items: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' } }
        maxJobs: { type: integer, minimum: 1, maximum: 10 }
        leaseSeconds: { type: integer, minimum: 30, maximum: 3600 }
    ExternalJob:
      type: object
      additionalProperties: false
      required: [id, topic, input, fence, leaseExpiresAt, attempt, maxAttempts, runReference, nodeId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        topic: { type: string }
        input: { type: object, additionalProperties: true, description: Only the values the step maps, by name. }
        fence: { type: integer, minimum: 1 }
        leaseExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        attempt: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1 }
        runReference: { type: string }
        nodeId: { type: string }
    ExternalJobBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExternalJob' } }
    ExternalJobExtendRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        leaseSeconds: { type: integer, minimum: 30, maximum: 3600 }
    ExternalJobExtendResult:
      type: object
      additionalProperties: false
      required: [leaseExpiresAt]
      properties:
        leaseExpiresAt: { $ref: '#/components/schemas/Timestamp' }
    ExternalJobCompleteRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence, result]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        result: { type: object, additionalProperties: { type: [string, number, boolean] } }
    ExternalJobFailRequest:
      type: object
      additionalProperties: false
      required: [workerId, fence, message, retryable]
      properties:
        workerId: { type: string, minLength: 1, maxLength: 100 }
        fence: { type: integer, minimum: 1 }
        message: { type: string, minLength: 1, maxLength: 500 }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
    CorrectTaskInputRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, changes]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        changes:
          type: object
          minProperties: 1
          maxProperties: 10
          description: Field key to its new single value.
          additionalProperties: { type: [string, number, boolean] }
    SuspendRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    RepairRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    RunDiagnosis:
      type: object
      additionalProperties: false
      required: [state, repairable, message, projectedNodeIds, engineNodeIds, version]
      properties:
        state: { type: string, enum: [inSync, projectionDrift, strandedToken, emptyRequest, engineMissing, unsupported, protected, ended] }
        repairable: { type: boolean }
        message: { type: string }
        projectedNodeIds: { type: array, items: { type: string } }
        engineNodeIds: { type: array, items: { type: string } }
        version: { type: integer }
    MigrateRunRequest:
      type: object
      additionalProperties: false
      required: [targetReleaseId, reason, expectedVersion]
      properties:
        targetReleaseId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    MigrationFinding:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [STEP_COUNT, STEP_UNKNOWN, STEP_KIND, STEP_MISSING, STEP_CHANGED, HISTORY_CHANGED, PARALLEL_REGION, STAGES_CHANGED, INPUT_INVALID] }
        message: { type: string }
        nodeId: { type: [string, 'null'] }
    MigrationOption:
      type: object
      additionalProperties: false
      required: [release, active, publishedAt, compatible, findings]
      properties:
        release:
          type: object
          additionalProperties: false
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer, minimum: 1 }
        active: { type: boolean, description: This is the release new requests start on. }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        compatible: { type: boolean }
        findings: { type: array, items: { $ref: '#/components/schemas/MigrationFinding' } }
    MigrationOptions:
      type: object
      additionalProperties: false
      required: [current, ready, options]
      properties:
        current:
          type: object
          additionalProperties: false
          required: [id, releaseNumber]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            releaseNumber: { type: integer, minimum: 1 }
        ready: { type: boolean }
        notReadyReason: { type: [string, 'null'] }
        options: { type: array, items: { $ref: '#/components/schemas/MigrationOption' } }
    ResumeRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    RetryRunRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        effectId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    ReconcileEffectRequest:
      type: object
      additionalProperties: false
      required: [resolution, evidence]
      properties:
        resolution: { type: string, enum: [confirmedApplied, confirmedNotApplied] }
        evidence:
          type: object
          additionalProperties: false
          required: [note]
          properties:
            note: { type: string, minLength: 10, maxLength: 1000 }
            remoteReference: { type: string, maxLength: 200 }
        result:
          type: object
          description: Required for confirmedApplied; keys must equal the node's resultMapping keys.
          additionalProperties: { type: [string, number, boolean] }
    Effect:
      type: object
      required: [id, nodeId, connectionKey, operation, effectClass, state, attempts, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nodeId: { type: string }
        label: { type: string }
        connectionKey: { $ref: '#/components/schemas/Key' }
        operation: { type: string }
        effectClass: { type: string, enum: [readOnly, idempotentWithKey, nonIdempotent] }
        state: { type: string, enum: [pending, inFlight, succeeded, retryableFailure, permanentFailure, unknown, notApplied] }
        attempts: { type: integer }
        lastHttpStatus: { type: [integer, 'null'] }
        lastErrorCode: { type: [string, 'null'] }
        lastErrorDetail: { type: [string, 'null'], description: 'Redacted; never contains credentials or payload values' }
        remoteReference: { type: [string, 'null'] }
        resolution: { type: [object, 'null'] }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    TaskSummary:
      type: object
      required: [id, runId, workflowName, nodeId, label, requester, candidateGroup, assignee, status, createdAt, version, priority]
      properties:
        id: { type: string }
        runId: { $ref: '#/components/schemas/Uuid' }
        runReference: { type: string, description: 'Human request reference, e.g. ORQ-1043' }
        workflowName: { type: string }
        businessKey: { type: [string, 'null'] }
        nodeId: { type: string }
        label: { type: string }
        requestTitle: { type: [string, 'null'], description: 'First text field of the request, for list display' }
        requester: { $ref: '#/components/schemas/SubjectRef' }
        candidateGroup:
          type: object
          required: [key, name]
          properties:
            key: { $ref: '#/components/schemas/Key' }
            name: { type: string }
        assignee: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        status: { type: string, enum: [open, completed, cancelled] }
        dueAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        version: { type: integer }
        priority: { type: integer, minimum: 0, maximum: 100, description: Higher values are shown first in the open queue; default 0 }
        decision: { oneOf: [{ $ref: '#/components/schemas/TaskDecision' }, { type: 'null' }] }
        stage:
          description: The stage of the workflow this step belongs to, with the request's timing for it; null when the workflow has no stages or the step is in none.
          oneOf: [{ $ref: '#/components/schemas/StageView' }, { type: 'null' }]
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [request, history, allowedActions, form]
          properties:
            request:
              type: object
              required: [input, inputSchema]
              properties:
                input: { type: object }
                inputSchema: { type: object, description: 'Pinned release schema, used for labels/formatting' }
                inputUi: { type: object }
            history: { type: array, items: { $ref: '#/components/schemas/TaskDecision' } }
            form:
              type: object
              required: [rejectReasonRequired]
              properties:
                rejectReasonRequired: { type: boolean }
                correctableFields:
                  description: Request fields the caller may correct on this task now (holder or operator, task open, not suspended); empty otherwise.
                  type: array
                  items: { type: string }
            allowedActions:
              type: object
              required: [claim, release, decide, reassign, priority]
              properties:
                claim: { $ref: '#/components/schemas/ActionAvailability' }
                release: { $ref: '#/components/schemas/ActionAvailability' }
                decide: { $ref: '#/components/schemas/ActionAvailability' }
                reassign: { $ref: '#/components/schemas/ActionAvailability' }
                priority: { $ref: '#/components/schemas/ActionAvailability' }
            completedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
    TaskPriorityRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, priority, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 0, maximum: 100 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    VersionedCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, action]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        action: { type: string, enum: [approve, reject] }
        reason: { type: string, maxLength: 1000, description: 'Required (non-blank) when action = reject' }
        comment: { type: string, maxLength: 2000 }
    TaskDecision:
      type: object
      required: [id, taskId, runId, nodeId, actor, action, decidedAt, policyFlags]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        taskId: { type: string }
        runId: { $ref: '#/components/schemas/Uuid' }
        nodeId: { type: string }
        label: { type: string }
        actor: { $ref: '#/components/schemas/SubjectRef' }
        action: { type: string, enum: [approve, reject] }
        reason: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        decidedAt: { $ref: '#/components/schemas/Timestamp' }
        policyFlags: { type: array, items: { type: string } }
    ReassignRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        assigneeSubjectId:
          description: Eligible member of the task's candidate group. Omit to return the task to the group.
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
        reason: { type: string, minLength: 1, maxLength: 500 }

    Notification:
      type: object
      required: [id, kind, message, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        runId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        runReference: { type: [string, 'null'], description: 'Human request reference of runId, e.g. ORQ-1043' }
        requestTitle: { type: [string, 'null'], description: 'Title of the request runId (see Run.requestTitle); null when the recipient may not read the request data' }
        kind: { type: string, enum: [workflowMessage, runAttention] }
        message: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        readAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }

    ConnectionSummary:
      type: object
      required: [key, name, latestVersion, versions, binding, operations]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        kind:
          type: string
          enum: [http, agent, microsoftGraph]
          description: http (default) or agent (an AI task over an MCP server, docs/build/S13-agents-mcp.md)
        latestVersion: { type: integer }
        versions: { type: array, items: { type: integer } }
        binding:
          type: object
          required: [configured, enabled]
          properties:
            configured: { type: boolean }
            enabled: { type: boolean }
            host: { type: [string, 'null'] }
        operations:
          type: array
          items:
            type: object
            required: [name, label, effectClass, testable]
            properties:
              name: { type: string }
              label: { type: string }
              effectClass: { type: string, enum: [readOnly, idempotentWithKey, nonIdempotent] }
              testable: { type: boolean }
    ConnectionDefinitionRecord:
      type: object
      required: [version, definition, definitionHash, createdAt, createdBy]
      properties:
        version: { type: integer }
        definition: { $ref: './connection-definition-v0.schema.json' }
        definitionHash: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        createdBy: { $ref: '#/components/schemas/SubjectRef' }
    ConnectionDetail:
      type: object
      required: [key, definitions, binding]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        definitions: { type: array, items: { $ref: '#/components/schemas/ConnectionDefinitionRecord' } }
        binding: { oneOf: [{ $ref: '#/components/schemas/ConnectionBinding' }, { type: 'null' }] }
    ConnectionAuth:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [none, bearerToken, apiKeyHeader] }
        headerName: { type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{0,63}$' }
        secretRef: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', description: 'Name of a mounted secret, never the secret value' }
    PutConnectionBindingRequest:
      type: object
      additionalProperties: false
      required: [baseUrl, auth, enabled]
      properties:
        baseUrl: { type: string, format: uri, maxLength: 500 }
        auth: { $ref: '#/components/schemas/ConnectionAuth' }
        enabled: { type: boolean }
    ConnectionBinding:
      type: object
      required: [connectionKey, baseUrl, auth, enabled, revision, updatedAt, updatedBy]
      properties:
        connectionKey: { $ref: '#/components/schemas/Key' }
        baseUrl: { type: string }
        auth: { $ref: '#/components/schemas/ConnectionAuth' }
        enabled: { type: boolean }
        revision: { type: integer }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        updatedBy: { $ref: '#/components/schemas/SubjectRef' }
    ConnectionTestResult:
      type: object
      required: [outcome, durationMs]
      properties:
        outcome: { type: string, enum: [succeeded, failed] }
        httpStatus: { type: [integer, 'null'] }
        durationMs: { type: integer }
        errorCode: { type: [string, 'null'], description: 'e.g. EGRESS_NOT_ALLOWED, TIMEOUT, CONNECT_FAILED, UNEXPECTED_STATUS, RESPONSE_INVALID; agents: AI_PROVIDER_UNAVAILABLE, AI_BUDGET_EXCEEDED, MCP_UNAVAILABLE, OUTPUT_INVALID' }
        detail: { type: [string, 'null'] }
        output:
          type: [object, 'null']
          description: Agent tests return the schema-valid structured result. Microsoft document tests return safe provenance including document, version or snapshot identifiers and hashes; extracted content and signed URLs are excluded.
        summary:
          type: [string, 'null']
          description: Agent test only. The business sentence the run timeline would show.

    RoleBinding:
      type: object
      required: [id, role, principal, source, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        principal: { $ref: '#/components/schemas/Principal' }
        source: { type: string, enum: [manual, seed, bootstrap] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    PermissionGrant:
      type: object
      required: [id, permission, workflowId, principal, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        permission: { type: string, enum: [workflow.start, connection.manage, message.send, document.browse, job.work] }
        workflowId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        principal: { $ref: '#/components/schemas/Principal' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    Group:
      type: object
      required: [key, name, revision]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        members:
          description: Present only for workspace.manage-access holders.
          type: array
          items: { $ref: '#/components/schemas/Principal' }
        revision: { type: integer }
    AccessOverview:
      type: object
      required: [roleBindings, grants, groups]
      properties:
        roleBindings: { type: array, items: { $ref: '#/components/schemas/RoleBinding' } }
        grants: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } }
        groups: { type: array, items: { $ref: '#/components/schemas/Group' } }
    AiProfile:
      type: object
      required: [id, label, model, variablePrice]
      properties:
        id: { type: string }
        label: { type: string }
        model: { type: string, description: 'OpenRouter model id' }
        variablePrice: { type: boolean, description: 'True for routers such as typesafe/jev-router whose price depends on the routed model' }
    AiStatus:
      type: object
      required: [enabled, profiles]
      properties:
        enabled: { type: boolean }
        reason: { type: [string, 'null'], description: 'Why AI is unavailable (no key, credentials rejected, all profiles excluded, budget exhausted)' }
        defaultProfile: { type: [string, 'null'] }
        profiles: { type: array, items: { $ref: '#/components/schemas/AiProfile' } }
        excludedModels: { type: array, items: { type: string } }
        maxPrice:
          type: object
          properties:
            promptPerMillion: { type: number }
            completionPerMillion: { type: number }
        budget:
          type: object
          properties:
            monthlyUsd: { type: number }
            spentUsd: { type: number }
        disabledProfiles:
          type: array
          description: 'Profiles paused by the circuit breaker: their router chose a model the policy refuses; paused until the next UTC midnight'
          items:
            type: object
            required: [id, label, model, reason, until]
            properties:
              id: { type: string }
              label: { type: string }
              model: { type: string, description: 'The model the router chose' }
              reason: { type: string }
              until: { $ref: '#/components/schemas/Timestamp' }
    AiDraftRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: { type: string, minLength: 10, maxLength: 4000 }
        name: { type: string, minLength: 1, maxLength: 200 }
        profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'Model profile id from getAiStatus; the default profile when omitted' }
    AiGeneration:
      type: object
      required: [profile, model, promptVersion, attempts, durationMs]
      properties:
        profile: { type: string }
        model: { type: string, description: 'Model that produced the accepted output (routers report the routed model when known)' }
        promptVersion: { type: string }
        attempts: { type: integer }
        escalated: { type: boolean }
        inputTokens: { type: [integer, 'null'] }
        outputTokens: { type: [integer, 'null'] }
        costUsd: { type: [number, 'null'], description: 'From the provider usage report; null when not reported (never shown as zero)' }
        durationMs: { type: integer }
        policyViolation: { type: [string, 'null'], description: 'Set when a router chose a model the policy refuses (excluded, not allowed, or above the price caps); the profile is then paused for the rest of the UTC day' }
    AiGenerationJob:
      type: object
      required: [id, status, startedAt, profile]
      description: An accepted AI draft generation. Poll getAiGeneration until status is succeeded or failed.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
        profile: { type: string }
        result: { $ref: '#/components/schemas/AiDraftResult' }
        problem: { $ref: '#/components/schemas/Problem' }
    AiDraftResult:
      type: object
      required: [workflow, draft, report, assumptions, missingConfiguration, generation]
      properties:
        workflow: { $ref: '#/components/schemas/Workflow' }
        draft: { $ref: '#/components/schemas/WorkflowDraft' }
        report: { $ref: '#/components/schemas/ValidationReport' }
        assumptions: { type: array, items: { type: string } }
        missingConfiguration:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message: { type: string }
              nodeId: { type: [string, 'null'] }
              code: { type: [string, 'null'] }
        generation: { $ref: '#/components/schemas/AiGeneration' }
    WorkflowExplanation:
      type: object
      required: [summary, steps, generation]
      properties:
        summary: { type: string }
        validation:
          type: object
          description: Compiler readiness for this definition against current workspace configuration; authoritative independently of AI text
          required: [publishable, issues]
          properties:
            publishable: { type: boolean }
            issues:
              type: array
              items: { $ref: '#/components/schemas/ValidationIssue' }
        steps:
          type: array
          items:
            type: object
            required: [nodeId, text]
            properties:
              nodeId: { type: string }
              text: { type: string }
        generation: { $ref: '#/components/schemas/AiGeneration' }
    CompatibilityIssue:
      type: object
      required: [sourceElementId, sourceKind, severity, reasonCode, explanation, resolutionStatus]
      properties:
        sourceElementId: { type: string }
        sourceName: { type: [string, 'null'] }
        sourceKind: { type: string }
        severity: { type: string, enum: [supported, info, review, action, blocker] }
        reasonCode: { type: string }
        explanation: { type: string }
        suggestedAction: { type: [string, 'null'] }
        targetNodeId: { type: [string, 'null'] }
        resolutionStatus: { type: string, enum: [open, resolved, acknowledged, notNeeded] }
        sourcePath: { type: [string, 'null'] }
    CompatibilityReport:
      type: object
      required: [sourceSystem, adapterVersion, sourceHash, elementCounts, issues, assumptions, publishable]
      properties:
        sourceSystem: { type: string, enum: [camunda7, camunda8, bpmn, dmn, camundaForm, pega] }
        sourceVersion: { type: [string, 'null'] }
        adapterVersion: { type: string }
        sourceHash: { type: string }
        processId: { type: [string, 'null'] }
        processName: { type: [string, 'null'] }
        elementCounts:
          type: object
          properties:
            total: { type: integer }
            supported: { type: integer }
            info: { type: integer }
            review: { type: integer, description: 'Converted items whose behaviour could differ; they never block conversion' }
            action: { type: integer }
            blocker: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/CompatibilityIssue' } }
        assumptions: { type: array, items: { type: string } }
        requiredMappings:
          type: object
          properties:
            groups: { type: array, items: { type: string } }
            approvalTasks: { type: array, items: { type: string } }
            serviceTasks: { type: array, items: { type: string } }
            childWorkflows: { type: array, items: { type: string } }
            serviceGroups:
              type: object
              description: 'Implementation key (topic:..., jobType:..., class:..., delegateExpression:..., expression:...) to the service task ids that share it; one serviceGroupMappings entry covers all of them'
              additionalProperties: { type: array, items: { type: string } }
            decisionTasks: { type: array, items: { type: string }, description: 'Business rule tasks that call a DMN decision by a literal id and need a decisionMappings entry' }
        mappingHints: { $ref: '#/components/schemas/MappingHints' }
        testCases:
          type: array
          description: 'Generated behaviour checks (DMN): the source semantics versus the converted table evaluated by the compiler'
          items: { $ref: '#/components/schemas/MigrationTestCase' }
        publishable: { type: boolean, description: 'True when no blocker, open action or unacknowledged info item remains. Review items never affect it.' }
    MappingHints:
      type: object
      description: 'Structured facts for the mapping helper (Camunda 8), keyed by source element id. Header and query parameter values, credentials and full URLs are never included.'
      properties:
        services:
          type: object
          additionalProperties:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [jobWorker, httpJson, unsupportedConnector] }
              jobType: { type: [string, 'null'] }
              suggestedOperation: { type: [string, 'null'], description: 'Operation name suggested from the step name or job type' }
              method: { type: [string, 'null'], description: 'Original HTTP method (provenance, read-only)' }
              urlHost: { type: [string, 'null'] }
              urlPath: { type: [string, 'null'], description: 'Original path without query (provenance, read-only)' }
              urlComputed: { type: boolean }
              authentication: { type: [string, 'null'], description: 'Authentication type name only' }
              headerNames: { type: array, items: { type: string } }
              queryNames: { type: array, items: { type: string } }
              resultVariable: { type: [string, 'null'] }
              inputFields: { type: object, additionalProperties: { type: string }, description: 'Request body name to request field key' }
              resultFields: { type: object, additionalProperties: { type: string }, description: 'Result name to JSON Pointer into the response body' }
              unmapped: { type: array, items: { type: string } }
              replacement: { type: [string, 'null'] }
        forms:
          type: object
          additionalProperties:
            type: object
            properties:
              target: { type: string, enum: [start, userTask] }
              formId: { type: [string, 'null'] }
              formKey: { type: [string, 'null'] }
              binding: { type: [string, 'null'] }
              state: { type: string, enum: [embedded, upload, unsupported] }
        calls:
          type: object
          additionalProperties:
            type: object
            properties:
              processId: { type: [string, 'null'] }
              binding: { type: [string, 'null'] }
              propagateAllChildVariables: { type: boolean }
              propagateAllParentVariables: { type: boolean }
              inputMapping: { type: object, additionalProperties: { type: string } }
              resultMapping: { type: object, additionalProperties: { type: string } }
        formPreviews:
          type: object
          description: 'Preview per form: embedded forms by element id, an uploaded form file by its form id'
          additionalProperties:
            type: object
            properties:
              formId: { type: [string, 'null'] }
              fields: { type: array, items: { $ref: '#/components/schemas/FormPreviewField' } }
              skipped: { type: array, items: { $ref: '#/components/schemas/FormPreviewField' } }
    FormPreviewField:
      type: object
      properties:
        id: { type: [string, 'null'] }
        key: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        component: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        widget: { type: [string, 'null'] }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }
        disposition: { type: [string, 'null'] }
        reasonCode: { type: [string, 'null'] }
    MigrationTestCase:
      type: object
      required: [decision, name, input, expected, actual, status]
      properties:
        decision: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: { type: [string, number, boolean] } }
        expected: { type: object, additionalProperties: { type: [string, number, boolean] } }
        actual: { type: object, additionalProperties: { type: [string, number, boolean] } }
        matchedRow: { type: [integer, 'null'], description: 'Zero-based row of the converted table, null when its default applied' }
        status: { type: string, enum: [passed, failed] }
    ServiceTaskMapping:
      type: object
      additionalProperties: false
      required: [connectionRef, operation, inputMapping, resultMapping]
      properties:
        connectionRef: { $ref: '#/components/schemas/Key' }
        operation: { type: string }
        inputMapping: { type: object, additionalProperties: { type: string } }
        resultMapping: { type: object, additionalProperties: { type: string } }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 30 }
        definitionVersion: { type: integer, minimum: 1, default: 1 }
    MigrationJob:
      type: object
      required: [id, fileName, status, report, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fileName: { type: string }
        status: { type: string, enum: [analyzed, converted, failed] }
        report: { $ref: '#/components/schemas/CompatibilityReport' }
        convertedWorkflowId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        sourceMap:
          type: [object, 'null']
          description: Original source identifiers or archive file dispositions mapped to target draft elements
          additionalProperties: true
    ConvertMigrationRequest:
      type: object
      additionalProperties: false
      required: [workflowKey, name]
      properties:
        workflowKey: { $ref: '#/components/schemas/Key' }
        name: { $ref: '#/components/schemas/Name' }
        groupMappings:
          type: object
          description: Camunda candidate group or assignee to workspace group key
          additionalProperties: { $ref: '#/components/schemas/Key' }
        approvalRoutes:
          type: object
          description: userTask id to the outgoing flows that mean approved and rejected
          additionalProperties:
            type: object
            additionalProperties: false
            required: [approvedFlowId, rejectedFlowId]
            properties:
              approvedFlowId: { type: string }
              rejectedFlowId: { type: string }
        serviceTaskMappings:
          type: object
          description: serviceTask id to a registered connection operation; overrides a serviceGroupMappings entry for that task
          additionalProperties: { $ref: '#/components/schemas/ServiceTaskMapping' }
        serviceGroupMappings:
          type: object
          description: 'Implementation key from requiredMappings.serviceGroups (for example topic:send-mail or class:com.example.AuditDelegate) to one mapping that covers every service task of that implementation'
          additionalProperties: { $ref: '#/components/schemas/ServiceTaskMapping' }
        decisionMappings:
          type: object
          description: 'Business rule task id to an uploaded DMN migration of this workspace; the task becomes a decision step with the converted table'
          additionalProperties:
            type: object
            additionalProperties: false
            required: [migrationId]
            properties:
              migrationId: { $ref: '#/components/schemas/Uuid' }
              decisionId: { type: string, minLength: 1, maxLength: 128, description: 'Decision of the DMN file; defaults to the id the task calls' }
              inputRef: { type: string, description: 'Field the table tests, /input/<field> or /steps/<node>/<output>; defaults to /input/<DMN input name>' }
        formMappings:
          type: object
          description: 'Start event or user task id (a linked form named in report.mappingHints.forms with state upload) to an uploaded camundaForm migration whose form id matches. A start form becomes the request form; a user task form becomes a note on the approval step.'
          additionalProperties:
            type: object
            additionalProperties: false
            required: [migrationId]
            properties:
              migrationId: { $ref: '#/components/schemas/Uuid' }
        decisionId: { type: string, minLength: 1, maxLength: 128, description: 'DMN migrations only: the decision to convert; optional when the file has exactly one decision' }
        inputSchema:
          type: object
          description: Reviewed canonical request schema; otherwise inferred from BPMN comparisons and service input mappings
          additionalProperties: true
        childWorkflowMappings:
          type: object
          description: callActivity id to a published workflow in the same workspace; publication pins its release
          additionalProperties:
            type: object
            additionalProperties: false
            required: [workflowRef, inputMapping, resultMapping]
            properties:
              workflowRef: { $ref: '#/components/schemas/Key' }
              inputMapping: { type: object, additionalProperties: { type: string } }
              resultMapping: { type: object, additionalProperties: { type: string } }
              forEach:
                type: object
                description: 'Required for a multi-instance call activity over a plain collection. The source collection has no bound, so the designer sets one (1 to 25). Mode follows the source (isSequential).'
                additionalProperties: false
                required: [itemInput, maxItems]
                properties:
                  itemInput: { type: string, description: 'Request field of the child that receives each item' }
                  maxItems: { type: integer, minimum: 1, maximum: 25 }
                  itemType: { type: string, enum: [string, integer, number, boolean], description: 'Item type of the generated collection field; not needed with an explicit inputSchema' }
              collectionMapping: { type: object, additionalProperties: { type: string }, description: 'Collected output name to a guaranteed child result (only with forEach)' }
        acknowledgeInfo: { type: boolean, default: false, description: 'Accept info-level losses such as dropped listeners' }
        acknowledgeReview: { type: boolean, default: false, description: 'Mark review items as acknowledged in the report. Review items never block conversion, with or without it.' }
