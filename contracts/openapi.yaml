    post:
      tags: [Workflows]
      operationId: postWorkflowComment
      summary: Start a thread on a step or connection of the current draft, or reply to a thread (workflow.edit or workflow.publish)
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.comment.created
      requestBody:
        required: true
