        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/path:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunPath
      summary: Where the request is - the workflow diagram with the path taken and the current steps
      description: |
        Everything the "Where is my request" diagram needs in one cheap read: the pinned release's graph (step labels,
        kinds, routes, saved layout positions; never conditions, field names or request data), the steps the request
        has passed (derived from the run events and the release graph; silent steps such as choices and parallel
        splits are inferred), which routes were taken, and the steps it is at now with their status. Same access rule
        as the run events.
      x-orqix-permission: run.read | initiator | taskParticipant
      responses:
        '200':
          description: The path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPath' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/insights/summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Insights]
      operationId: getInsightsSummary
      summary: Workflow analytics - counts, cycle times, oldest open requests, attention list and SLA view
      description: |
        Aggregates over the runs started in the date range (cards, cycle time per workflow) plus the current state of
        the workspace (oldest open, needing attention, overdue). Never contains request titles or input data; requests
        are identified by their reference only. The query has a time limit; 503 DEPENDENCY_UNAVAILABLE when exceeded.
      x-orqix-permission: run.read
      parameters:
        - $ref: '#/components/parameters/InsightsFrom'
        - $ref: '#/components/parameters/InsightsTo'
        - $ref: '#/components/parameters/InsightsWorkflowId'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/insights/throughput:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Insights]
      operationId: getInsightsThroughput
      summary: Requests started and completed per day (UTC), zero-filled
      x-orqix-permission: run.read
      parameters:
        - $ref: '#/components/parameters/InsightsFrom'
        - $ref: '#/components/parameters/InsightsTo'
        - $ref: '#/components/parameters/InsightsWorkflowId'
      responses:
        '200':
          description: One entry per day in the range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsThroughput' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/insights/steps:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Insights]
      operationId: getInsightsSteps
      summary: Bottlenecks - time waiting at each approval and wait step
      description: Steps started in the range, slowest average first. Capped at 200 rows (`truncated`).
      x-orqix-permission: run.read
      parameters:
        - $ref: '#/components/parameters/InsightsFrom'
        - $ref: '#/components/parameters/InsightsTo'
        - $ref: '#/components/parameters/InsightsWorkflowId'
      responses:
        '200':
          description: Per-step waiting time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsSteps' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Stop future progression; completed external effects are reported, not reversed
      x-orqix-permission: run.operate
      x-orqix-audit: run.cancelled
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRunRequest' }
      responses:
        '200':
          description: Cancelled (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/suspend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: suspendRun
      summary: Pause an active request without ending it
      description: >-
        Freezes the request's tasks, timers and jobs. Refused with 409 RUN_NOT_SUSPENDABLE for requests that need
        attention, child requests and requests with running child requests. Messages sent meanwhile are buffered.
      x-orqix-permission: run.operate
      x-orqix-audit: run.suspended
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRunRequest' }
      responses:
        '200':
          description: Suspended (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/signals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: sendRunSignal
      summary: Send a signal to one request
      description: >-
        docs/build/S59. Delivers the named signal to the steps ("Wait for a signal") and handlers of this request that
        are waiting for it now, oldest first. A signal never reaches another request. Refused with 409
        SIGNAL_NOT_AWAITED when nothing in the request waits for it, RUN_SUSPENDED while suspended and RUN_NOT_ACTIVE
        when the request ended or changed since it was loaded.
      x-orqix-permission: run.operate
      x-orqix-audit: run.signal-sent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRunSignalRequest' }
      responses:
        '200':
          description: Delivered (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/runs/{runId}/diagnosis:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunDiagnosis
      summary: Compare what the request shows with what the engine holds
      description: >-
        Read-only. Reports inSync, projectionDrift (open approvals, date or message waits, or external-worker steps the engine
        holds are missing from the request; repairable only when the engine state fully determines every step),
        strandedToken (the engine has a token that nothing can move; cancel only), emptyRequest, engineMissing,
        unsupported, protected (suspended) or ended.
      x-orqix-permission: run.operate
      responses:
        '200':
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDiagnosis' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/consistency-findings:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Runs]
      operationId: listConsistencyFindings
      summary: Drifted requests found by the periodic consistency scan
      description: >-
        Read-only report of the opt-in periodic scan (EX09). The scan never repairs; open the request and use the
        consistency check to rebuild or cancel. `enabled` is false when the scan is switched off.
      x-orqix-permission: run.operate
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsistencyFindings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/repair:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: repairRun
      summary: Rebuild the open steps of a request from the engine
      description: >-
        Rebuilds approvals, date and message waits and external-worker steps. Only for projectionDrift on a running or waiting request that is not suspended. The decision is re-made under
        the request lock; the engine is never triggered, skipped or modified. Refused with 409 RUN_NOT_REPAIRABLE
        otherwise, including stranded tokens, which can only be cancelled.
      x-orqix-permission: run.operate
      x-orqix-audit: run.projection-repaired
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepairRunRequest' }
      responses:
        '200':
          description: Repaired (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/resume:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: resumeRun
      summary: Continue a suspended request
      description: Timers that fell due while the request was suspended fire after it resumes.
      x-orqix-permission: run.operate
      x-orqix-audit: run.resumed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeRunRequest' }
      responses:
        '200':
          description: Resumed (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/migration-options:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRunMigrationOptions
      summary: Releases this request could move to, with the reasons it cannot move to the others
      description: >-
        Newest first, at most 20, excluding the release the request follows. `ready` is false until the request is
        suspended; the options are still listed so an operator can see what would be possible.
      x-orqix-permission: run.operate
      responses:
        '200':
          description: Migration options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationOptions' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/migrate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: migrateRun
      summary: Move a suspended request to another release of its workflow
      description: >-
        Only while the request is suspended, and only when the part of the workflow already travelled and the step it
        waits at are identical in the target release. Refused with 409 RUN_NOT_MIGRATABLE and a `findings` list
        otherwise. The request stays suspended; resume it afterwards.
      x-orqix-permission: run.operate
      x-orqix-audit: run.migrated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrateRunRequest' }
      responses:
        '200':
          description: Migrated (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/external-jobs/fetch-and-lock:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [ExternalJobs]
      operationId: fetchExternalJobs
      summary: Lease available jobs of the topics a worker serves
      description: >-
        Returns up to `maxJobs` jobs and leases each to `workerId` for at most the step's lease time. Each lease has a
        `fence` that grows with every lock; present it on every later call. Jobs of suspended or ended requests are not
        offered. High-volume protocol call: not audited individually.
      x-orqix-permission: job.work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobFetchRequest' }
      responses:
        '200':
          description: Leased jobs (possibly none)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalJobBatch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/extend-lock:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: extendExternalJobLock
      summary: Keep a lease while the work continues
      description: >-
        409 JOB_LEASE_LOST when the fence or worker no longer matches. High-volume protocol call, so it is not audited
        individually.
      x-orqix-permission: job.work
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobExtendRequest' }
      responses:
        '200':
          description: New lease end
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalJobExtendResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/await-callback:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: awaitExternalJobCallback
      summary: Hand off a leased job to a durable asynchronous callback
      description: >-
        Requires current job.work permission. Register before remote submission and retain the registration in the
        gateway's durable outbox. The callback ID is a correlation identifier, not a bearer credential; callback delivery
        must authenticate as the registering subject. The handoff fixes a deadline of 30 seconds to one day and retains
        the lease fence. Ordinary completion, failure and heartbeat are refused after handoff. Expired or superseded
        callbacks cannot change the run. Timeout or failure requires operator review and never automatically redispatches.
        Identical completed commands replay after fresh authorization, including after the deadline; changed intent conflicts.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.callback-registered
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobAwaitCallbackRequest' }
      responses:
        '200':
          description: Durable callback registration; identical retries return the original ID and deadline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalJobCallbackRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/callbacks/{callbackId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: callbackId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: completeExternalJobCallback
      summary: Deliver a typed asynchronous result
      description: >-
        Requires current job.work permission. Register before remote submission and retain the registration in the
        gateway's durable outbox. The callback ID is a correlation identifier, not a bearer credential; callback delivery
        must authenticate as the registering subject. The handoff fixes a deadline of 30 seconds to one day and retains
        the lease fence. Ordinary completion, failure and heartbeat are refused after handoff. Expired or superseded
        callbacks cannot change the run. Timeout or failure requires operator review and never automatically redispatches.
        Identical completed commands replay after fresh authorization, including after the deadline; changed intent conflicts.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.completed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobCallbackResult' }
      responses:
        '204': { description: Completed or replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/callbacks/{callbackId}/fail:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: callbackId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: failExternalJobCallback
      summary: Report a final asynchronous failure for operator review
      description: >-
        Requires current job.work permission. Register before remote submission and retain the registration in the
        gateway's durable outbox. The callback ID is a correlation identifier, not a bearer credential; callback delivery
        must authenticate as the registering subject. The handoff fixes a deadline of 30 seconds to one day and retains
        the lease fence. Ordinary completion, failure and heartbeat are refused after handoff. Expired or superseded
        callbacks cannot change the run. Timeout or failure requires operator review and never automatically redispatches.
        Identical completed commands replay after fresh authorization, including after the deadline; changed intent conflicts.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.failed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobCallbackFailure' }
      responses:
        '204': { description: Recorded or replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: completeExternalJob
      summary: Report the result of a leased job
      description: >-
        The result must be exactly the fields the step declares, with their types (422 otherwise). The request then
        continues. 409 JOB_LEASE_LOST when the lease or fence is no longer the caller's; 409 JOB_NOT_OPEN when the job or
        request has ended; 409 RUN_SUSPENDED while the request is suspended.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.completed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobCompleteRequest' }
      responses:
        '204': { description: Completed (or replay) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/external-jobs/{jobId}/fail:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: jobId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [ExternalJobs]
      operationId: failExternalJob
      summary: Report that a leased job could not be done
      description: >-
        A retryable failure returns the job to the queue after `retryAfterSeconds` (default: the workflow's retry delay)
        until the attempt limit; otherwise the request needs attention and an operator decides.
      x-orqix-permission: job.work
      x-orqix-audit: externaljob.failed
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalJobFailRequest' }
      responses:
        '204': { description: Recorded (or replay) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/retry:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: retryRun
      summary: Resume a run that needs attention when policy says retry is safe
      description: Refused with 409 EFFECT_NOT_RECONCILED while the effect outcome is unknown.
      x-orqix-permission: run.operate
      x-orqix-audit: run.retry-requested
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryRunRequest' }
      responses:
        '200':
          description: Retry scheduled (run returns to running)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/effects/{effectId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/EffectId'
    post:
      tags: [Runs]
      operationId: reconcileEffect
      summary: Record operator-verified outcome of an unknown or failed external effect
      description: |
        confirmedApplied requires the mapped result fields (validated against the operation response types) and
        resumes the run without calling the remote system again. confirmedNotApplied makes the effect eligible
        for POST /retry. Evidence is mandatory and audited.
      x-orqix-permission: run.operate
      x-orqix-audit: effect.reconciled
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileEffectRequest' }
      responses:
        '200':
          description: Effect after reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Effect' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/me/requests:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Runs]
      operationId: listMyRequests
      summary: Runs started by the caller (server forces initiator = caller)
      x-orqix-permission: workspace.member
      parameters:
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/Lifecycle' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of the caller's runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/me/notifications:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      x-orqix-permission: workspace.member
      parameters:
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's in-app notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
                  unreadCount: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Idempotently mark the caller's own notification read
      x-orqix-permission: recipient
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/me/notifications/read-all:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Idempotently mark every unread notification of the caller in this workspace read (CMP01)
      x-orqix-permission: recipient
      responses:
        '200':
          description: How many notifications changed from unread to read
          content:
            application/json:
              schema:
                type: object
                required: [markedRead]
                properties:
                  markedRead: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Tasks]
      operationId: listTasks
      x-orqix-permission: task.act
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [assigned, claimable, completed]
          description: |
            assigned = open tasks claimed by the caller; claimable = open unclaimed tasks whose candidate group
            contains the caller, excluding the caller's own requests unless self-approval is allowed;
            completed = tasks the caller decided.
        - name: sort
          in: query
          description: Open queue order; priority sorts descending then oldest first. Completed tasks retain decision order.
          schema: { type: string, enum: [priority, oldest, newest], default: priority }
        - name: minPriority
          in: query
          description: Optional open-task priority threshold; unsupported for completed tasks.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, counts]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
                  counts:
                    type: object
                    required: [assigned, claimable]
                    properties:
                      assigned: { type: integer, minimum: 0 }
                      claimable: { type: integer, minimum: 0, description: 'Exact up to 1000 and 1000 beyond (a large backlog is not counted in full on every call)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      description: Visible to eligible candidates, the assignee, past deciders, and run.read holders.
      x-orqix-permission: taskEligible | run.read
      responses:
        '200':
          description: Task with request context and the caller's allowed actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks/{taskId}/claim:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: claimTask
      x-orqix-permission: task.act + candidate
      x-orqix-audit: task.claimed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedCommand' }
      responses:
        '200':
          description: Claimed by the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/tasks/{taskId}/send-back:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: sendTaskBack
      summary: Send the request back to its requester for the fields the step declares correctable (S116)
      description: >-
        Only the eligible holder of an open task whose step declares correctable fields. At most one send-back is open
        per task; while it is open the task cannot be decided or corrected by the holder. Bumps the task version.
      x-orqix-permission: task.act + assignee
      x-orqix-audit: task.sent-back
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendBackRequest' } } } }
      responses:
        '200': { description: Task with its open send-back (or replay), content: { application/json: { schema: { $ref: '#/components/schemas/TaskDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/tasks/{taskId}/send-back/withdraw:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: withdrawTaskSendBack
      summary: Withdraw the open send-back of a task (holder or operator)
      x-orqix-permission: task.act + assignee | run.operate
      x-orqix-audit: task.send-back.withdrawn
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawSendBackRequest' } } } }
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/tasks/{taskId}/correct-input:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: correctTaskInput
      summary: Correct request fields the workflow lets the task holder correct
      description: >-
        Only the fields listed in the step's `correctable` setting, as single values, while the task is open and the
        request is not suspended. Records before and after values with the reason. A decision prepared on the old data
        is refused with 409 TASK_VERSION_CONFLICT.
      x-orqix-permission: task.act + assignee | run.operate + run.read-data
      x-orqix-audit: task.input-corrected
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectTaskInputRequest' }
      responses:
        '200':
          description: Corrected (or replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/release:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: releaseTask
      summary: Return a claimed task to its group
      x-orqix-permission: assignee
      x-orqix-audit: task.released
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedCommand' }
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/tasks/{taskId}/decision:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: decideTask
      summary: Approve or reject; exactly one decision per task wins
      x-orqix-permission: assignee + task.act
      x-orqix-audit: task.decided
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDecision' }
        '201':
          description: Decision recorded and the run continued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/priority:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      operationId: setTaskPriority
      summary: Current assignee or operator changes open task priority with a reason
      x-orqix-permission: currentAssignee + task.act | run.operate
      x-orqix-audit: task.priority-changed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPriorityRequest' }
      responses:
        '200':
          description: Priority changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/reassign:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: reassignTask
      summary: Operator reassignment to an eligible subject or back to the group
      x-orqix-permission: run.operate
      x-orqix-audit: task.reassigned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Reassigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/tasks/{taskId}/delegates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskDelegates
      summary: Eligible known colleagues for the caller's assigned task
      x-orqix-permission: task.act & currentAssignee
      responses:
        '200':
          description: Up to 100 eligible known colleagues from a bounded directory scan
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SubjectRef' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/tasks/{taskId}/delegate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: delegateTask
      summary: Current assignee delegates to an eligible colleague with a reason
      x-orqix-permission: task.act & currentAssignee
      x-orqix-audit: task.delegated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Task delegated; expectedVersion prevents repeated assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/connections/import-openapi:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Connections]
      operationId: reviewOpenApiConnection
      summary: Review a local OpenAPI file and explicitly choose operations and retry behavior
      description: No remote references or servers are fetched. Returns a candidate definition; registration and workspace binding use the existing separate APIs. Source is limited to 2 MiB UTF-8, with a 4 MiB encoded request limit.
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.openapi-reviewed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenApiReviewRequest' }
      responses:
        '200':
          description: Bounded review report and an optional candidate definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenApiReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/adapters:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listAdapters
      summary: Outbound adapter definitions (email, Teams, JDBC read, Kafka produce); never secrets
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Adapters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Adapters]
      operationId: createAdapter
      x-orqix-feature: kafka
      x-orqix-feature-when: kind kafka
      summary: Define an adapter with exact allowlists and a secret reference
      description: Closed configuration per kind; unknown fields (including anything resembling a secret) are refused. Teams base URLs pass the egress policy. Only the local stub transport exists in this build.
      x-orqix-permission: connection.manage
      x-orqix-audit: adapter.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adapter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/adapters/{adapterKey}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: adapterKey
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
    put:
      tags: [Adapters]
      operationId: updateAdapter
      x-orqix-feature: kafka
      x-orqix-feature-when: kind kafka
      summary: Edit or disable an adapter (docs/build/S73)
      description: |
        Kind and key never change. The configuration is validated exactly like on creation. `expectedVersion` must equal
        the stored version (409 CONFIGURATION_VERSION_CONFLICT otherwise). Workflow steps read the adapter again before
        every send, so disabling it or narrowing an allowlist stops later sends (the request then needs attention);
        widening an allowlist adds no recipient or topic, because those are fixed in each step.
      x-orqix-permission: connection.manage
      x-orqix-audit: adapter.updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adapter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/adapters/{adapterKey}/test-send:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: adapterKey
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}[a-z0-9]$' }
    post:
      tags: [Adapters]
      operationId: testAdapterSend
      x-orqix-feature: kafka
      x-orqix-feature-when: kind kafka
      summary: Validate a request against the adapter rules and deliver it to the local stub only
      description: No remote system is contacted; the outcome is always stubbed. Live acceptance is an external gate.
      x-orqix-permission: connection.manage
      x-orqix-audit: adapter.test-sent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdapterSendRequest' }
      responses:
        '200':
          description: Stub outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterSendResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/inbound-triggers:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listInboundTriggers
      summary: Inbound triggers; the secret reference and receive path are shown to managers only
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Triggers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTriggerList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Adapters]
      operationId: createInboundTrigger
      x-orqix-feature: kafka
      x-orqix-feature-when: source kafka
      summary: Define a signed inbound trigger that maps payload values into a workflow's start input
      description: A received event never starts a run by itself; a person with workflow.start starts it.
      x-orqix-permission: connection.manage
      x-orqix-audit: inbound.trigger-created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundTriggerCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTrigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/inbound-triggers/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: triggerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Adapters]
      operationId: updateInboundTrigger
      x-orqix-feature: kafka
      x-orqix-feature-when: source kafka
      summary: Edit or disable an inbound trigger (docs/build/S73)
      description: |
        Source, key and target workflow never change. A disabled trigger answers 404 to senders; events already received
        stay and can still be started or purged. `expectedVersion` must equal the stored version (409
        CONFIGURATION_VERSION_CONFLICT otherwise).
      x-orqix-permission: connection.manage
      x-orqix-audit: inbound.trigger-updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundTriggerUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTrigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/inbound/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: triggerId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Adapters]
      operationId: receiveInboundEvent
      x-orqix-feature: kafka
      x-orqix-feature-when: source kafka
      summary: Receive one signed event (no session or token)
      description: |
        Authenticated by `X-Orqix-Signature: sha256=<hex HMAC-SHA256(secret, timestamp + "." + rawBody)>` with
        `X-Orqix-Timestamp` (epoch seconds, within 5 minutes) and a unique `X-Orqix-Event-Id` per trigger. Bodies are
        limited to 64 KiB. Only mapped scalar values are stored; a repeated event id is acknowledged as a duplicate.
      x-orqix-permission: inboundSignature
      x-orqix-audit: inbound.received
      parameters:
        - { name: X-Orqix-Event-Id, in: header, required: true, schema: { type: string, maxLength: 100 } }
        - { name: X-Orqix-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Orqix-Signature, in: header, required: true, schema: { type: string } }
        - name: X-Orqix-Callback-Token
          in: header
          required: false
          description: S99 - resume the wait this token belongs to (only a request of the trigger's workflow) instead of recording an event.
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Accepted (or acknowledged duplicate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/inbound-events:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listInboundEvents
      summary: Received events for workflows the caller may start, newest first
      description: Mapped values are request data, so only people who can start the target workflow see the event.
      x-orqix-permission: workflow.start
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundEventList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/inbound-events/purge:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Adapters]
      operationId: purgeInboundEvents
      summary: Delete received events older than a number of days (retention, docs/build/S73)
      description: |
        Started events are always eligible; unstarted events only with `includeUnstarted`. Returns a count only; no event
        data. A purged event id that a sender repeats later is accepted as a new event.
      x-orqix-permission: connection.manage
      x-orqix-audit: inbound.events-purged
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundPurgeRequest' }
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundPurgeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/agent-write-tools:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Agent write tools]
      operationId: listAgentWriteTools
      summary: Write tools declared by agent connection versions, and their approvals (IN04, docs/build/S75)
      description: Needs connection.read, run.operate or agent.approve-write-tool. Declaring a tool or having its adapter authorizes nothing.
      x-orqix-permission: connection.read | run.operate | agent.approve-write-tool
      responses:
        '200':
          description: Declared tools and approvals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteToolOverview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/agent-write-tools/approvals:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Agent write tools]
      operationId: approveAgentWriteTool
      x-orqix-feature: agents
      summary: Approve one agent write tool for one workflow
      description: |
        Needs the grant-only permission agent.approve-write-tool (no role carries it). The approval covers exactly this
        workflow key, connection version (and its definition hash), operation and tool; a new connection version needs a
        new approval. The approver can never trigger a write through the tool: a run they started is refused. A reason is
        required (422 REASON_REQUIRED). One active approval per combination (409 DUPLICATE_KEY). Optional expiresInDays
        (1 to 90, docs/build/S85): from that instant the approval authorizes nothing, exactly like a revoked one; without
        it the approval does not expire. Approving a tool whose earlier approval expired marks that one expired.
      x-orqix-permission: agent.approve-write-tool
      x-orqix-audit: agent.write-tool.approved
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentWriteToolApproveRequest' }
      responses:
        '201':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteToolApproval' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/agent-write-tools/approvals/{approvalId}/revoke:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: approvalId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [Agent write tools]
      operationId: revokeAgentWriteTool
      summary: Revoke an approval; the next write through the tool is refused
      description: Needs agent.approve-write-tool or connection.manage. Reason required; expectedVersion must match (409 CONFIGURATION_VERSION_CONFLICT). An already revoked or expired approval is 409 CONFIGURATION_VERSION_CONFLICT.
      x-orqix-permission: agent.approve-write-tool | connection.manage
      x-orqix-audit: agent.write-tool.revoked
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentWriteToolRevokeRequest' }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteToolApproval' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/agent-writes:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Agent write tools]
      operationId: listAgentWriteCalls
      summary: Writes made through agent write tools, newest first (at most 200)
      description: Needs run.operate or agent.approve-write-tool. No message content is stored or returned. `state=unknown` lists the writes an operator must reconcile.
      x-orqix-permission: run.operate | agent.approve-write-tool
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, inFlight, succeeded, retryableFailure, permanentFailure, unknown, notApplied] }
      responses:
        '200':
          description: Writes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteCallList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/agent-write-retention:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Agent write tools]
      operationId: getAgentWriteRetention
      summary: The workspace retention setting for agent write records and how many the next sweep would remove (S85)
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: The setting (retentionDays null means write records are kept)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteRetention' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Agent write tools]
      operationId: setAgentWriteRetention
      summary: Set (1 to 3650 days) or clear how long agent write records are kept after their request ends
      description: |
        The hourly sweep deletes the write records (argument digest and size, approver, requester, reconciliation note) of
        requests that ended longer ago than this. It never removes a record of a running request, nor any record of a request
        that still has a write whose outcome is unknown or not final. Effect journal entries and audit events are kept.
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: agent.write.retention.updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAgentWriteRetention' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteRetention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/agent-writes/{writeId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: writeId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [Agent write tools]
      operationId: reconcileAgentWrite
      summary: Record what an operator found at the target for a write whose outcome is unknown
      description: |
        Needs run.operate. Only an `unknown` write (409 EFFECT_STATE_CONFLICT otherwise). `succeeded`: it was delivered and
        is reused, never resent. `notApplied`: it was not delivered; an explicit operator retry of the request may send it
        again. A reason is required (422 REASON_REQUIRED) and expectedVersion must match (409
        CONFIGURATION_VERSION_CONFLICT). The request itself is not resumed; retrying it is a separate operator action.
      x-orqix-permission: run.operate
      x-orqix-audit: agent.write.reconciled
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentWriteReconcileRequest' }
      responses:
        '200':
          description: Reconciled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWriteCall' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/inbound-events/{eventId}/start:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Adapters]
      operationId: startInboundEvent
      summary: Start a run from a received event as the signed-in person
      description: Uses the caller's own workflow.start rights. The event is locked, so it starts at most one run; a repeat returns that run.
      x-orqix-permission: workflow.start
      x-orqix-audit: inbound.event-started
      responses:
        '200':
          description: Started (or already started)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundStarted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/connections:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Connections]
      operationId: listConnections
      summary: Connection metadata and operation contracts (never secrets)
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConnectionSummary' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/connections/{connectionKey}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    get:
      tags: [Connections]
      operationId: getConnection
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Connection definitions and binding (binding visible to connection.manage only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/connections/{connectionKey}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: registerConnectionVersion
      x-orqix-feature: agents
      x-orqix-feature-when: kind agent
      summary: Register a new immutable connection definition version
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.version.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition]
              properties:
                definition: { $ref: './connection-definition-v0.schema.json' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDefinitionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/connections/{connectionKey}/binding:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    put:
      tags: [Connections]
      operationId: putConnectionBinding
      x-orqix-feature: agents
      x-orqix-feature-when: kind agent
      summary: Set this environment's endpoint and credential reference
      description: |
        The base URL host must be on the platform egress allowlist (S6). secretRef names a mounted secret; the
        secret value is never accepted or returned by the API. Creating the first binding needs no If-Match;
        replacing an existing binding requires If-Match with its ETag (428 if missing, 412 if stale).
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.binding.updated
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutConnectionBindingRequest' }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionBinding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/connections/{connectionKey}/oauth:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    get:
      tags: [Connections]
      operationId: getConnectionOAuth
      summary: Read delegated OAuth consent status
      description: >-
        Requires fresh connection.manage permission and a delegated OAuth binding. Authorization uses an exact
        connection-specific redirect URI, subject-bound expiring state and S256 PKCE. Tokens are encrypted server-side.
        An uncertain exchange is never automatically replayed; start consent again. Disconnect fences in-flight exchanges
        before optional provider revocation. Responses never include tokens, client secrets or provider response bodies.
      x-orqix-permission: connection.manage
      responses:
        '200':
          description: OAuth state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/connections/{connectionKey}/oauth/authorize:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: beginConnectionOAuth
      summary: Authorize this workspace connection with PKCE
      description: >-
        Requires fresh connection.manage permission and a delegated OAuth binding. Authorization uses an exact
        connection-specific redirect URI, subject-bound expiring state and S256 PKCE. Tokens are encrypted server-side.
        An uncertain exchange is never automatically replayed; start consent again. Disconnect fences in-flight exchanges
        before optional provider revocation. Responses never include tokens, client secrets or provider response bodies.
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.oauth.started
      responses:
        '200':
          description: OAuth state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/connections/{connectionKey}/oauth/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: finishConnectionOAuth
      summary: Consume the authenticated consent response once
      description: >-
        Requires fresh connection.manage permission and a delegated OAuth binding. Authorization uses an exact
        connection-specific redirect URI, subject-bound expiring state and S256 PKCE. Tokens are encrypted server-side.
        An uncertain exchange is never automatically replayed; start consent again. Disconnect fences in-flight exchanges
        before optional provider revocation. Responses never include tokens, client secrets or provider response bodies.
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.oauth.connected
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthFinishRequest' }
      responses:
        '200':
          description: OAuth state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/connections/{connectionKey}/oauth/disconnect:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: disconnectConnectionOAuth
      summary: Erase local credentials and attempt configured provider revocation
      description: >-
        Requires fresh connection.manage permission and a delegated OAuth binding. Authorization uses an exact
        connection-specific redirect URI, subject-bound expiring state and S256 PKCE. Tokens are encrypted server-side.
        An uncertain exchange is never automatically replayed; start consent again. Disconnect fences in-flight exchanges
        before optional provider revocation. Responses never include tokens, client secrets or provider response bodies.
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.oauth.disconnected
      responses:
        '200':
          description: OAuth state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/connections/{connectionKey}/test:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ConnectionKey'
    post:
      tags: [Connections]
      operationId: testConnection
      x-orqix-feature: agents
      x-orqix-feature-when: kind agent
      summary: Invoke a testable (readOnly) operation through the real binding and egress policy
      x-orqix-permission: connection.manage
      x-orqix-audit: connection.tested
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, operation]
              properties:
                version: { type: integer, minimum: 1 }
                operation: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,63}$' }
                input:
                  type: object
                  description: Sample input for agent or Microsoft Graph operations, validated against the operation requestSchema.
      responses:
        '200':
          description: Test outcome (a failed remote call is a 200 with outcome=failed). An agent test uses AI and is metered like any AI use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/features:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Access]
      operationId: getWorkspaceFeatures
      summary: Which product modules are switched on in this workspace (S127)
      description: |
        Every module is on until a workspace administrator switches it off. Members read this so the menu can hide
        switched-off modules; the same list is on each WorkspaceMembership of getMe as disabledFeatures.
      x-orqix-permission: workspace.member
      responses:
        '200':
          description: One entry per module, in a fixed order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFeatures' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/features/{feature}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: feature
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceFeature' }
    put:
      tags: [Access]
      operationId: setWorkspaceFeature
      summary: Switch one product module on or off for this workspace (S127)
      description: |
        Takes effect on the next request on every replica (no cache). Switching off blocks new authoring and new starts
        in the module (operations marked x-orqix-feature return 409 FEATURE_DISABLED); nothing is deleted, reads stay
        available, and work already running keeps running. Kafka triggers of the workspace pause: messages stay on the
        topic and are read when the module is switched back on. Setting the current value again changes nothing and
        writes no audit record.
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: workspace.feature.updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceFeature' }
      responses:
        '200':
          description: Saved; all modules with their current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFeatures' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/access:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Access]
      operationId: getAccessOverview
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: Role bindings, permission grants and groups of the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessOverview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/access/role-bindings:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Access]
      operationId: createRoleBinding
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.role-binding.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, principal]
              properties:
                role: { $ref: '#/components/schemas/WorkspaceRole' }
                principal: { $ref: '#/components/schemas/PrincipalRef' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/access/role-bindings/{bindingId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: bindingId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Access]
      operationId: deleteRoleBinding
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.role-binding.deleted
      responses:
        '204': { description: Deleted; cached permissions expire within 60 seconds on other pods }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/access/grants:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Access]
      operationId: createPermissionGrant
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.grant.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permission, principal]
              properties:
                permission: { type: string, enum: [workflow.start, connection.manage, message.send, document.browse, job.work, audit.read, workflow.approve-promotion, agent.approve-write-tool] }
                workflowId:
                  description: Restrict workflow.start to one workflow; omit for workspace-wide (connection.manage, message.send, document.browse and job.work are always workspace-wide).
                  oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
                principal: { $ref: '#/components/schemas/PrincipalRef' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionGrant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/access/grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: grantId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Access]
      operationId: deletePermissionGrant
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.grant.deleted
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/groups:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Access]
      operationId: listGroups
      summary: Task-assignment groups (keys and names) for the approval step picker
      description: Members are included only for workspace.manage-access holders.
      x-orqix-permission: workflow.read | workspace.manage-access
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/groups/{groupKey}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: groupKey
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Key' }
    put:
      tags: [Access]
      operationId: putGroup
      summary: Create or replace a task-assignment group and its members
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: access.group.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, members]
              properties:
                name: { $ref: '#/components/schemas/Name' }
                members: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/PrincipalRef' } }
                expectedRevision:
                  description: Required when the group exists.
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/ai/status:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [AI]
      operationId: getAiStatus
      summary: Whether AI assistance is available here, with model profiles and budget (S10)
      x-orqix-permission: workflow.read | workflow.edit | workspace.manage-access
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/ai/drafts:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [AI]
      operationId: generateAiDraft
      x-orqix-feature: ai
      summary: Start generating a workflow draft from a description (async; never publishes)
      description: |
        Checks and authorizes synchronously (400, 403, 404, 422 AI_NOT_CONFIGURED or AI_MODEL_NOT_ALLOWED, 429 budget or
        rate limit), then accepts the generation as a job and answers 202 with a Location to poll
        (getAiGeneration). An identical request with the same Idempotency-Key returns the same job (200). The outcome of
        the generation (the draft, or why it failed) is on the job.
      x-orqix-permission: workflow.edit
      x-orqix-audit: ai.draft.generated
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiDraftRequest' }
      responses:
        '200':
          description: Idempotent replay; the job as it is now
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerationJob' }
        '202':
          description: Accepted; poll the job at Location
          headers:
            Location: { description: 'URL of the job (getAiGeneration)', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/ai/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/GenerationId'
    get:
      tags: [AI]
      operationId: getAiGeneration
      summary: Poll an AI draft generation (state is shared by all instances)
      description: |
        You always see your own generations; other people's generations are visible only to holders of workflow.edit
        in the workspace (anyone else gets 404). A generation whose instance died is failed once its deadline has passed.
        Poll every 2 seconds; a generation ends in succeeded (with result) or failed (with problem).
      x-orqix-permission: workflow.read | workflow.edit
      responses:
        '200':
          description: The generation as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiGenerationJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/explain:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [AI]
      operationId: explainWorkflow
      x-orqix-feature: ai
      summary: Explain a draft revision or release in plain business language
      x-orqix-permission: workflow.read
      x-orqix-audit: ai.workflow.explained
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision: { type: integer, minimum: 1, description: 'Draft revision; omit to explain the active release' }
                profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowExplanation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/workflows/{workflowId}/ai/form-suggestions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [AI]
      operationId: suggestFormChanges
      x-orqix-feature: ai
      summary: Suggest request-form changes from a short description (reviewable, never applied by the server)
      description: >-
        S90 (G4). Sends the description and the request form as the editor shows it to the configured AI profile, then
        validates every suggested change with the workflow compiler (types, keys, choices, bounds, pattern rules).
        Valid changes are returned for review; invalid ones are listed under rejected with the reasons. Nothing is
        stored or applied: the designer applies chosen changes in the studio. Not stored; metering and audit hold
        counts only. One suggestion at a time per person (429).
      x-orqix-permission: workflow.edit
      x-orqix-audit: ai.form.suggested
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description, inputSchema]
              properties:
                description: { type: string, minLength: 10, maxLength: 2000 }
                inputSchema:
                  type: object
                  description: The request form (workflow-v0 inputSchema) as currently shown in the editor, at most 30 questions
                  required: [properties]
                  properties:
                    properties: { type: object, maxProperties: 30 }
                profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
      responses:
        '200':
          description: Validated suggestions for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiFormSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/workflows/{workflowId}/ai/draft-edits:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [AI]
      operationId: proposeDraftEdits
      x-orqix-feature: ai
      summary: Propose structured, validated edits to the current draft from a conversation turn (never applied by the server)
      description: >-
        STU02 (docs/build/S95). Sends a bounded, redacted summary of the latest draft revision, the last conversation
        turns and the author's instruction to the configured AI profile. The reply is a list of changes, each made of
        structured operations (addStep, updateStep, renameStep, removeStep, connect, disconnect, changeFormField). Every
        operation is applied in order to a candidate copy of the draft and every change is validated by the workflow
        compiler; a change that adds a blocker is listed under rejected with the compiler's reasons and is not offered.
        In regenerate mode the draft is rebuilt from the request form and the start step, and the complete proposed
        draft is returned as definition. 409 WORKFLOW_VERSION_CONFLICT (with currentRevision) when revision is not the
        latest draft revision; nothing is sent to the provider then. Not stored; metering and audit hold counts only.
        One proposal at a time per person (429).
      x-orqix-permission: workflow.edit
      x-orqix-audit: ai.draft.edits.proposed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiDraftEditRequest' }
      responses:
        '200':
          description: Validated changes for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiDraftEditProposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/ai/conversation:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [AI]
      operationId: getAiConversation
      summary: The Ask AI conversation saved with this draft (S124)
      description: Shared by the people who can edit the draft. Readable whether or not AI is switched on. version 0 and no turns when nothing is saved.
      x-orqix-permission: workflow.edit
      responses:
        '200':
          description: The saved conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [AI]
      operationId: saveAiConversation
      summary: Save the Ask AI conversation with this draft (S124)
      description: >-
        Replaces the saved conversation (last write wins). At most 40 turns and 200 kB. The text is never sent to
        audit; an empty list clears it. It is sent to the AI only as the last turns of a later proposeDraftEdits
        request.
      x-orqix-permission: workflow.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [turns]
              properties:
                turns: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/AiConversationTurn' } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [AI]
      operationId: deleteAiConversation
      summary: Clear the Ask AI conversation of this draft (S124)
      description: The act is audited without the text.
      x-orqix-permission: workflow.edit
      x-orqix-audit: ai.conversation.cleared
      responses:
        '204': { description: Cleared }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/migrations:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Migration]
      operationId: uploadMigration
      x-orqix-feature: migration
      summary: Analyze Camunda BPMN, a Pega archive, or a Pega manual mapping package
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.uploaded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileName, content]
              properties:
                fileName: { type: string, minLength: 1, maxLength: 200 }
                content: { type: string, minLength: 1, maxLength: 1398104, description: 'BPMN, DMN, CMMN or XPDL XML, form or mapping JSON text; base64 for Pega archives and native Pega rule archives. Decoded sources are limited to 1 MiB.' }
                sourceFormat: { type: string, enum: [bpmn, dmn, camundaForm, pegaArchive, pegaMapping, pegaXpdl, cmmn, pegaRules], default: bpmn, description: 'bpmn is Camunda 7/8 BPMN 2.0; dmn is a Camunda DMN 1.1-1.4 file with decision tables; camundaForm is a Camunda Forms .form JSON file attached through formMappings. pegaXpdl is a bounded XPDL 2.0 flow export; it does not resolve native RAP rule pages. cmmn inventories a CMMN 1.1 file but cannot convert or deploy it. pegaRules (base64) is a native Pega rule archive (ZIP/RAP/JAR of pagedata rule pages), decoded with a strict synthetic grammar, resolved against its own application stack and converted per starting point (docs/build/S112); grammar fidelity against genuine exports is customer qualification.' }
      responses:
        '201':
          description: Job created with its compatibility report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/migrations/{migrationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [Migration]
      operationId: getMigration
      summary: A migration job and its compatibility report
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Migration job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/migrations/{migrationId}/pega-rules:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [Migration]
      operationId: getPegaRuleArchive
      summary: Inventory, effective-rule resolution and per-rule conversion results of a native Pega rule archive (docs/build/S112)
      description: >-
        Recomputed from the immutable archive bytes. Lists every archive entry with its SHA-256 and decoded identity or refusal
        reason, the application ruleset stack, each case context's class chain with the chosen and shadowed candidates of every
        rule key, and for every starting point the compatibility report and per-rule conversion results with target fragment
        hashes. After conversion, the recorded per-rule results of the converted starting point are included. 404 for other
        source formats.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Native rule archive view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PegaRuleArchive' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/migrations/{migrationId}/case-definition:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [Migration]
      operationId: convertPegaCaseDefinition
      x-orqix-feature: [migration, cases]
      summary: Convert a native Pega case type to a CMMN case definition (docs/build/S117)
      description: >-
        Builds a CMMN case definition in the case designer's admitted subset from a case type of a native rule archive:
        stages, workflow tasks pinned to the published workflows converted from each process flow (workflowMappings),
        discretionary items for optional processes and user events for alternate stages (roleMappings), service level
        timers with deadline milestones, and typed case data fields. With dryRun the proposal is returned and checked
        against the subset; otherwise the definition is created through the case definition API, which deploys it and
        pins the workflow releases. The same request again returns the recorded definition; a different one is a conflict.
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.case.converted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegaCaseDefinitionRequest' }
      responses:
        '200':
          description: Dry run proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PegaCaseDefinitionResult' }
        '201':
          description: Case definition created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PegaCaseDefinitionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/migrations/{migrationId}/convert:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [Migration]
      operationId: convertMigration
      x-orqix-feature: migration
      summary: Apply designer mappings and create a workflow draft
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.converted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertMigrationRequest' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                required: [workflow, draft, report]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
                  draft: { $ref: '#/components/schemas/WorkflowDraft' }
                  report: { $ref: '#/components/schemas/CompatibilityReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/migrations/blueprints:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Migration]
      operationId: uploadBlueprintMigration
      x-orqix-feature: migration
      summary: Upload a Pega Blueprint PDF and transcribe it for review (docs/build/S91)
      description: >-
        The PDF (at most 25 MiB and 60 pages, starting with %PDF-) is read page by page in the isolated extraction worker:
        page text, the position and font of each text run, and the colour of small shapes such as step icons. No
        JavaScript, form action or embedded file is executed or opened, images are not decoded, and encrypted or damaged
        PDFs are refused. A layout proposes a structured transcription with source page references; every element starts
        as proposed and must be reviewed. Pega's "Application Overview Document" Blueprint export is read with the
        pega-blueprint layout (written against one genuine export), which also stores each page in reading order (stage by
        stage); other documents are read with the generic outline layout. An export can define several case types and
        one upload transcribes one: caseType names it (default the first); an unknown name is refused with the names the
        document has (400). Nothing is converted or published by this call.
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.uploaded
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: base64, contentMediaType: application/pdf }
                caseType:
                  type: string
                  maxLength: 200
                  description: Name of the case type to transcribe when the blueprint defines several (case and punctuation are ignored); the first when omitted or blank
      responses:
        '201':
          description: Job created with the findings of the proposed transcription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/migrations/{migrationId}/blueprint:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    get:
      tags: [Migration]
      operationId: getBlueprintTranscription
      summary: The current transcription of a blueprint migration with its source page texts and findings
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Current transcription revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlueprintTranscriptionView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Migration]
      operationId: saveBlueprintTranscription
      x-orqix-feature: migration
      summary: Save a reviewed or edited transcription as the next immutable revision
      description: >-
        Elements whose content differs from the extracted transcription cannot stay mapped and are stored as
        manuallyResolved. A converted blueprint can no longer change (409); a stale expectedRevision is 409.
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.blueprint.saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, transcription]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                transcription: { $ref: '#/components/schemas/BlueprintTranscription' }
      responses:
        '200':
          description: Saved revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlueprintTranscriptionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /workspaces/{workspaceId}/migrations/{migrationId}/blueprint/ai-proposal:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MigrationId'
    post:
      tags: [Migration]
      operationId: proposeBlueprintTranscription
      x-orqix-feature: [migration, ai]
      summary: Optional AI structuring of the stored page texts, returned for review and never applied
      description: >-
        Uses the workspace AI profiles, price caps and budget (docs/build/S10). Page texts are redacted and sent as
        untrusted data; the answer must be a valid transcription and every element is returned as proposed. Nothing is
        stored; the reviewer may save it as a new revision. 422 AI_NOT_CONFIGURED when AI is off.
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.blueprint.ai.proposed
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                profile: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
      responses:
        '200':
          description: Proposal for review
          content:
            application/json:
              schema:
                type: object
                required: [transcription, report, profile, model, basedOnRevision]
                properties:
                  transcription: { $ref: '#/components/schemas/BlueprintTranscription' }
                  report: { $ref: '#/components/schemas/CompatibilityReport' }
                  profile: { type: string }
                  model: { type: string }
                  basedOnRevision: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/document-sources:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
      - Connections
      operationId: listDocumentSources
      x-orqix-permission: document.browse
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DocumentSource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/document-sources/grants:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
      - Connections
      operationId: listDocumentSourceGrants
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DocumentSourceGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/document-sources/grants/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Connections
      operationId: putDocumentSourceGrant
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: document.source.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutDocumentSourceGrant'
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSourceGrant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Invalid input or stale resource revision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Invalid input or stale resource revision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /workspaces/{workspaceId}/document-sources/{sourceId}/files:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Connections
      operationId: listDocumentSourceFiles
      x-orqix-permission: document.browse
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSourceFiles'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Approved source is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /workspaces/{workspaceId}/document-sources/{sourceId}/files/{itemId}/versions:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9!._~-]+$
    get:
      tags:
      - Connections
      operationId: listDocumentSourceFileVersions
      x-orqix-permission: document.browse
      responses:
        '200':
          description: Approved document resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSourceVersions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Approved source is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /workspaces/{workspaceId}/runs/{runId}/mail:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getStageMail
      summary: Inspect stage email delivery status without message bodies or recipient addresses
      x-orqix-permission: run.operate
      responses:
        '200':
          description: Bounded delivery records, ordered by creation time and ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, event, status, attempts, createdAt, updatedAt]
                      properties:
                        id: { type: string, format: uuid }
                        event: { type: string }
                        status: { enum: [queued, providerAccepted, failed, suppressed, blocked] }
                        attempts: { type: integer, minimum: 0, maximum: 3 }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        failureCode: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /workspaces/{workspaceId}/runs/{runId}/evidence:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: exportCaseEvidence
      summary: Download ordered control evidence and a release manifest
      x-orqix-permission: audit.read
      x-orqix-audit: run.evidence-exported
      parameters:
        - in: query
          name: format
          schema: { enum: [json, csv], default: json }
      responses:
        '200':
          description: Bounded control metadata only; refuses truncation; CSV includes a manifest record
          content:
            application/json:
              schema: { type: object, required: [manifest, audit, events], additionalProperties: true }
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ORQIX_SESSION
      description: Server-side session created by OIDC authorization-code login (/oauth2/authorization/orqix).
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Machine clients may start/read runs, read run events, correlate messages and POST external-worker lease/callback operations. Issuer and audience are validated; each operation requires its current workspace permission. Other routes remain denied.

  parameters:
    CallbackToken:
      name: X-Orqix-Callback-Token
      in: header
      required: false
      description: The callback token issued once for this wait (docs/build/S98); never put it in a URL.
      schema: { type: string, maxLength: 100 }
    AppPageSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,38}[a-z0-9]$' }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GenerationId:
      name: generationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    EffectId:
      name: effectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Engine task identifier; always resolved through the workspace's task projection first.
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
    ConnectionKey:
      name: connectionKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Key' }
    DecisionKey:
      name: decisionKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Key' }
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    InsightsFrom:
      name: from
      in: query
      description: First day of the range (UTC date, inclusive). Default 29 days before `to`.
      schema: { type: string, format: date }
    InsightsTo:
      name: to
      in: query
      description: Last day of the range (UTC date, inclusive). Default today. The range may not exceed 365 days.
      schema: { type: string, format: date }
    InsightsWorkflowId:
      name: workflowId
      in: query
      description: Limit the figures to one workflow of the workspace (404 when it is not in the workspace).
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated, unique per logical command (UUID recommended). Retained 30 days.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the revision being replaced.
      schema: { type: string }

  headers:
    ETag:
      description: Strong entity tag of the returned revision, e.g. "r12".
      schema: { type: string }
    IdempotentReplayed:
      description: Present with value true when the response replays an earlier identical command.
      schema: { type: boolean }
    RetryAfter:
      description: Seconds before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Malformed request or missing Idempotency-Key
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: No valid session or token
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: The caller can see the resource but may not perform this action
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Version, idempotency or state conflict; currentVersion/currentState may be included
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    FeatureDisabled:
      description: FEATURE_DISABLED - the module named by `feature` is switched off in this workspace (S127), or another state conflict
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: Stale If-Match; currentRevision included
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: If-Match header missing
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: Body exceeds the documented limit
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Semantic validation failure (fieldErrors or issues included)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Quota or rate limit
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: A required dependency (database, engine) is unavailable; nothing was committed
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    CaseDataField:
      type: object
      additionalProperties: false
      required: [key, label, type]
      description: 'One case data field. Since docs/build/S125 it carries the same optional checks as a single-value request question (workflow-v0 formField) and is edited and rendered with the same field editor and form renderer. Every S125 property is optional, so earlier definitions read and validate as before.'
      properties:
        key: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', description: 'New keys follow the request-question pattern ^[a-z][A-Za-z0-9]{0,63}$. Keys in the older pattern (capitals first or underscores) keep working and are reported in the definition''s warnings as CASE_DATA_KEY_LEGACY.' }
        label: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [text, number, integer, boolean, date, choice] }
        required: { type: boolean, default: false }
        maxLength: { type: [integer, 'null'], minimum: 1, maximum: 4000 }
        minimum: { type: [number, 'null'], minimum: -1000000000000000, maximum: 1000000000000000 }
        maximum: { type: [number, 'null'], minimum: -1000000000000000, maximum: 1000000000000000 }
        options: { type: [array, 'null'], maxItems: 30, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 120 } }
        description: { type: string, maxLength: 500, description: 'Help text shown with the field (S125, formField description).' }
        minLength: { type: integer, minimum: 0, maximum: 4000, description: 'Text only: the shortest answer, at most maxLength (default 2000) (S125).' }
        pattern: { type: string, minLength: 2, maxLength: 200, description: 'Text only: the whole value must match this safe pattern, the same subset as formField pattern (docs/build/S90) (S125).' }
        patternMessage: { type: string, minLength: 1, maxLength: 200, description: 'Plain text shown when a value does not match pattern; only with pattern (S125).' }
        formatMinimum: { type: string, format: date, description: 'Date only: earliest allowed date, YYYY-MM-DD inclusive (S125).' }
        formatMaximum: { type: string, format: date, description: 'Date only: latest allowed date, YYYY-MM-DD inclusive (S125).' }
        multipleOf: { type: number, enum: [0.01, 1], description: 'Number or integer only: 0.01 for amounts in cents, 1 for whole numbers (S125).' }
        widget: { type: string, enum: [textarea, money], description: 'Presentation: textarea (long text) on text fields, money (USD) on number fields (S125, formField widget hint).' }
    CaseDefinitionWarning:
      type: object
      additionalProperties: false
      required: [code, field, message]
      description: 'A problem with a case definition that does not stop it from being created or used (S125).'
      properties:
        code: { type: string, enum: [CASE_DATA_KEY_LEGACY] }
        field: { type: string, description: The case data field key }
        message: { type: string }
    CaseDataValues:
      type: object
      maxProperties: 30
      additionalProperties: { type: [string, number, boolean] }
    StartCase:
      type: object
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/CaseDataValues' }
    UpdateCaseData:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, values]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        values: { $ref: '#/components/schemas/CaseDataValues' }
    CaseDataChange:
      type: object
      additionalProperties: false
      required: [version, before, after]
      properties:
        version: { type: integer, minimum: 1 }
        before: { $ref: '#/components/schemas/CaseDataValues' }
        after: { $ref: '#/components/schemas/CaseDataValues' }
    CaseData:
      type: object
      additionalProperties: false
      required: [fields, values, version, canEdit, changes]
      properties:
        viewBinding: { oneOf: [{ $ref: '#/components/schemas/PinnedCaseView' }, { type: 'null' }] }
        fields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDataField' } }
        values: { $ref: '#/components/schemas/CaseDataValues' }
        version: { type: integer, minimum: 1 }
        canEdit: { type: boolean }
        changes: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CaseDataChange' } }
    WorklistViewState:
      type: object
      additionalProperties: false
      required: [revision, binding]
      properties:
        revision: { type: integer, minimum: 0 }
        binding: { oneOf: [{ $ref: '#/components/schemas/PinnedCaseView' }, { type: 'null' }] }
    CaseViewRef:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1, maximum: 2147483647 }
    PinnedCaseView:
      type: object
      additionalProperties: false
      required: [id, version, definition]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        definition: { $ref: '#/components/schemas/ViewDefinition' }
    CreateCaseDefinition:
      type: object
      additionalProperties: false
      required: [key, name, sourceXml]
      properties:
        viewRef: { $ref: '#/components/schemas/CaseViewRef' }
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        sourceXml: { type: string, minLength: 1, maxLength: 65536, description: Bounded CMMN 1.1 XML source (64 KiB UTF-8) }
        dataFields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDataField' } }
        workflowTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        caseTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' }, description: 'One mapping per CMMN caseTask (caseRef prefix:key bound to urn:orqix:case); inputMapping is child field to parent field, resultMapping is parent field to child field or outcome' }
        decisionTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' }, description: 'One mapping per CMMN decisionTask (decision externalRef prefix:key bound to urn:orqix:decision); inputMapping is table fieldRef to case field, resultMapping is case field to table output' }
    CaseDraftDataField:
      type: object
      description: A case data field as it is being edited. The check and publishing validate it as a CaseDataField.
      maxProperties: 20
      additionalProperties: true
    CreateCaseDefinitionDraft:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        sourceXml: { type: [string, 'null'], maxLength: 65536, description: CMMN 1.1 source as far as it exists (64 KiB UTF-8) }
        designerModel: { type: [object, 'null'], additionalProperties: true, description: 'Opaque state of the case designer (plan items and options), so the designer reopens the draft as it was. The server stores it and never reads it; the CMMN source is what is checked and published.' }
        dataFields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDraftDataField' } }
        viewRef: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] }
        workflowTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        caseTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        decisionTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
    SaveCaseDefinitionDraft:
      type: object
      additionalProperties: false
      required: [expectedVersion, name]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: The draft version this content was edited from }
        name: { type: string, minLength: 1, maxLength: 200 }
        sourceXml: { type: [string, 'null'], maxLength: 65536 }
        designerModel: { type: [object, 'null'], additionalProperties: true }
        dataFields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDraftDataField' } }
        viewRef: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] }
        workflowTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        caseTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        decisionTasks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
    CaseDefinitionDraftSummary:
      type: object
      additionalProperties: false
      required: [id, key, name, version, updatedAt, publishedVersion, publishedDraftVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1, description: Draft version; every save adds one }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedVersion: { type: [integer, 'null'], minimum: 1, description: 'Current published version of this case type, if any' }
        publishedDraftVersion: { type: [integer, 'null'], minimum: 1, description: The draft version that was last published from this draft }
    CaseDefinitionDraft:
      type: object
      additionalProperties: false
      required: [id, key, name, version, sourceXml, designerModel, dataFields, viewRef, workflowTasks, caseTasks, decisionTasks, updatedAt, publishedVersion, publishedDraftVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        sourceXml: { type: [string, 'null'] }
        designerModel: { type: [object, 'null'], additionalProperties: true }
        dataFields: { type: array, items: { $ref: '#/components/schemas/CaseDraftDataField' } }
        viewRef: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] }
        workflowTasks: { type: array, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        caseTasks: { type: array, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        decisionTasks: { type: array, items: { $ref: '#/components/schemas/CaseWorkflowTaskMapping' } }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        publishedVersion: { type: [integer, 'null'], minimum: 1 }
        publishedDraftVersion: { type: [integer, 'null'], minimum: 1 }
    CaseDefinitionCheck:
      type: object
      additionalProperties: false
      required: [draftVersion, valid, issues]
      properties:
        draftVersion: { type: integer, minimum: 1, description: The saved draft version that was checked }
        valid: { type: boolean, description: True when nothing blocks publishing this draft version }
        issues:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: { type: string, description: 'The problem code publishing would answer with, for example WORKFLOW_INVALID or VALIDATION_FAILED' }
              message: { type: string }
    PublishCaseDefinitionDraft:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: The draft version that was checked }
    CaseDecisionPin:
      type: object
      additionalProperties: false
      required: [taskId, assetId, decisionKey, decisionName, decisionVersion, inputMapping, resultMapping]
      properties:
        taskId: { type: string }
        assetId: { $ref: '#/components/schemas/Uuid' }
        decisionKey: { type: string }
        decisionName: { type: string }
        decisionVersion: { type: integer, minimum: 1 }
        inputMapping: { type: object, additionalProperties: { type: string } }
        resultMapping: { type: object, additionalProperties: { type: string } }
    CaseChildPin:
      type: object
      additionalProperties: false
      required: [taskId, childDefinitionId, childKey, childName, childVersion, inputMapping, resultMapping]
      properties:
        taskId: { type: string }
        childDefinitionId: { $ref: '#/components/schemas/Uuid' }
        childKey: { type: string }
        childName: { type: string }
        childVersion: { type: integer, minimum: 1 }
        inputMapping: { type: object, additionalProperties: { type: string } }
        resultMapping: { type: object, additionalProperties: { type: string } }
    CaseWorkflowTaskMapping:
      type: object
      additionalProperties: false
      required: [taskId]
      description: Mapping of one CMMN processTask whose process names a workspace workflow (externalRef orqix:workflow:<key>).
      properties:
        taskId: { type: string, maxLength: 64 }
        inputMapping: { type: object, maxProperties: 50, description: Workflow request field to case data field, additionalProperties: { type: string } }
        resultMapping: { type: object, maxProperties: 30, description: 'Case data field to workflow result field, or outcome, outcomeKind or reference', additionalProperties: { type: string } }
    CaseWorkflowPin:
      type: object
      additionalProperties: false
      required: [taskId, workflowId, workflowKey, workflowName, releaseId, releaseNumber, inputMapping, resultMapping]
      properties:
        taskId: { type: string }
        workflowId: { $ref: '#/components/schemas/Uuid' }
        workflowKey: { type: string }
        workflowName: { type: string }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        releaseNumber: { type: integer, minimum: 1 }
        inputMapping: { type: object, additionalProperties: { type: string } }
        resultMapping: { type: object, additionalProperties: { type: string } }
    CaseWorkflowStatus:
      type: object
      additionalProperties: false
      required: [attempt, status, runId, reference, outcome, detail, caseId]
      properties:
        caseId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: The child case a case task started }
        attempt: { type: integer, minimum: 1 }
        status: { type: string, enum: [running, completed, failed, cancelled, fenced] }
        runId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reference: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
    CaseDefinition:
      type: object
      additionalProperties: false
      required: [id, key, name, version, createdAt]
      properties:
        viewBinding: { oneOf: [{ $ref: '#/components/schemas/PinnedCaseView' }, { type: 'null' }] }
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        dataFields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDataField' } }
        warnings: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDefinitionWarning' }, description: 'Included only when not empty: data field keys outside the request-question pattern (S125).' }
    CaseDefinitionDetail:
      type: object
      additionalProperties: false
      required: [id, key, name, version, createdAt, sourceXml]
      properties:
        viewBinding: { oneOf: [{ $ref: '#/components/schemas/PinnedCaseView' }, { type: 'null' }] }
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        sourceXml: { type: string }
        dataFields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDataField' } }
        workflowTasks: { type: array, items: { $ref: '#/components/schemas/CaseWorkflowPin' } }
        caseTasks: { type: array, items: { $ref: '#/components/schemas/CaseChildPin' } }
        decisionTasks: { type: array, items: { $ref: '#/components/schemas/CaseDecisionPin' } }
        warnings: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/CaseDefinitionWarning' }, description: 'Included only when not empty: data field keys outside the request-question pattern (S125).' }
    CasePlanItem:
      type: object
      additionalProperties: false
      required: [id, elementId, name, type, state, parentStageId, createdAt, endedAt, required, allowedActions]
      properties:
        id: { type: string }
        elementId: { type: string }
        name: { type: [string, 'null'] }
        type: { type: string }
        state: { type: string }
        parentStageId: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { type: [string, 'null'], format: date-time }
        required: { type: boolean }
        allowedActions: { type: object, additionalProperties: { type: boolean } }
        workflow: { oneOf: [{ $ref: '#/components/schemas/CaseWorkflowStatus' }, { type: 'null' }] }
    CaseEvent:
      type: object
      additionalProperties: false
      required: [version, action, planItemId, fromStatus, toStatus, actorId, actorName, reason, occurredAt]
      properties:
        version: { type: integer, minimum: 1 }
        action: { type: string }
        planItemId: { type: [string, 'null'] }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: string }
        actorId: { $ref: '#/components/schemas/Uuid' }
        actorName: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
    CaseCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CaseMilestone:
      type: object
      additionalProperties: false
      required: [id, elementId, name, achievedAt]
      properties:
        id: { type: string }
        elementId: { type: string }
        name: { type: [string, 'null'] }
        achievedAt: { $ref: '#/components/schemas/Timestamp' }
    CasePlanOverview:
      type: object
      additionalProperties: false
      required: [items, milestones, events, canClose]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CasePlanItem' } }
        milestones: { type: array, items: { $ref: '#/components/schemas/CaseMilestone' } }
        events: { type: array, items: { $ref: '#/components/schemas/CaseEvent' } }
        canClose: { type: boolean }
    CaseTask:
      type: object
      additionalProperties: false
      required: [id, name, status, candidateGroups, eligible]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [available] }
        candidateGroups: { type: array, items: { type: string } }
        eligible: { type: boolean }
    CaseInstance:
      type: object
      additionalProperties: false
      required: [id, definitionId, definitionVersion, status, version, tasks, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        definitionId: { $ref: '#/components/schemas/Uuid' }
        definitionVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, suspended, completed, terminated] }
        version: { type: integer, minimum: 1 }
        tasks: { type: array, items: { $ref: '#/components/schemas/CaseTask' } }
        canRead: { type: [boolean, 'null'], description: Current read eligibility after this command. False tells clients to stop automatic detail and plan reads. Null or absent is retained for older idempotency snapshots. }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    TerminateCase:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CompleteCaseTask:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    ViewField:
      type: object
      additionalProperties: false
      required: [id, label, type, binding]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [text, number, date, choice, file, row, boolean] }
        binding: { type: string, description: Typed request or task data binding }
        required: { type: boolean }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    ViewSection:
      type: object
      additionalProperties: false
      required: [id, label, columns, fields]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 200 }
        columns: { type: integer, enum: [1, 2] }
        fields: { type: array, items: { $ref: '#/components/schemas/ViewField' } }
    ViewAction:
      type: object
      additionalProperties: false
      required: [id, label, type]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [submit, saveDraft, approve, reject, requestCorrection, navigate, saveData, openTask] }
        target: { type: string, description: Same-application route for navigate action only }
    ViewPresentation:
      type: object
      additionalProperties: false
      required: [baseLocale, breakpoint, density, tone, translations]
      properties:
        baseLocale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
        breakpoint: { type: string, enum: [sm, md, lg] }
        density: { type: string, enum: [comfortable, compact] }
        tone: { type: string, enum: [brand, neutral] }
        translations:
          type: object
          maxProperties: 8
          description: Partial locale dictionaries keyed by section/field/action IDs and fieldId.option.index. Missing labels use base text. Values never change stored typed values or action grants.
          propertyNames: { pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
          additionalProperties:
            type: object
            additionalProperties: { type: string, minLength: 1, maxLength: 120 }
    ViewDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, sections, actions]
      properties:
        presentation: { $ref: '#/components/schemas/ViewPresentation' }
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [request, approval, case, worklist] }
        sections: { type: array, items: { $ref: '#/components/schemas/ViewSection' } }
        actions: { type: array, items: { $ref: '#/components/schemas/ViewAction' } }
    ViewPinItem:
      type: object
      additionalProperties: false
      required: [key, holderType, holderId, holderName, location, pinnedVersions, expected, status, problems, effect]
      properties:
        key: { type: string, maxLength: 120 }
        holderType: { type: string, enum: [workflowDraft, workflowRelease, caseDefinition, caseVersion, worklist, pageDraft, pageVersion, route] }
        holderId: { type: string }
        holderName: { type: string }
        location: { type: string }
        pinnedVersions: { type: array, items: { type: integer, minimum: 1 } }
        expected: { type: [integer, 'null'], description: 'Draft revision, case definition version or route/worklist revision the update expects' }
        status: { type: string, enum: [ready, current, newer, blocked, readOnly] }
        problems: { type: array, items: { type: string } }
        effect: { type: string, description: What applying this item does }
    ViewPinInventory:
      type: object
      additionalProperties: false
      required: [viewId, viewName, kind, latestVersion, targetVersion, planHash, items]
      properties:
        viewId: { $ref: '#/components/schemas/Uuid' }
        viewName: { type: string }
        kind: { type: string, enum: [request, approval, case, worklist, page] }
        latestVersion: { type: integer, minimum: 1 }
        targetVersion: { type: integer, minimum: 1 }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        items: { type: array, items: { $ref: '#/components/schemas/ViewPinItem' } }
    MigrateViewPins:
      type: object
      additionalProperties: false
      required: [targetVersion, planHash, items, reason]
      properties:
        targetVersion: { type: integer, minimum: 1 }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        items: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, maxLength: 120 } }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ViewPinApplied:
      type: object
      additionalProperties: false
      required: [key, holderType, holderName, outcome]
      properties:
        key: { type: string }
        holderType: { type: string }
        holderName: { type: string }
        outcome: { type: string }
    ViewPinMigration:
      type: object
      additionalProperties: false
      required: [id, targetVersion, reason, items, appliedBy, appliedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        targetVersion: { type: integer, minimum: 1 }
        reason: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ViewPinApplied' } }
        appliedBy: { $ref: '#/components/schemas/Uuid' }
        appliedAt: { $ref: '#/components/schemas/Timestamp' }
    ViewPinMigrationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ViewPinMigration' } }
    ViewSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, kind, draftRevision, publishedVersion, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        kind: { type: string, enum: [request, approval, case, worklist, page] }
        draftRevision: { type: integer, minimum: 1 }
        publishedVersion: { type: [integer, 'null'], minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ViewList:
      type: object
      additionalProperties: false
      required: [items, viewLimit]
