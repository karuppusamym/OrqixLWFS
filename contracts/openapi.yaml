                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkspaceAdminView' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      operationId: createWorkspace
      summary: Create a workspace and its first workspace administrators
      x-orqix-permission: platform.admin
      x-orqix-audit: admin.workspace.created
      requestBody:
        required: true
