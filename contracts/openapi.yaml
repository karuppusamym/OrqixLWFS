      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflow-folders/{folderId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: folderId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [Workflows]
      operationId: renameWorkflowFolder
      summary: Rename a folder (409 WORKFLOW_VERSION_CONFLICT when it changed since loaded)
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.folder.renamed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameWorkflowFolder' }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowFolder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Workflows]
      operationId: deleteWorkflowFolder
      summary: Delete a folder; its workflows become unfiled and no workflow is deleted
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.folder.deleted
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/document-templates:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listDocumentTemplates
      summary: The workspace library of document templates (latest version of each)
      x-orqix-permission: workflow.read
      parameters:
        - { name: includeArchived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Templates ordered by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplatePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workflows]
      operationId: createDocumentTemplate
      summary: Create a template with its first version (at most 200 per workspace; names unique ignoring case)
      x-orqix-permission: workflow.edit
      x-orqix-audit: document.template.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentTemplate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/document-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: templateId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [Workflows]
      operationId: getDocumentTemplate
      summary: A template with every version, newest first
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/document-templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: templateId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [Workflows]
      operationId: addDocumentTemplateVersion
      summary: Add an immutable version (409 WORKFLOW_VERSION_CONFLICT when the latest version is not the one the caller saw)
      description: A version identical to the latest and a version of an archived template are refused. A published workflow keeps the text it was published with.
      x-orqix-permission: workflow.edit
      x-orqix-audit: document.template.versioned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDocumentTemplateVersion' }
      responses:
        '201':
          description: Version added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/document-templates/{templateId}/archived:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: templateId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [Workflows]
      operationId: setDocumentTemplateArchived
      summary: Archive a template (hidden from the picker, history kept) or restore it
      x-orqix-permission: workflow.edit
      x-orqix-audit: document.template.archived
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/shared-assets:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listSharedAssets
      summary: Search shared assets (decisions, document templates, connections) by name, key or owner
      description: |
        Only the kinds the caller may read are searched (decisions and document templates need workflow.read, connections
        need connection.read); searchedKinds lists them, and a caller who may read none gets 403. q matches the name, the
        key or the owner's display name (case-insensitive substring). At most 300 results, ordered by name; truncated
        tells when there were more. Archived assets are hidden unless includeArchived is true (docs/build/S61).
      x-orqix-permission: workflow.read
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/SharedAssetKind' } }
        - { name: owner, in: query, required: false, schema: { type: string } }
        - { name: includeArchived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Matching assets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAssetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/shared-asset-owner-candidates:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listSharedAssetOwnerCandidates
      summary: People who may own an asset of this kind (they hold its manage permission today)
      description: workflow.edit for decisions and document templates, connection.manage for connections. Up to 50 people.
      x-orqix-permission: workflow.edit
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/SharedAssetKind' } }
      responses:
        '200':
          description: Up to 50 people
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SubjectRef' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/shared-assets/decision:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Workflows]
      operationId: createDecisionAsset
      summary: Create a shared decision table with its first version (at most 200 per workspace)
      description: |
        content holds hitPolicy (with aggregation or priority), rows and default exactly as in a workflow decision table, without its key and version.
        Only the structure is checked here; the compiler checks each copy in full in the workflow that uses it, because
        conditions name that workflow's fields. Keys and names are unique in the workspace. The caller becomes the owner.
      x-orqix-permission: workflow.edit
      x-orqix-audit: shared.decision.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDecisionAsset' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/shared-assets/decision/{assetKey}/versions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: assetKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    post:
      tags: [Workflows]
      operationId: addDecisionAssetVersion
      summary: Add an immutable version of a shared decision (409 WORKFLOW_VERSION_CONFLICT when the latest version is not the one the caller saw)
      description: A version identical to the latest and a version of an archived asset are refused (422). Workflows keep the version they pinned until a designer updates them.
      x-orqix-permission: workflow.edit
      x-orqix-audit: shared.decision.versioned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDecisionAssetVersion' }
      responses:
        '201':
          description: Version added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/shared-assets/decision/dmn:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Workflows]
      operationId: convertDecisionDmn
      summary: Convert a decision table of a DMN file into shared decision content for review (nothing is stored)
      description: |
        The body is the DMN file, `Content-Type: application/xml`, read like importDecisionDmn. When the file has
        several decisions and `decisionId` is absent, the result lists `decisions` with `decisionId` and `content` null so
        the caller can choose. Otherwise `content` is the converted table (structure checked like createDecisionAsset);
        create the shared decision or its next version with createDecisionAsset or addDecisionAssetVersion. `notes`
        name the parts of the file that carry no meaning for Orqix and were left out (annotations, descriptions).
      x-orqix-permission: workflow.edit
      parameters:
        - in: query
          name: decisionId
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: The converted table, or the decisions to choose from
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionDmnConversion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/shared-assets/decision/{assetKey}/versions/{version}/dmn:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: assetKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Workflows]
      operationId: exportSharedDecisionDmn
      summary: Download a version of a shared decision as a standard DMN 1.3 file (docs/build/S121)
      description: The same portable form as exportDecisionDmn, named after the shared decision.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: The DMN file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/shared-assets/{assetKind}/{assetKey}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: assetKind, in: path, required: true, schema: { $ref: '#/components/schemas/SharedAssetKind' } }
      - { name: assetKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    get:
      tags: [Workflows]
      operationId: getSharedAsset
      summary: One shared asset with every version, newest first (decision versions include their content)
      description: workflow.read for decisions and document templates, connection.read for connections.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: The asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAsset' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/shared-assets/{assetKind}/{assetKey}/usage:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: assetKind, in: path, required: true, schema: { $ref: '#/components/schemas/SharedAssetKind' } }
      - { name: assetKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    get:
      tags: [Workflows]
      operationId: getSharedAssetUsage
      summary: Where-used - workflows whose current draft or active release references the asset, with the pinned versions
      description: Needs the read permission of the asset kind and workflow.read. Archived workflows are not listed.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Referencing workflows ordered by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAssetUsage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/shared-assets/{assetKind}/{assetKey}/owner:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: assetKind, in: path, required: true, schema: { $ref: '#/components/schemas/SharedAssetKind' } }
      - { name: assetKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    put:
      tags: [Workflows]
      operationId: setSharedAssetOwner
      summary: Change the owner of a shared asset (versioned by revision; the owner gains no access)
      description: Needs the manage permission of the kind (workflow.edit, or connection.manage for connections). The new owner must be an enabled person who holds that permission now (422 otherwise). A stale expectedRevision is 409 WORKFLOW_VERSION_CONFLICT.
      x-orqix-permission: workflow.edit
      x-orqix-audit: shared.asset.owner.changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerSubjectId, expectedRevision]
              properties:
                ownerSubjectId: { $ref: '#/components/schemas/Uuid' }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/shared-assets/{assetKind}/{assetKey}/archived:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: assetKind, in: path, required: true, schema: { $ref: '#/components/schemas/SharedAssetKind' } }
      - { name: assetKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    put:
      tags: [Workflows]
      operationId: setSharedAssetArchived
      summary: Archive or restore a shared asset (versioned by revision)
      description: Archiving keeps every version and never changes a published release or a connection binding. Workflows that still reference the asset are blocked at validation and publish until it is restored or the link is removed. Needs the manage permission of the kind.
      x-orqix-permission: workflow.edit
      x-orqix-audit: shared.asset.archived
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archived, expectedRevision]
              properties:
                archived: { type: boolean }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/folder:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    put:
      tags: [Workflows]
      operationId: setWorkflowFolder
      summary: Move a workflow into a folder, or out of its folder with folderId null
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.folder.assigned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkflowFolder' }
      responses:
        '200':
          description: The workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/owner:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    put:
      tags: [Workflows]
      operationId: setWorkflowOwner
      summary: Reassign the owner to a person who can edit workflows in this workspace
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.owner.changed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkflowOwner' }
      responses:
        '200':
          description: The workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/archive:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: archiveWorkflow
      summary: Archive a workflow so it leaves the catalog, the start lists and child-workflow choices
      description: |
        Refused while requests of the workflow are still open (409 RESOURCE_IN_USE). Finished requests,
        releases and the audit trail stay readable through their own links. `restoreWorkflow` brings it back.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.archived
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveWorkflow' }
      responses:
        '204': { description: Archived }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: restoreWorkflow
      summary: Restore an archived workflow to the catalog with its folder, owner, draft and active release
      description: |
        The workflow can be started again by the same people as before archiving. 404 when the workflow is
        not archived (or does not exist); 409 WORKFLOW_VERSION_CONFLICT when the version is stale.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.restored
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreWorkflow' }
      responses:
        '200':
          description: The restored workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/discussion:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: listWorkflowDiscussion
      summary: Read threaded discussion on steps and connections (optionally one element)
      x-orqix-permission: workflow.read
      parameters:
        - name: elementId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Threads in creation order, open-thread counts for every element, and whether the caller may post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDiscussion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workflows]
      operationId: postWorkflowComment
      summary: Start a thread on a step or connection of the current draft, or reply to a thread (workflow.edit or workflow.publish)
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.comment.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostWorkflowComment' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/discussion/mention-candidates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: listWorkflowMentionCandidates
      summary: People who can be mentioned in this workflow's discussion (workflow.edit or workflow.publish to ask)
      description: >-
        CMP01 (docs/build/S87). Enabled people, other than the caller, who can read this workflow in this workspace today
        (workflow.read, computed fresh). Never lists people of other workspaces. At most 10, matched on the display name
        among the first 100 enabled people whose name contains q.
      x-orqix-permission: workflow.edit
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Up to 10 people
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SubjectRef' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/discussion/{commentId}/resolution:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - name: commentId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [Workflows]
      operationId: resolveWorkflowThread
      summary: Resolve or reopen a thread (workflow.edit or workflow.publish); repeating the same state is a no-op
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.comment.resolved
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveWorkflowThread' }
      responses:
        '200':
          description: The thread's first comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/environment:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Releases]
      operationId: getWorkspaceEnvironment
      summary: The lifecycle stage of this workspace (test or production when none was set explicitly)
      x-orqix-permission: workspace.member
      responses:
        '200':
          description: Stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvironment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Releases]
      operationId: setWorkspaceEnvironment
      summary: Set the lifecycle stage (development, test, staging, production)
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: workspace.environment.changed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceEnvironment' }
      responses:
        '200':
          description: Stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvironment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/rollout:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Releases]
      operationId: getWorkflowRollout
      summary: The workflow version and its canary, if any
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Rollout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRollout' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/canary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    put:
      tags: [Releases]
      operationId: setWorkflowCanary
      summary: Send 1 to 50 percent of new starts to another release with the same request form
      description: |
        The release must differ from the active release and have identical request fields and form layout (422
        otherwise). Setting it changes the workflow version. Selecting another active release clears the canary.
        Existing runs never move.
      x-orqix-permission: workflow.publish
      x-orqix-audit: workflow.canary.set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkflowCanary' }
      responses:
        '200':
          description: Rollout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRollout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Releases]
      operationId: clearWorkflowCanary
      summary: Stop the canary; all new starts use the active release
      x-orqix-permission: workflow.publish
      x-orqix-audit: workflow.canary.cleared
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Rollout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRollout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/workflows/{workflowId}/release-analytics:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Releases]
      operationId: getReleaseAnalytics
      summary: Runs started on each of the newest 20 releases in a window, with outcomes and average completion time
      description: Counts only; no request data. The window is the last `days` days (default 30, at most 365).
      x-orqix-permission: run.read
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: Per-release figures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseAnalytics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/promotion-check:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [Releases]
      operationId: checkReleasePromotion
      summary: Check whether a release can move to a workspace at a later stage, against the target's own bindings
      description: Read-only. Needs workflow.export here and workflow.edit in the target (same organization, later stage).
      x-orqix-permission: workflow.export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRelease' }
      responses:
        '200':
          description: Compatibility report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/promote:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [Releases]
      operationId: promoteRelease
      summary: Save the release definition as a draft in a later-stage workspace (never publishes, never copies bindings)
      description: |
        Refused with 422 WORKFLOW_INVALID when the compatibility check has blockers. When the target already has the
        workflow, expectedDraftRevision is required (412 STALE_REVISION when stale). The target publishes through its
        normal gates.
      x-orqix-permission: workflow.export
      x-orqix-audit: release.promoted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRelease' }
      responses:
        '201':
          description: Draft created in the target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePromotion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/promotions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Releases]
      operationId: listWorkflowPromotions
      summary: Promotions into this workflow, and out of it to workspaces the caller can also see (newest 50)
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Promotions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PromotionRecord' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/promotion-requests:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [Releases]
      operationId: requestReleasePromotion
      summary: Ask for approval to promote a release into a production workspace that requires it
      description: |
        Same rights and checks as promoteRelease (workflow.export here, workflow.edit in the target, a later stage,
        a compatible report). Refused with 422 when the target does not require approval. One request per workflow
        can wait in a target (409 DUPLICATE_KEY). Nothing is created in the target until a second person approves.
      x-orqix-permission: workflow.export
      x-orqix-audit: release.promotion.requested
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPromotion' }
      responses:
        '201':
          description: Request waiting for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/promotion-requests:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Releases]
      operationId: listPromotionRequests
      summary: Promotion requests addressed to this workspace (pending by default; newest 50)
      description: Visible to people who can read or edit workflows here or hold workflow.approve-promotion.
      x-orqix-permission: workflow.read
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, all] }
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PromotionRequest' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/promotion-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Releases]
      operationId: approvePromotionRequest
      summary: Approve a promotion request, which saves the draft in this workspace
      description: |
        Needs the explicit grant workflow.approve-promotion here and must be someone other than the requester
        (403 SELF_APPROVAL_DENIED). The target is checked again: an incompatible target is 422 WORKFLOW_INVALID and a
        stale draft revision is 412 STALE_REVISION; the request stays pending in both cases. Never publishes.
      x-orqix-permission: workflow.approve-promotion
      x-orqix-audit: release.promotion.approved
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionDecision' }
      responses:
        '200':
          description: Approved request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/promotion-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Releases]
      operationId: rejectPromotionRequest
      summary: Reject a promotion request with a reason
      description: Needs workflow.approve-promotion here and someone other than the requester. A reason is required (422 REASON_REQUIRED).
      x-orqix-permission: workflow.approve-promotion
      x-orqix-audit: release.promotion.rejected
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionDecision' }
      responses:
        '200':
          description: Rejected request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/promotion-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Releases]
      operationId: cancelPromotionRequest
      summary: Withdraw a promotion request that is still waiting
      x-orqix-permission: requester
      x-orqix-audit: release.promotion.cancelled
      responses:
        '200':
          description: Cancelled request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/workflows/{workflowId}/test-suite:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getWorkflowTestSuite
      summary: Read designer-only shared test samples
      x-orqix-permission: workflow.edit
      responses:
        '200':
          description: Shared suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestSuite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [Workflows]
      operationId: saveWorkflowTestSuite
      summary: Save an immutable shared test suite revision
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.tests.saved
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWorkflowTestSuite' }
      responses:
        '200':
          description: Shared suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestSuite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/test-suite/summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getWorkflowTestSummary
      summary: How many shared tests passed in the latest recorded run (counts only; informational, STU03)
      description: >
        For everyone who can read the workflow. No sample, name or expected value is returned. lastRun is the most recent
        run of the current suite version (any draft revision), or null. Publishing is still decided by the shared-test
        gate of publishDraft; this summary never blocks anything.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/simulate-cases:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: simulateWorkflowCases
      summary: Run up to 20 test cases (sample request, scenario with mocks, assertions) as dry runs in one action (STU03)
      description: >
        Same evaluation as simulateWorkflow for each case, counted as one dry run for the rate limit and audited once
        with counts only. Nothing is started, called or stored. A case whose sample request or settings do not fit is
        reported with status invalid; blocking workflow problems answer 422 WORKFLOW_INVALID. No trace is returned.
      x-orqix-permission: workflow.read
      x-orqix-audit: workflow.simulated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateCasesRequest' }
      responses:
        '200':
          description: Pass or fail per case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateCasesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/test-suite/run:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: runWorkflowTestSuite
      summary: Test the exact draft and current shared suite; retain count-only pass/fail results
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.tests.run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunWorkflowTestSuite' }
      responses:
        '200':
          description: Test report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTestReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/simulate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: simulateWorkflow
      summary: Test this workflow - a dry run of a draft revision or the active release with a sample request and a scenario (no side effects)
      description: >
        Walks the canonical definition with the same form validation, decision evaluation and condition semantics as
        production (S4 section 13). It is not the engine: nothing is started, called or stored, connections are not
        contacted and no time passes. 422 VALIDATION_FAILED for a sample request that does not fit the request form
        (field errors under /input), 422 WORKFLOW_INVALID with issues when the workflow has blocking problems,
        422 NO_ACTIVE_RELEASE for useActiveRelease on an unpublished workflow, 429 after 30 runs a minute.
      x-orqix-permission: workflow.read
      x-orqix-audit: workflow.simulated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateRequest' }
      responses:
        '200':
          description: The trace of the dry run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/workflows/{workflowId}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Releases]
      operationId: publishDraft
      summary: Revalidate an exact draft revision, deploy it and create an immutable release
      x-orqix-permission: workflow.publish
      x-orqix-audit: workflow.published
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: Idempotent replay of an earlier publish
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Releases]
      operationId: listReleases
      x-orqix-permission: workflow.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Releases, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReleaseSummary' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [Releases]
      operationId: getRelease
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Immutable release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [Releases]
      operationId: exportRelease
      summary: Secret-free bundle (canonical JSON, BPMN, DMN, manifest, source map)
      x-orqix-permission: workflow.export
      x-orqix-audit: workflow.exported
      responses:
        '200':
          description: ZIP bundle
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/export/bpmn:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [Releases]
      operationId: exportReleaseBpmn
      summary: Download a published release as a standard .bpmn file with a complete diagram (STU04, docs/build/S97)
      description: |
        The BPMN of the release exactly as deployed, plus a header comment and a complete diagram interchange section,
        as `application/xml` with a safe file name. The process itself is the stored artifact and is not changed.
        Same permission and audit as the release bundle (`workflow.export`, audit workflow.exported with the release
        number only); outsiders get 404.
      x-orqix-permission: workflow.export
      x-orqix-audit: workflow.exported
      responses:
        '200':
          description: The BPMN file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/releases/{releaseId}/decisions/{decisionKey}/dmn:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/ReleaseId'
      - $ref: '#/components/parameters/DecisionKey'
    get:
      tags: [Releases]
      operationId: exportReleaseDecisionDmn
      summary: Download a decision table of a published release as a standard DMN 1.3 file (docs/build/S121)
      description: |
        The same portable form as exportDecisionDmn, written from the table the release was published with. Same
        permission and audit as the release BPMN (`workflow.export`, audit workflow.exported with format dmn and the
        release number); outsiders get 404.
      x-orqix-permission: workflow.export
      x-orqix-audit: workflow.exported
      responses:
        '200':
          description: The DMN file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}/active-release:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Releases]
      operationId: setActiveRelease
      summary: Select the release used for new starts (rollback = select an older release)
      description: Existing runs are never moved. The release must belong to this workflow.
      x-orqix-permission: workflow.publish
      x-orqix-audit: workflow.active-release.changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [releaseId, expectedVersion]
              properties:
                releaseId: { $ref: '#/components/schemas/Uuid' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/workflows/{workflowId}/start-form:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Runs]
      operationId: getStartForm
      summary: Request form of the active release
      x-orqix-permission: workflow.start
      responses:
        '200':
          description: Start form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartForm' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/messages:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Runs]
      operationId: sendMessage
      summary: Tell waiting requests that something happened (a named message with a correlation key)
      description: |
        Delivers the message to every active request waiting at a "Wait for a message" step with the same message
        name and correlation key (at most 25). When none waits, the message is kept for a bounded time (24 hours by
        default) and given to the first wait that starts with that name and key; after that it is dropped. Never
        buffered beyond the limits (429). The payload is a flat object of scalar values (at most 16 KiB) and must match
        the values the waiting step declares (422). Machine clients with a bearer token may call it.
      x-orqix-permission: message.send
      x-orqix-audit: message.received
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Accepted (delivered to waiting requests or buffered); an idempotent replay returns the same status with the header Idempotent-Replayed true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/callback-waits:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Runs]
      operationId: listCallbackWaits
      summary: Waits answered by an external system, newest first (docs/build/S98)
      description: Ids, states and token expiry only; never a token. At most 200 rows; filter by runId.
      x-orqix-permission: run.operate
      parameters:
        - { name: runId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Callback waits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackWaitList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/callback-waits/{waitId}/token:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: waitId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Runs]
      operationId: issueCallbackToken
      summary: Issue the callback token of an open wait (shown once; replaces any earlier token)
      description: |
        The clear token is in this answer only; Orqix keeps its SHA-256. Machine clients with a run.operate grant may
        call it with a bearer token. Not to be confused with resumeRun, which lifts an operator suspension.
      x-orqix-permission: run.operate
      x-orqix-audit: callback.token-issued
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackTokenIssued' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Runs]
      operationId: revokeCallbackToken
      summary: Revoke the current callback token; the wait goes on and a new token can be issued (409 after a resume)
      x-orqix-permission: run.operate
      x-orqix-audit: callback.token-revoked
      responses:
        '204': { description: Revoked (or there was no token) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/callbacks/wait:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Runs]
      operationId: pollCallbackWait
      summary: Poll the wait a callback token belongs to (no session; the token is the credential)
      description: |
        States waiting, resumed, expired or cancelled (with reason timedOut, requestEnded or answeredElsewhere). Send
        the ETag back in If-None-Match to get 304 while nothing changed. An unknown, revoked, replaced or purged token,
        or a token of another workspace, is 404. Polls and resumes together are limited per token (default 60 a minute
        on each server; 429 with Retry-After). A closed wait is purged after the deployment's retention (default 30
        days), after which its token is unknown.
      security: []
      x-orqix-permission: callbackToken
      parameters:
        - $ref: '#/components/parameters/CallbackToken'
        - { name: If-None-Match, in: header, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Current state
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackWaitState' }
        '304': { description: Not modified since the given ETag }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/callbacks/wait/resume:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Runs]
      operationId: resumeCallbackWait
      summary: Resume the wait with a result (once; a repeat with the same key and body returns the original answer)
      description: |
        The result must match the waiting step's declared values (at most 16 KiB, flat scalars). It is delivered through
        the same path as sendMessage. 409 CALLBACK_ALREADY_RESUMED for a different key or body after a resume,
        CALLBACK_NOT_WAITING when the wait closed or the token expired, RUN_SUSPENDED while an operator suspended the
        request (repeat it after resumeRun). Counts toward the per-token limit shared with polling (429).
      security: []
      x-orqix-permission: callbackToken
      x-orqix-audit: callback.resumed
      parameters:
        - $ref: '#/components/parameters/CallbackToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallbackResumeRequest' }
      responses:
        '200':
          description: Resumed (or the replay of the original resume, with Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackResumed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/kafka-triggers:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listKafkaTriggers
      summary: Kafka consumer triggers with their status, the environment's mode and its named clusters (docs/build/S99)
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Triggers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KafkaTriggerList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Adapters]
      operationId: createKafkaTrigger
      x-orqix-feature: kafka
      summary: Consume an allow-listed topic of a named cluster to start a workflow or send a message (at most 5 per workspace)
      description: |
        The creator becomes the run-as person and must hold workflow.start for the workflow (start) or message.send
        (resume). Credentials are only a secret reference. Brokers come from deployment configuration, never from here.
      x-orqix-permission: connection.manage
      x-orqix-audit: kafka.trigger-created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KafkaTriggerCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KafkaTrigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/kafka-triggers/{kafkaTriggerId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: kafkaTriggerId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Adapters]
      operationId: updateKafkaTrigger
      x-orqix-feature: kafka
      summary: Edit, enable or disable a Kafka trigger (expectedVersion must match; enabling makes the caller the run-as person)
      x-orqix-permission: connection.manage
      x-orqix-audit: kafka.trigger-updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KafkaTriggerUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KafkaTrigger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

    delete:
      tags: [Adapters]
      operationId: deleteKafkaTrigger
      summary: Delete a Kafka trigger that is switched off, with its status and de-duplication records (dead letters go too)
      description: A trigger that is switched on is refused (409); switch it off first so no consumer is reading it.
      x-orqix-permission: connection.manage
      x-orqix-audit: kafka.trigger-deleted
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/kafka-triggers/{kafkaTriggerId}/test-message:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: kafkaTriggerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Adapters]
      operationId: sendKafkaTestMessage
      x-orqix-feature: kafka
      summary: Stub mode only - push one JSON value through the trigger's record handler without a broker
      x-orqix-permission: connection.manage
      x-orqix-audit: kafka.test-message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KafkaTestMessageRequest' }
      responses:
        '200':
          description: Handled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KafkaTestMessageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { $ref: '#/components/responses/FeatureDisabled' }

  /workspaces/{workspaceId}/kafka-dead-letters:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listKafkaDeadLetters
      summary: Kafka records that could not be handled, newest first, at most 200 (no message content)
      x-orqix-permission: run.operate
      responses:
        '200':
          description: Dead letters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KafkaDeadLetterList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/webhook-subscriptions:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listWebhookSubscriptions
      summary: Outbound webhook subscriptions (docs/build/S99); secretRef only for connection managers
      x-orqix-permission: connection.read
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Adapters]
      operationId: createWebhookSubscription
      summary: Subscribe an allow-listed HTTPS endpoint to request events (at most 10 per workspace)
      x-orqix-permission: connection.manage
      x-orqix-audit: webhook.subscription-created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/webhook-subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: subscriptionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Adapters]
      operationId: updateWebhookSubscription
      summary: Edit or disable a subscription (expectedVersion must match)
      x-orqix-permission: connection.manage
      x-orqix-audit: webhook.subscription-updated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

    delete:
      tags: [Adapters]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription that is switched off, with its delivery rows
      description: A subscription that is switched on is refused (409); switch it off first (that also stops pending deliveries).
      x-orqix-permission: connection.manage
      x-orqix-audit: webhook.subscription-deleted
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/webhook-deliveries:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Adapters]
      operationId: listWebhookDeliveries
      summary: Webhook deliveries by status (default dead letters), newest first, at most 200
      x-orqix-permission: run.operate
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, sending, delivered, dead] } }
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/webhook-deliveries/{deliveryId}/replay:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Adapters]
      operationId: replayWebhookDelivery
      summary: Put one dead letter back in the queue for an immediate attempt
      x-orqix-permission: run.operate
      x-orqix-audit: webhook.delivery-replayed
      responses:
        '200':
          description: Queued again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/runs:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Runs]
      operationId: listRuns
      summary: Runs in the workspace (operator/viewer view)
      x-orqix-permission: run.read
      parameters:
        - name: workflowId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/Lifecycle' }
        - name: outcomeKind
          in: query
          schema: { $ref: '#/components/schemas/OutcomeKind' }
        - name: businessKey
          in: query
          description: Exact business key or generated request reference (for example ORQ-1003).
          schema: { type: string, maxLength: 100 }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - name: overdue
          in: query
          description: true lists only runs with a stage that is past its due time (docs/build/S17).
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of runs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Runs]
      operationId: startRun
      summary: Start a run of the workflow's active release
      description: |
        Validates input against the active release's input schema (BigDecimal numerics), derives the initiator
        from the authenticated principal, and commits the run, the engine instance and the idempotency record
        in one transaction. 201 means durably accepted. Runs continue asynchronously after the first wait state.
      x-orqix-permission: workflow.start
      x-orqix-audit: run.started
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '201':
          description: Accepted and committed
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /workspaces/{workspaceId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      description: Readable by run.read holders, the initiator, and subjects who hold or held a task in the run.
      x-orqix-permission: run.read | initiator | taskParticipant
      responses:
        '200':
          description: Run detail; sections are omitted when the caller lacks the needed permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/send-backs:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: runId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Runs]
      operationId: listRunSendBacks
      summary: Send-backs of a request (S116), newest first; field values only for callers who may read the request data
      x-orqix-permission: initiator | taskParticipant | run.read
      responses:
        '200': { description: Send-backs, content: { application/json: { schema: { $ref: '#/components/schemas/SendBackList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/runs/{runId}/send-backs/{sendBackId}/answer:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: runId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: sendBackId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [Runs]
      operationId: answerSendBack
      summary: The requester corrects the returned fields; the send-back closes and the task version changes
      description: >-
        Only the requester, while the send-back and its task are open and the request is not suspended, with the task
        version shown. Only the returned fields, as single values, validated against the pinned form; before and after
        values are recorded. A decision prepared on the old data is refused.
      x-orqix-permission: initiator
      x-orqix-audit: task.send-back.answered
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnswerSendBackRequest' } } } }
      responses:
        '200': { description: Answered send-back (or replay), content: { application/json: { schema: { $ref: '#/components/schemas/SendBack' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/runs/{runId}/comments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: listRunComments
      summary: Read immutable comments with request-data authorization
      x-orqix-permission: run.read-data | initiator | taskParticipant
      parameters:
        - name: before
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Newest 50 comments; pass the last comment ID as before for older comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCommentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Runs]
      operationId: createRunComment
      summary: Add an immutable plain-text collaboration note
      x-orqix-permission: run.operate | initiator | taskParticipant
      x-orqix-audit: comment.created
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunComment' }
        '200':
          description: Idempotent replay of the original comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/attachment-uploads:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload a file for a request form that is not started yet
      description: |
        Multipart upload of one `file` part (docs/build/S17). The file is checked (allowed type, content signature,
        size) and kept for `expiresAt`; the request form then refers to it by `id` in a field of `format: attachment`
        and starting the request attaches it. Files that are never attached are deleted after the expiry.
      x-orqix-permission: workflow.start
      x-orqix-audit: attachment.added
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: base64, contentMediaType: application/octet-stream }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagedUpload' }
        '201':
          description: File accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagedUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/attachment-uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: uploadId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Attachments]
      operationId: discardAttachmentUpload
      summary: Remove a file chosen on a request form (own files that are not attached to a request)
      x-orqix-permission: workspace.member
      x-orqix-audit: attachment.removed
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/attachments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Attachments]
      operationId: listRunAttachments
      summary: Files of a request, including removed ones (metadata only), with the limits and what the caller may do
      description: Visible like the request data (initiator, task participants, run.read-data holders).
      x-orqix-permission: run.read-data | initiator | taskParticipant
      responses:
        '200':
          description: Files in the order they were added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      operationId: addRunAttachment
      summary: Add a file to a request in progress
      description: |
        Multipart upload: one `file` part and an optional `description` (at most 200 characters). Allowed types: PDF,
        PNG, JPEG, text, CSV, docx, xlsx, pptx (checked by name, declared type and content). At most 10 MiB per file,
        25 files and 50 MiB per request (configurable).
      x-orqix-permission: run.operate | initiator | taskParticipant
      x-orqix-audit: attachment.added
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: base64, contentMediaType: application/octet-stream }
                description: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Idempotent replay
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '201':
          description: File added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      tags: [Attachments]
      operationId: removeRunAttachment
      summary: Remove a file (soft delete - the metadata stays on the request, the bytes are deleted)
      description: The initiator while the request is in progress, and holders of run.operate at any time. Removing a removed file succeeds.
      x-orqix-permission: run.operate | initiator
      x-orqix-audit: attachment.removed
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/content:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: downloadRunAttachment
      summary: Download a file
      description: |
        Always `Content-Type: application/octet-stream` with `Content-Disposition: attachment`,
        `X-Content-Type-Options: nosniff` and `Content-Security-Policy: sandbox`; a browser never renders the file.
        Files blocked by the virus scan answer 409 ATTACHMENT_BLOCKED.
      x-orqix-permission: run.read-data | initiator | taskParticipant
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Content-Security-Policy:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/quarantine:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      tags: [Attachments]
      operationId: quarantineAttachment
      summary: Quarantine a file - download and text extraction are refused while the bytes are kept for review
      description: Needs run.operate. Quarantining a quarantined file succeeds without change. Quarantined files are never removed by retention.
      x-orqix-permission: run.operate
      x-orqix-audit: attachment.quarantined
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuarantineAttachment' }
      responses:
        '204': { description: Quarantined }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/release:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      tags: [Attachments]
      operationId: releaseAttachment
      summary: Release a quarantined file so it can be downloaded again (a file blocked by the virus scan stays blocked)
      x-orqix-permission: run.operate
      x-orqix-audit: attachment.released
      responses:
        '204': { description: Released }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/runs/{runId}/attachments/{attachmentId}/ocr:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: getAttachmentOcr
      summary: The stored text extraction of a file (404 until one was requested)
      description: Visible like the request data. The text is deleted with the file and when the file is quarantined.
      x-orqix-permission: run.read-data | initiator | taskParticipant
      responses:
        '200':
          description: The extraction result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentOcr' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Attachments]
      operationId: requestAttachmentOcr
      summary: Extract text from a file with the configured OCR provider
      description: |
        Needs run.operate and request-data visibility. The shipped provider is a local stub that reads text and CSV
        files and reports every other type as `unsupported`; no external OCR service is called. Quarantined, blocked
        and removed files are refused. A new request replaces the earlier result.
      x-orqix-permission: run.operate
      x-orqix-audit: attachment.ocr.requested
      responses:
        '200':
          description: The extraction result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentOcr' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/attachment-retention:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Attachments]
      operationId: getAttachmentRetention
      summary: The workspace file retention setting and how many files the next sweep would remove
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: The setting (retentionDays null means files are kept until removed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentRetention' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Attachments]
      operationId: setAttachmentRetention
      summary: Set (1 to 3650 days) or clear the number of days after a request ends that its files are kept
      x-orqix-permission: workspace.manage-access
