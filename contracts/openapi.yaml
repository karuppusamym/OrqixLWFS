    ViewVersionSummary:
      type: object
      additionalProperties: false
      required: [version, publishedAt]
      properties:
        version: { type: integer, minimum: 1 }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
    ViewDetail:
      type: object
      additionalProperties: false
      required: [id, name, description, draftRevision, publishedVersion, definition, versions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        draftRevision: { type: integer, minimum: 1 }
        publishedVersion: { type: [integer, 'null'], minimum: 1 }
        definition: { $ref: '#/components/schemas/LibraryViewDefinition' }
        versions: { type: array, items: { $ref: '#/components/schemas/ViewVersionSummary' } }
    ViewVersion:
      type: object
      additionalProperties: false
      required: [viewId, version, name, description, definition, publishedAt]
      properties:
        viewId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: [string, 'null'] }
        definition: { $ref: '#/components/schemas/LibraryViewDefinition' }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
    CreateView:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        definition: { $ref: '#/components/schemas/LibraryViewDefinition' }
    CopyView:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    SaveViewDraft:
      type: object
      additionalProperties: false
      required: [expectedRevision, name, definition]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        definition: { $ref: '#/components/schemas/LibraryViewDefinition' }
    PublishView:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    LibraryViewDefinition:
      description: A form view (request, approval, case or worklist) or an application page (S111).
      oneOf:
        - { $ref: '#/components/schemas/ViewDefinition' }
        - { $ref: '#/components/schemas/PageDefinition' }
    ViewElementId:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$'
    PageDefinition:
      description: >-
        Data-only application page (S111). Regions are fixed by the layout; components pin exact published view and
        extension versions; chains use the fixed server-checked step allowlist and always stop at the first failure.
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, title, context, layout, breakpoint, regions, chains]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        kind: { type: string, enum: [page] }
        title: { type: string, minLength: 1, maxLength: 120 }
        context: { type: string, enum: [none, task, case] }
        layout: { type: string, enum: [single, sidebar, split] }
        breakpoint: { type: string, enum: [sm, md, lg] }
        regions: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/PageRegion' } }
        chains: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ActionChain' } }
    PageRegion:
      type: object
      additionalProperties: false
      required: [id, label, components]
      properties:
        id: { type: string, enum: [main, side, start, end] }
        label: { type: string, minLength: 1, maxLength: 120 }
        components: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/PageComponent' } }
    PageComponent:
      description: >-
        One page component. Allowed properties depend on `type`; the server rejects properties that do not belong to it.
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id: { $ref: '#/components/schemas/ViewElementId' }
        type: { type: string, enum: [heading, text, view, list, details, actions, extension] }
        text: { type: string, minLength: 1, maxLength: 1000 }
        label: { type: string, minLength: 1, maxLength: 120 }
        view: { $ref: '#/components/schemas/CaseViewRef' }
        workflowId: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, enum: [assignedTasks, claimableTasks, myRequests, cases, task, case] }
        columns: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/PageField' } }
        fields: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/PageField' } }
        limit: { type: integer, minimum: 1, maximum: 50 }
        chains: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ViewElementId' } }
        extension: { $ref: '#/components/schemas/CaseViewRef' }
        bindings: { type: array, maxItems: 20, items: { type: string, maxLength: 72 } }
        height: { type: integer, minimum: 80, maximum: 800 }
        visibleWhen: { $ref: '#/components/schemas/PageCondition' }
    PageField:
      type: object
      additionalProperties: false
      required: [field, label]
      properties:
        field: { type: string, maxLength: 72 }
        label: { type: string, minLength: 1, maxLength: 120 }
    PageCondition:
      description: Presentation-only visibility; hiding a component never grants or denies an operation.
      type: object
      additionalProperties: false
      required: [binding, equals]
      properties:
        binding: { type: string, maxLength: 72 }
        equals: { type: [string, number, boolean] }
    ActionChain:
      type: object
      additionalProperties: false
      required: [id, label, stopOnFailure, steps]
      properties:
        id: { $ref: '#/components/schemas/ViewElementId' }
        label: { type: string, minLength: 1, maxLength: 80 }
        stopOnFailure: { type: boolean, description: Must be true; later steps never run after a failed step. }
        steps: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/ChainStep' } }
    ChainStep:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/ChainAction' }
        component: { $ref: '#/components/schemas/ViewElementId' }
        target: { type: string, maxLength: 200 }
        planItem: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9._-]{0,63}$', description: 'CMMN element id of the plan item, for startPlanItem, completePlanItem and planDiscretionaryItem; resolved in the case when the step runs' }
        occurrence: { type: string, enum: [single, newest, choose], description: 'Plan-item steps only. With several available occurrences: single stops (default), newest takes the most recently created, choose takes the one the person picked (ChainInput.planItems).' }
        compensate:
          type: string
          enum: [cancelRequest, restoreDraft, releaseTask, restoreCaseData, resumeCase, suspendCase, withdrawSendBack]
          description: >-
            The step's own inverse, run (authorized again) when a later step fails: submit→cancelRequest (needs run.operate),
            saveDraft→restoreDraft, claim→releaseTask, saveCaseData→restoreCaseData, suspendCase→resumeCase,
            resumeCase→suspendCase, sendBack→withdrawSendBack. Other steps cannot be undone. Absent means no compensation.
    ChainAction:
      type: string
      description: >-
        requestCorrection runs correctTaskInput (fields the step lets the holder correct). Case steps run the case
        lifecycle, plan-item and task-completion operations with the carried case version and the component's reason.
      enum: [submit, saveDraft, claim, requestCorrection, sendBack, approve, reject, saveCaseData, suspendCase, resumeCase, closeCase, startPlanItem, completePlanItem, planDiscretionaryItem, navigate]
    AppPageSlugValue:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,38}[a-z0-9]$'
    AppPageRoute:
      type: object
      additionalProperties: false
      required: [slug, revision, title, page, changedAt]
      properties:
        slug: { $ref: '#/components/schemas/AppPageSlugValue' }
        revision: { type: integer, minimum: 1 }
        title: { type: [string, 'null'] }
        page: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] }
        changedAt: { $ref: '#/components/schemas/Timestamp' }
    AppPageRouteList:
      type: object
      additionalProperties: false
      required: [items, canAssign]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AppPageRoute' } }
        canAssign: { type: boolean }
    AssignAppPage:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        viewRef: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] }
    AppPageHistory:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [revision, page, changedBy, changedAt]
            properties:
              revision: { type: integer, minimum: 1 }
              page: { oneOf: [{ $ref: '#/components/schemas/CaseViewRef' }, { type: 'null' }] }
              changedBy: { $ref: '#/components/schemas/Uuid' }
              changedAt: { $ref: '#/components/schemas/Timestamp' }
    AppPageRuntime:
      type: object
      additionalProperties: false
      required: [slug, revision, page, views, extensions, grants]
      properties:
        slug: { $ref: '#/components/schemas/AppPageSlugValue' }
        revision: { type: integer, minimum: 1 }
        page:
          type: object
          additionalProperties: false
          required: [id, version, definition]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            version: { type: integer, minimum: 1 }
            definition: { $ref: '#/components/schemas/PageDefinition' }
        views: { type: array, items: { $ref: '#/components/schemas/PinnedCaseView' } }
        extensions: { type: array, items: { $ref: '#/components/schemas/AppPageExtensionUse' } }
        grants: { $ref: '#/components/schemas/AppPageGrants' }
    AppPageExtensionUse:
      type: object
      additionalProperties: false
      required: [id, version, name, status, sha256, capabilities, height]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        status: { $ref: '#/components/schemas/UiExtensionStatus' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        capabilities: { $ref: '#/components/schemas/UiExtensionCapabilities' }
        height: { type: integer, minimum: 80, maximum: 800 }
    AppPageGrants:
      description: Hints for presentation; every chain step is authorized again by its own operation.
      type: object
      additionalProperties: false
      required: [startWorkflows, taskAct, readCases]
      properties:
        startWorkflows: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        taskAct: { type: boolean }
        readCases: { type: boolean }
    AppPageDraftList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [componentId, values, savedAt]
            properties:
              componentId: { $ref: '#/components/schemas/ViewElementId' }
              values: { type: object, additionalProperties: true }
              savedAt: { $ref: '#/components/schemas/Timestamp' }
    AppPageComponentData:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: { type: object, additionalProperties: true, description: Granted binding to value; bindings the caller cannot read are omitted. }
    ChainRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        context: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
        source: { $ref: '#/components/schemas/ViewElementId' }
        inputs:
          type: object
          maxProperties: 10
          additionalProperties: { $ref: '#/components/schemas/ChainInput' }
    ChainInput:
      type: object
      additionalProperties: false
      properties:
        values: { type: object, additionalProperties: true }
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 1000 }
        comment: { type: string, maxLength: 2000 }
        planItems:
          type: object
          maxProperties: 5
          description: CMMN element id to the chosen plan item, for plan-item steps whose occurrence is choose
          additionalProperties: { type: string, maxLength: 128 }
    ChainRunResult:
      type: object
      additionalProperties: false
      required: [completed, navigateTo, steps]
      properties:
        completed: { type: boolean }
        navigateTo: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, action, component, status, detail, problemCode, runId]
            properties:
              index: { type: integer, minimum: 0 }
              action: { $ref: '#/components/schemas/ChainAction' }
              component: { type: [string, 'null'] }
              status: { type: string, enum: [succeeded, failed, skipped] }
              detail: { type: [string, 'null'] }
              problemCode: { type: [string, 'null'] }
              runId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              compensation:
                description: What ran to undo this succeeded step after a later step failed; null when it declares none
                oneOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required: [action, status, detail, problemCode]
                    properties:
                      action: { type: string }
                      status: { type: string, enum: [succeeded, failed] }
                      detail: { type: [string, 'null'] }
                      problemCode: { type: [string, 'null'] }
    UiExtensionStatus:
      type: string
      enum: [pending, approved, rejected, revoked]
    UiExtensionCapabilities:
      type: object
      additionalProperties: false
      required: [bindings, actions]
      properties:
        bindings: { type: array, maxItems: 20, items: { type: string, maxLength: 72 } }
        actions: { type: array, maxItems: 15, items: { $ref: '#/components/schemas/ChainAction' } }
    UiExtensionVersionSummary:
      type: object
      additionalProperties: false
      required: [version, status, sha256, capabilities, height, submittedBy, submittedAt, decidedBy, decidedAt, decisionNote]
      properties:
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/UiExtensionStatus' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        capabilities: { $ref: '#/components/schemas/UiExtensionCapabilities' }
        height: { type: integer, minimum: 80, maximum: 800 }
        submittedBy: { $ref: '#/components/schemas/SubjectRef' }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }
        decidedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        decidedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        decisionNote: { type: [string, 'null'] }
    UiExtension:
      type: object
      additionalProperties: false
      required: [id, name, description, createdAt, versions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        versions: { type: array, items: { $ref: '#/components/schemas/UiExtensionVersionSummary' } }
    UiExtensionList:
      type: object
      additionalProperties: false
      required: [items, canApprove]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UiExtension' } }
        canApprove: { type: boolean }
    UiExtensionVersion:
      type: object
      additionalProperties: false
      required: [extensionId, name, source, version, status, sha256, capabilities, height, submittedBy, submittedAt, decidedBy, decidedAt, decisionNote, entry, files]
      properties:
        entry: { type: [string, 'null'], description: Module the frame loads from the bundle's files (S116) }
        files:
          type: array
          description: Bundle files with the SHA-256 recorded at submission; the version hash covers them all
          items:
            type: object
            additionalProperties: false
            required: [path, contentType, size, sha256]
            properties:
              path: { type: string }
              contentType: { type: string }
              size: { type: integer, minimum: 1 }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        extensionId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        source: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/UiExtensionStatus' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        capabilities: { $ref: '#/components/schemas/UiExtensionCapabilities' }
        height: { type: integer, minimum: 80, maximum: 800 }
        submittedBy: { $ref: '#/components/schemas/SubjectRef' }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }
        decidedBy: { oneOf: [{ $ref: '#/components/schemas/SubjectRef' }, { type: 'null' }] }
        decidedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        decisionNote: { type: [string, 'null'] }
    CreateUiExtension:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300 }
    SubmitUiExtensionVersion:
      type: object
      additionalProperties: false
      required: [capabilities, height]
      properties:
        source: { type: string, maxLength: 65536, description: Inline classic script; may be empty when an entry module is named }
        capabilities: { $ref: '#/components/schemas/UiExtensionCapabilities' }
        height: { type: integer, minimum: 80, maximum: 800 }
        entry: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,60}\.(js|mjs)$', description: The module the frame loads (one of files) }
        files:
          type: array
          maxItems: 30
          description: 'JavaScript modules, stylesheets, fonts and images (flat names, no SVG), 1 byte to 256 KiB each, 1 MiB in all; imports resolve only inside the bundle'
          items:
            type: object
            additionalProperties: false
            required: [path, content]
            properties:
              path: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,60}\.(js|mjs|css|woff2|woff|png|jpg|jpeg|webp|gif)$' }
              content: { type: string, maxLength: 349528, description: Base64 file bytes }
    UiExtensionDecision:
      type: object
      additionalProperties: false
      required: [decision, note, expectedStatus]
      properties:
        decision: { type: string, enum: [approve, reject, revoke] }
        note: { type: string, minLength: 1, maxLength: 500 }
        expectedStatus: { $ref: '#/components/schemas/UiExtensionStatus' }
    CorrectRunInputRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, changes]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        changes:
          type: object
          minProperties: 1
          maxProperties: 30
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
    RunInputCorrection:
      type: object
      additionalProperties: false
      required: [runId, version, fields, replayed]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        fields: { type: integer, minimum: 1, maximum: 30 }
        replayed: { type: boolean }
    MigrationPolicy:
      type: object
      additionalProperties: false
      required:
      - required
      - version
      - reason
      - updatedAt
      properties:
        required:
          type: boolean
        version: &id001
          type: integer
          minimum: 0
        reason: &id003
          type:
          - string
          - 'null'
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    MigrationPolicyRequest:
      type: object
      additionalProperties: false
      required:
      - required
      - expectedVersion
      - reason
      properties:
        required:
          type: boolean
        expectedVersion: *id001
        reason: &id002
          type: string
          minLength: 1
          maxLength: 1000
    MigrationReviewRequest:
      type: object
      additionalProperties: false
      required:
      - draftRevision
      - expectedVersion
      - reason
      properties:
        draftRevision:
          type: integer
          minimum: 1
        expectedVersion: *id001
        reason: *id002
    MigrationReview:
      type: object
      additionalProperties: false
      required:
      - migration
      - required
      - draftRevision
      - definitionHash
      - sourceHash
      - mappingsHash
      - mapper
      - reviewedBy
      - reviewedAt
      - reviewReason
      - reviewVersion
      - approved
      - canApprove
      - detail
      properties:
        migration:
          type: boolean
        required:
          type: boolean
        draftRevision:
          type: integer
        definitionHash: &id004
          type: string
        sourceHash: *id003
        mappingsHash: *id003
        mapper:
          oneOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        reviewedBy:
          oneOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        reviewReason: *id003
        reviewVersion: *id001
        approved:
          type: boolean
        canApprove:
          type: boolean
        detail: *id004
    UploadMigrationProjectRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
            - fileName
            - content
            properties:
              fileName:
                type: string
                minLength: 1
                maxLength: 200
              content:
                type: string
                minLength: 1
                maxLength: 1048576
              sourceFormat:
                type: string
                description: 'Optional format hint. BPMN and single-decision DMN files are supported; form files produce a project blocker. XML roots determine the format when omitted.'
                enum:
                - bpmn
                - dmn
                - form
    MigrationProject:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      - files
      - conversionOrder
      - issues
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name: *id004
        status:
          type: string
          enum:
          - analyzed
          - blocked
          - converting
          - converted
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - fileName
            - migrationId
            - processId
            - dependencies
            - status
            - convertedWorkflowId
            properties:
              fileName: *id004
              migrationId:
                oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
              processId: *id003
              sourceFormat:
                description: 'Detected XML source kind; null for an unsupported or unreadable source. Omitted on older stored projects.'
                type: [string, 'null']
                enum: [bpmn, dmn, null]
              decisionIds:
                description: 'DMN decision identifiers declared by this file. Omitted on older stored projects.'
                type: array
                items: *id004
              decisionDependencies:
                description: 'BPMN business-rule task IDs mapped to referenced DMN decision IDs. Omitted on older stored projects.'
                type: object
                additionalProperties:
                  type: string
              dependencies:
                type: array
                items: *id004
              status:
                type: string
                enum:
                - analyzed
                - converted
                - failed
                - blocked
              convertedWorkflowId:
                oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
        conversionOrder:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - fileName
            - code
            - detail
            properties:
              fileName: *id004
              code: *id004
              detail: *id004
