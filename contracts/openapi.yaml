openapi: 3.1.1
info:
  title: Orqix API
  version: 0.1.0-r0
  summary: R0 contract for the purchase-approval vertical slice.
  description: |
    Contract-first API for Orqix R0. This file is authoritative: the frontend generates its types from it and
    backend integration tests validate every response against it. Rules that apply to every operation are in
    docs/build/S3-api.md; this summary is normative:

    * Authentication: browser clients use the session cookie set after OIDC login. Machine clients (start/read
      runs only in R0) use a bearer access token validated as an OAuth2 resource server.
    * CSRF: every POST/PUT/DELETE from a browser session must send `X-XSRF-TOKEN` matching the `XSRF-TOKEN` cookie.
    * Authorization: `x-orqix-permission` names the permission checked against the stored resource's workspace.
      A caller who cannot read the resource receives 404, never 403 (no cross-workspace existence disclosure).
    * Idempotency: operations declaring the `Idempotency-Key` parameter require it. Same principal + key + payload
      replays the original result (200 + `Idempotent-Replayed: true`); a different payload returns 409
      IDEMPOTENCY_KEY_REUSED. Keys are retained 30 days. Authorization is rechecked on replay.
    * Concurrency: drafts use `ETag`/`If-Match`; tasks, workflows and runs use `expectedVersion` in the body.
    * Errors: RFC 9457 `application/problem+json` with the extension members `code` and `correlationId`.
    * Lists: cursor pagination, `limit` 1–100 (default 25). Cursors are opaque and expire with their data.
    * `x-orqix-audit` names the audit action written for the operation (success, denial and failure).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Identity
  - name: Administration
  - name: Workflows
  - name: Releases
  - name: Runs
  - name: Tasks
  - name: Notifications
  - name: Connections
  - name: Adapters
  - name: Access
  - name: AI
  - name: Migration
  - name: Conversation
  - name: Insights
  - name: Attachments

paths:
  /workspaces/{workspaceId}/runs/{runId}/correct-input:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: correctRunInput
      summary: Correct explicitly editable input before prior data consumption
      description: Requires fresh run.operate and request-data visibility. Only needsAttention runs without effects, active jobs/timers or preceding data consumers can be corrected. Updates projection and process input atomically; does not retry. Values and reason in the timeline require request-data permission; audit stores counts/version only.
      x-orqix-permission: run.operate
      x-orqix-audit: run.input-corrected
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectRunInputRequest' }
      responses:
        '200':
          description: Corrected, or stable acceptance metadata on an identical replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInputCorrection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/migration-policy:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
      - Migrations
      operationId: getMigrationPolicy
      x-orqix-permission: workspace.manage-access
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags:
      - Migrations
      operationId: setMigrationPolicy
      x-orqix-permission: workspace.manage-access
      x-orqix-audit: migration.policy.changed
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationPolicyRequest'
  /workspaces/{workspaceId}/workflows/{workflowId}/migration-review:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - $ref: '#/components/parameters/WorkflowId'
    get:
      tags:
      - Migrations
      operationId: getMigrationReview
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - Migrations
      operationId: approveMigrationReview
      x-orqix-permission: workflow.publish
      x-orqix-audit: migration.review.approved
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationReviewRequest'
  /workspaces/{workspaceId}/migrations/projects:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
      - Migrations
      operationId: uploadMigrationProject
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.project.created
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadMigrationProjectRequest'
  /workspaces/{workspaceId}/migrations/projects/{projectId}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    get:
      tags:
      - Migrations
      operationId: getMigrationProject
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /workspaces/{workspaceId}/migrations/projects/{projectId}/convert-next:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    - name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    post:
      tags:
      - Migrations
      operationId: convertMigrationProjectNext
      x-orqix-permission: workflow.edit
      x-orqix-audit: migration.converted
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationProjectConversion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertMigrationProjectRequest'

  /workspaces/{workspaceId}/conversations/messages:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Conversation]
      operationId: sendConversationMessage
      summary: Collect request fields or review an authorized task action in a resumable guided conversation
      x-orqix-permission: workspace.member + underlying action permission
      x-orqix-audit: conversation.message
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageRequest' }
      responses:
        '200':
          description: Conversation reply; confirm explicitly to execute a reviewed action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspaceId}/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [Conversation]
      operationId: getConversation
      summary: Resume your own workspace conversation
      x-orqix-permission: workspace.member + conversation.author
      responses:
        '200':
          description: Current conversation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Current subject, workspaces and effective permissions
      x-orqix-permission: authenticated
      responses:
        '200':
          description: Current subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/organizations:
    get:
      tags: [Administration]
      operationId: listOrganizations
      x-orqix-permission: platform.admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Organization' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      operationId: createOrganization
      x-orqix-permission: platform.admin
      x-orqix-audit: admin.organization.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, name]
              properties:
                key: { $ref: '#/components/schemas/Key' }
                name: { $ref: '#/components/schemas/Name' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/workspaces:
    get:
      tags: [Administration]
      operationId: listWorkspacesAdmin
      x-orqix-permission: platform.admin
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspaces (metadata only, no business data)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkspaceAdminView' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      operationId: createWorkspace
      summary: Create a workspace and its first workspace administrators
      x-orqix-permission: platform.admin
      x-orqix-audit: admin.workspace.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceAdminView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Identity]
      operationId: getWorkspace
      x-orqix-permission: workspace.member
      responses:
        '200':
          description: Workspace with the caller's effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMembership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/templates:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listTemplates
      x-orqix-permission: workflow.edit
      responses:
        '200':
          description: Built-in templates available for new drafts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Template' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: Workflows visible to the caller
      description: Callers with only workflow.start see workflows with an active release they may start.
      x-orqix-permission: workflow.read | workflow.start
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: startable
          in: query
          description: Only workflows the caller may start now.
          schema: { type: boolean, default: false }
        - name: folder
          in: query
          description: A folder ID, or none for unfiled workflows. Requires workflow.read; it only narrows the list.
          schema: { type: string, maxLength: 36 }
        - name: owner
          in: query
          description: A subject ID. Requires workflow.read; it only narrows the list.
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of workflow summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkflowSummary' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Create a workflow with draft revision 1, optionally from a template
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkflowRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflows/{workflowId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getWorkflow
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/draft:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getDraft
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Latest draft revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Workflows]
      operationId: saveDraft
      summary: Save a new draft revision
      description: |
        Accepts structurally incomplete drafts (work in progress) within size/depth limits; full validation is
        POST /validate. Rejects unknown schemaVersion and documents over 256 KiB or deeper than 32 levels.
        Saving never changes a published release.
      x-orqix-permission: workflow.edit
      x-orqix-audit: workflow.draft.saved
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDraftRequest' }
      responses:
        '200':
          description: Saved; body is the new revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /workspaces/{workspaceId}/workflows/{workflowId}/validate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: validateDraft
      summary: Run every compiler check against a draft revision without deploying
      x-orqix-permission: workflow.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Validation report (issues are data, not an error status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflows/{workflowId}/decisions/{decisionKey}/evaluate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/DecisionKey'
    post:
      tags: [Workflows]
      operationId: evaluateDecision
      summary: Test a decision table in a draft with sample values (no side effects)
      x-orqix-permission: workflow.read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionEvaluateRequest' }
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionEvaluateResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /workspaces/{workspaceId}/workflow-organization:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: getWorkflowOrganization
      summary: Folders (with workflow counts), the unfiled count and workflow owners
      description: >
        Folders are labels only. They grant and restrict nothing; the counts describe workflows every caller with
        workflow.read can already list.
      x-orqix-permission: workflow.read
      responses:
        '200':
          description: Workflow organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowOrganization' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/workflow-owner-candidates:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workflows]
      operationId: listWorkflowOwnerCandidates
      summary: People who may be chosen as a workflow owner (they can edit workflows in this workspace today)
      x-orqix-permission: workflow.edit
      responses:
        '200':
          description: Up to 50 people
          content:
            application/json:
              schema:
                type: object
                required: [items]
