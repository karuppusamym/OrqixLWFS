# Daily logical backup at 01:30 UTC (CG-P03). One consistent snapshot (pg_dump -Fc) plus a MANIFEST of row counts and
# a sample request read in the same snapshot, checksums, 14 days of sets on the PVC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orqix-backup
  labels:
    app.kubernetes.io/component: backup
spec:
  schedule: "30 1 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: orqix
            app.kubernetes.io/part-of: orqix
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # REPLACE with your mirrored, digest-pinned PostgreSQL 18 client image (same major as the server).
              image: docker.io/library/postgres:18-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/orqix-backup.sh"]
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
                - name: PGDATABASE
                  value: orqix
                - name: PGSSLMODE
                  value: verify-full
                - name: HOME
                  value: /tmp
              envFrom:
                # PGHOST, PGPORT, PGUSER, PGPASSWORD of a role with pg_read_all_data (secrets.example.yaml).
                - secretRef:
                    name: orqix-backup-db
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: orqix-backups
            - name: scripts
              configMap:
                name: orqix-backup-scripts
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
