# EXAMPLE ONLY - not part of the kustomization. Create these Secrets with real values (sealed secrets, an external
# secrets operator or oc create secret); never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: orqix-backup-db
  labels:
    app.kubernetes.io/name: orqix
    app.kubernetes.io/part-of: orqix
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  PGHOST: REPLACE-postgres-primary.example.internal
  PGPORT: "5432"
  # A role with pg_read_all_data (PostgreSQL 14+) and nothing else: CREATE ROLE orqix_backup LOGIN PASSWORD '...';
  # GRANT pg_read_all_data TO orqix_backup;
  PGUSER: orqix_backup
  PGPASSWORD: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: orqix-restore-drill-db
  labels:
    app.kubernetes.io/name: orqix
    app.kubernetes.io/part-of: orqix
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  # Preferably a separate drill server. The role needs CREATEDB (it creates and drops orqix_drill_* databases only).
  PGHOST: REPLACE-postgres-drill.example.internal
  PGPORT: "5432"
  PGUSER: orqix_drill
  PGPASSWORD: REPLACE
