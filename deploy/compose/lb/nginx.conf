# Load balancer for the scale overlay (docker-compose.scale.yml, docs/build/S92). DEVELOPMENT ONLY.
# Plain round robin, NO sticky sessions: the session lives in PostgreSQL (Spring Session JDBC), so any replica can serve
# any request, including the OAuth2 login callback (the authorization request is stored in that session).
worker_processes 2;
events { worker_connections 2048; }

http {
    access_log off;
    # Docker's embedded DNS: re-resolve so a restarted replica (new IP) is found again.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream orqix {
        # Passive health: one failed connect takes a replica out for 5 s; the request is retried on the other one.
        server orqix:8080 max_fails=1 fail_timeout=5s;
        server orqix-2:8080 max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 11m;   # app limit 10 MiB + 64 KiB (multipart); the app enforces the exact limit

        location / {
            proxy_pass http://orqix;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # forward-headers-strategy: framework -> {baseUrl} in the OAuth2 redirect URI is the LB address.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # $http_host carries the published port; X-Forwarded-Port is deliberately NOT sent (it would be the
            # container port 8080 and override it in the redirect URI).
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Fail over only when the request did not reach a replica (connect error) or the replica answered 502/503
            # before processing. nginx never re-sends a POST/PATCH that was already sent (no "non_idempotent"), so the
            # LB cannot duplicate a start or a decision; the client's Idempotency-Key covers its own retries.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 180s;
            add_header X-Orqix-Upstream $upstream_addr always;
        }
    }
}
