# Grafana data source for the Compose observability overlay. In OpenShift, point the dashboards at the
# user-workload-monitoring Thanos querier instead (deploy/observability/README.md).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
