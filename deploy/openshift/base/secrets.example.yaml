# EXAMPLE ONLY - deliberately NOT listed in kustomization.yaml, so it is never applied by accident.
#
# The workloads reference these Secrets by name and key. Create them from the platform's secret tooling (External Secrets,
# Vault agent injector, sealed secrets, or `oc create secret generic ...` run by an administrator) and never commit values.
# A pod whose Secret is missing stays in CreateContainerConfigError, which is the intended loud failure.
---
apiVersion: v1
kind: Secret
metadata:
  name: orqix-db-app            # runtime role orqix_app (DML only) - application pods
type: Opaque
stringData:
  password: "<from the secret manager>"
---
apiVersion: v1
kind: Secret
metadata:
  name: orqix-db-migrator       # DDL owner orqix_migrator - used only by the migration Job
type: Opaque
stringData:
  password: "<from the secret manager>"
---
apiVersion: v1
kind: Secret
metadata:
  name: orqix-app
type: Opaque
stringData:
  cursor-secret: "<random 32+ bytes, identical on every pod; rotating it invalidates open list cursors only>"
  oidc-client-secret: "<client secret of the orqix-web registration at the identity provider>"
---
apiVersion: v1
kind: Secret
metadata:
  name: orqix-ai                # optional; omit it to run with AI assistance disabled (docs/build/S10)
type: Opaque
stringData:
  openrouter-api-key: "<OpenRouter key for this environment; set a credit limit on the key at OpenRouter as well>"
---
apiVersion: v1
kind: Secret
metadata:
  name: orqix-connection-secrets   # mounted at /var/run/secrets/orqix, one key per connection secretRef
type: Opaque
stringData:
  # procurement-api-token: "<token>"   # file name = the secretRef used by the connection binding; file content = the value
  placeholder: ""
