# OPTIONAL and not part of any overlay: needs the Prometheus Operator CRDs (OpenShift user-workload monitoring must be
# enabled for the namespace). Apply separately: oc apply -n orqix-<env> -f optional/servicemonitor.yaml
# Scrapes the management port (8081) of the Service; the NetworkPolicy orqix-allow-monitoring-ingress admits it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orqix
  labels:
    app.kubernetes.io/name: orqix
    app.kubernetes.io/part-of: orqix
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orqix
      app.kubernetes.io/component: app
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scheme: http
