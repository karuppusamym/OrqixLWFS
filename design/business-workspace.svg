<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">Orqix business workflow workspace design</title><desc id="desc">Illustrative task inbox, business workflow studio and proposed execution architecture. Static design only.</desc><rect x="0" y="0" width="1600" height="1180" rx="0" fill="#edf2f5" stroke="none"/><text x="48" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#087e77">ORQIX</text><text x="160" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#163545">Workflows that business teams can own</text><text x="48" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#627985">DESIGN CONCEPT  •  Illustrative data  •  No application behavior is implemented</text><text x="48" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173c4b">01 / Get work done</text><text x="900" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173c4b">02 / Build with business steps</text><rect x="48" y="143" width="828" height="595" rx="14" fill="#ffffff" stroke="#d5e0e6"/><rect x="900" y="143" width="652" height="595" rx="14" fill="#ffffff" stroke="#d5e0e6"/><rect x="49" y="144" width="154" height="593" rx="13" fill="#153b49" stroke="none"/><text x="69" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Orqix</text><text x="69" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#bed4db">Operations workspace</text><text x="75" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c8dce2">Home</text><rect x="60" y="266" width="132" height="37" rx="6" fill="#245d68" stroke="none"/><text x="75" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">My tasks</text><text x="75" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c8dce2">Workflows</text><text x="75" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c8dce2">Runs</text><text x="75" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#c8dce2">Settings</text><text x="69" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Maya Patel</text><text x="69" y="701" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#bbd1d8">Approver</text><text x="228" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650" fill="#173b49">My tasks</text><text x="228" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#647b88">Make a decision. Keep work moving.</text><rect x="228" y="230" width="126" height="27" rx="13" fill="#e6f5ef" stroke="none"/><text x="240" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#116249">Assigned to me  8</text><rect x="365" y="230" width="137" height="27" rx="13" fill="#eff3f6" stroke="none"/><text x="377" y="249" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#4c6472">Available to claim  3</text><rect x="228" y="277" width="618" height="44" rx="6" fill="#f5f8fa" stroke="none"/><text x="243" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#687e89">Request</text><text x="524" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#687e89">Step</text><text x="731" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#687e89">Due</text><rect x="228" y="326" width="618" height="70" rx="7" fill="#eaf7f4" stroke="#add8cf"/><text x="243" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#143e4c">Laptop purchase</text><text x="243" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#607b86">ORQ-1042  ·  Jordan Lee</text><text x="524" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#172e3c">Manager review</text><rect x="716" y="343" width="109" height="27" rx="13" fill="#fff2d6" stroke="none"/><text x="728" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#775817">Today, 4 PM</text><text x="243" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#294857">Supplier setup</text><text x="243" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#71848e">ORQ-1041  ·  Finance</text><text x="524" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#172e3c">Finance review</text><text x="732" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#647b88">Tomorrow</text><path d="M 229 470 L 845 470" stroke="#cad6dd" stroke-width="1" fill="none"/><text x="243" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#173c4b">Laptop purchase</text><text x="243" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f7986">USD 1,800  /  Operations  /  Replacement device</text><rect x="243" y="544" width="588" height="48" rx="6" fill="#f3f7f9" stroke="none"/><text x="256" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#4b6977">Why this needs your approval</text><text x="256" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#647e88">You are in the Operations manager group.</text><text x="243" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#526c79">Comment (required when rejecting)</text><rect x="243" y="628" width="588" height="40" rx="6" fill="#ffffff" stroke="#d1dce2"/><text x="255" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#83939b">Add context for the requester…</text><rect x="588" y="682" width="108" height="36" rx="7" fill="#ffffff" stroke="#ccd8df"/><text x="602" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#294452">Reject</text><rect x="709" y="682" width="122" height="36" rx="7" fill="#087e77" stroke="none"/><text x="723" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Approve</text><text x="922" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#173b49">Purchase approval</text><rect x="1368" y="157" width="161" height="27" rx="13" fill="#eff3f6" stroke="none"/><text x="1380" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#4c6472">Draft  ·  Saved just now</text><text x="922" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#657d8b">Operations / Workflows</text><rect x="922" y="218" width="107" height="36" rx="7" fill="#ffffff" stroke="#ccd8df"/><text x="936" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#294452">Check</text><rect x="1040" y="218" width="92" height="36" rx="7" fill="#ffffff" stroke="#ccd8df"/><text x="1054" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#294452">Test</text><rect x="1425" y="218" width="105" height="36" rx="7" fill="#087e77" stroke="none"/><text x="1439" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Publish</text><path d="M 901 269 L 1551 269" stroke="#cad6dd" stroke-width="1" fill="none"/><rect x="914" y="281" width="387" height="438" rx="8" fill="#f7fafb" stroke="none"/><rect x="1310" y="281" width="229" height="438" rx="8" fill="#ffffff" stroke="#dbe4e9"/><text x="929" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#728792">BUSINESS FLOW</text><text x="1325" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#728792">STEP SETTINGS</text><rect x="982" y="332" width="249" height="63" rx="8" fill="#ffffff" stroke="#cfdde4"/><rect x="994" y="345" width="5" height="36" rx="2" fill="#b1cbd3" stroke="none"/><text x="1011" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#244a59">Request form</text><text x="1011" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b8591">4 required fields</text><path d="M 1106 395 L 1106 419" stroke="#9fb9c4" stroke-width="2" fill="none"/><rect x="982" y="419" width="249" height="63" rx="8" fill="#ffffff" stroke="#087e77"/><rect x="994" y="432" width="5" height="36" rx="2" fill="#087e77" stroke="none"/><text x="1011" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#244a59">Manager approval</text><text x="1011" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b8591">Managers · Approve or reject</text><path d="M 1106 482 L 1106 506" stroke="#9fb9c4" stroke-width="2" fill="none"/><rect x="982" y="506" width="249" height="63" rx="8" fill="#ffffff" stroke="#cfdde4"/><rect x="994" y="519" width="5" height="36" rx="2" fill="#b1cbd3" stroke="none"/><text x="1011" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#244a59">Check amount</text><text x="1011" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b8591">Finance review at USD 5,000</text><path d="M 1106 569 L 1106 593" stroke="#9fb9c4" stroke-width="2" fill="none"/><rect x="982" y="593" width="249" height="63" rx="8" fill="#ffffff" stroke="#cfdde4"/><rect x="994" y="606" width="5" height="36" rx="2" fill="#b1cbd3" stroke="none"/><text x="1011" y="619" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#244a59">Continue approved path</text><text x="1011" y="639" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b8591">Finance review or procurement API</text><text x="933" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#087e77">+ Add step</text><text x="1325" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#254857">Manager approval</text><text x="1325" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#647e8b">Assign to</text><rect x="1325" y="386" width="199" height="36" rx="6" fill="#f8fafb" stroke="#cfdde3"/><text x="1336" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#244b59">Managers</text><text x="1325" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#647e8b">When rejected</text><rect x="1325" y="458" width="199" height="36" rx="6" fill="#f8fafb" stroke="#cfdde3"/><text x="1336" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#244b59">Finish as rejected</text><text x="1325" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#315868">✓ Require a reason</text><text x="1325" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#315868">✓ Record decision history</text><path d="M 1325 580 L 1523 580" stroke="#cad6dd" stroke-width="1" fill="none"/><text x="1325" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#087e77">Advanced settings  ›</text><text x="1325" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#657c87">Plain language first.</text><text x="1325" y="669" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#657c87">Technical options when</text><text x="1325" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#657c87">the user needs them.</text><text x="48" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#173c4b">03 / One durable execution foundation</text><text x="48" y="816" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#647d89">Business editing compiles to Flowable; the canvas never acts as a second execution engine.</text><rect x="48" y="845" width="305" height="89" rx="10" fill="#ffffff" stroke="#ccdae2"/><text x="68" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#244a59">React business workspace</text><text x="68" y="901" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#607c89">Forms · tasks · studio · run history</text><rect x="408" y="845" width="377" height="89" rx="10" fill="#ffffff" stroke="#ccdae2"/><text x="428" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#244a59">Java application + Flowable</text><text x="428" y="901" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#607c89">Authorization · compiler · process + decisions</text><rect x="840" y="845" width="302" height="89" rx="10" fill="#ffffff" stroke="#ccdae2"/><text x="860" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#244a59">PostgreSQL</text><text x="860" y="901" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#607c89">Versions · tasks · jobs · audit</text><rect x="1197" y="845" width="355" height="89" rx="10" fill="#ffffff" stroke="#ccdae2"/><text x="1217" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#244a59">Approved integrations</text><text x="1217" y="901" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#607c89">HTTP first · agents and MCP later</text><path d="M 353 891 L 408 891" stroke="#087e77" stroke-width="3" fill="none"/><path d="M 785 891 L 840 891" stroke="#087e77" stroke-width="3" fill="none"/><path d="M 596 934 L 596 950 L 1374 950 L 1374 934" stroke="#087e77" stroke-width="3" fill="none"/><rect x="48" y="966" width="1504" height="154" rx="12" fill="#153b49" stroke="none"/><text x="72" y="1003" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#7bd0c0">THREE-DAY TARGET</text><text x="72" y="1036" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#ffffff">Submit → Approve → Decide → Call an API → Track the result</text><text x="72" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#c4dbe3">Same production-oriented codebase. Release only after authorization, versioning and recovery checks pass.</text><text x="72" y="1098" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9c9d3">Migration is explicit and loss-aware. AI drafts require review. No credential data is stored in workflow exports.</text><text x="48" y="1150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b818d">Orqix LWFS  /  Product design v0.1  /  7 October 2026</text></svg>